            `keep_keys(metadata, [])`,
          ]
        }

        metric_statements {
          context = "datapoint"
          statements = [
            `set(datapoint.attributes["coding_agent.client"], resource.attributes["coding_agent.client"]) where datapoint.attributes["coding_agent.client"] == nil and resource.attributes["coding_agent.client"] != nil`,
            `set(datapoint.attributes["coding_agent.session.id"], resource.attributes["coding_agent.session.id"]) where datapoint.attributes["coding_agent.session.id"] == nil and resource.attributes["coding_agent.session.id"] != nil`,
            `set(datapoint.attributes["client"], resource.attributes["client"]) where datapoint.attributes["client"] == nil and resource.attributes["client"] != nil`,
            `set(datapoint.attributes["session.id"], resource.attributes["session.id"]) where datapoint.attributes["session.id"] == nil and resource.attributes["session.id"] != nil`,
            `set(datapoint.attributes["coding_agent.repository.id"], resource.attributes["coding_agent.repository.id"]) where datapoint.attributes["coding_agent.repository.id"] == nil and resource.attributes["coding_agent.repository.id"] != nil`,
            `set(datapoint.attributes["vcs.ref.head.name"], resource.attributes["vcs.ref.head.name"]) where datapoint.attributes["vcs.ref.head.name"] == nil and resource.attributes["vcs.ref.head.name"] != nil`,
            `keep_keys(attributes, ["service.name", "host.name", "gen_ai.provider.name", "gen_ai.request.model", "model", "tool", "tool_name", "tool_name_safe", "status", "success", "kind", "token_type", "session.id", "auth_mode", "originator", "session_source", "app.version", "app.entrypoint", "query_source", "query_source_safe", "speed", "type", "start_type", "terminal.type", "gen_ai.operation.name", "gen_ai.response.service_tier", "gen_ai.token.type", "gen_ai.tool.name", "gen_ai.response.finish_reason", "pi.gen_ai.agent.id", "pi.gen_ai.agent.name", "pi.omp.tool.status", "error.type", "decision", "language", "coding_agent.client", "coding_agent.session.id", "client", "service.instance.id", "coding_agent.repository.id", "vcs.ref.head.name", "conversation.id", "gen_ai.conversation.id"])`,
            `set(datapoint.attributes["datalake.temporality"], metric.aggregation_temporality) where IsMatch(metric.name, "^(claude_code[.]lines_of_code[.]count|claude_code[.]code_edit_tool[.]decision|claude_code[.]commit[.]count|claude_code[.]pull_request[.]count|claude_code[.]active_time[.]total|coding_agent[.]lines_of_code[.]count|coding_agent[.]code_edit_tool[.]decision|coding_agent[.]commit[.]count|coding_agent[.]pull_request[.]count)$")`,
            `set(datapoint.attributes["datalake.start_time_unix_nano"], datapoint.start_time_unix_nano) where metric.aggregation_temporality == 2 and IsMatch(metric.name, "^(claude_code[.]lines_of_code[.]count|claude_code[.]code_edit_tool[.]decision|claude_code[.]commit[.]count|claude_code[.]pull_request[.]count|claude_code[.]active_time[.]total|coding_agent[.]lines_of_code[.]count|coding_agent[.]code_edit_tool[.]decision|coding_agent[.]commit[.]count|coding_agent[.]pull_request[.]count)$")`,
          ]
        }

        // Exemplar content is a separate context, not datapoint attributes.
        // Infer it: Alloy's explicit context enum does not include exemplar.
        statements {
          metric = [`keep_keys(exemplar.filtered_attributes, [])`]
        }

        output {
          metrics = [otelcol.exporter.otlphttp.greptime.input]
          logs    = [otelcol.exporter.otlphttp.greptime.input]
          traces  = [otelcol.exporter.otlphttp.greptime_traces.input]
        }
      }

      // Logs+metrics exporter: no trace pipeline header here.
      // batch lives INSIDE sending_queue (exporter-level batch{} is rejected
      // by alloy validate in v1.14; source: config_queue.go QueueArguments).
      otelcol.exporter.otlphttp "greptime" {
        client {
          endpoint = sys.env("GREPTIME_HTTP_URL")
          headers = {
            "X-Greptime-DB-Name" = sys.env("GREPTIME_DB"),
            "Authorization"      = "Basic " + encoding.to_base64(sys.env("GREPTIME_USER") + ":" + sys.env("GREPTIME_PASSWORD")),
          }
        }
        logs_endpoint    = sys.env("GREPTIME_HTTP_URL") + "/v1/otlp/v1/logs"
        metrics_endpoint = sys.env("GREPTIME_HTTP_URL") + "/v1/otlp/v1/metrics"
        encoding         = "proto"
        sending_queue {
          enabled           = true
          sizer             = "requests"
          queue_size        = encoding.from_json(sys.env("OTLP_QUEUE_SIZE"))
          num_consumers     = 2
          block_on_overflow = true
          storage           = otelcol.storage.file.queue.handler
          batch {
            min_size      = encoding.from_json(sys.env("OTLP_BATCH_MIN_SIZE"))
            max_size      = encoding.from_json(sys.env("OTLP_BATCH_MAX_SIZE"))
            flush_timeout = sys.env("OTLP_BATCH_FLUSH_TIMEOUT")
          }
        }
        retry_on_failure {
          enabled          = true
          initial_interval = "5s"
          max_interval     = "30s"
          max_elapsed_time = "0s"
        }
      }

      // Traces-only exporter: carries the greptime_trace_v1 pipeline header.
      otelcol.exporter.otlphttp "greptime_traces" {
        client {
          endpoint = sys.env("GREPTIME_HTTP_URL")
          headers = {
            "X-Greptime-DB-Name"      = sys.env("GREPTIME_DB"),
            "X-Greptime-Pipeline-Name" = "greptime_trace_v1",
            "Authorization"           = "Basic " + encoding.to_base64(sys.env("GREPTIME_USER") + ":" + sys.env("GREPTIME_PASSWORD")),
          }
        }
        traces_endpoint = sys.env("GREPTIME_HTTP_URL") + "/v1/otlp/v1/traces"
        encoding        = "proto"
        sending_queue {
          enabled           = true
          sizer             = "requests"
          queue_size        = encoding.from_json(sys.env("OTLP_QUEUE_SIZE"))
          num_consumers     = 2
          block_on_overflow = true
          storage           = otelcol.storage.file.queue.handler
          batch {
            min_size      = encoding.from_json(sys.env("OTLP_BATCH_MIN_SIZE"))
            max_size      = encoding.from_json(sys.env("OTLP_BATCH_MAX_SIZE"))
            flush_timeout = sys.env("OTLP_BATCH_FLUSH_TIMEOUT")
          }
        }
        retry_on_failure {
          enabled          = true
          initial_interval = "5s"
          max_interval     = "30s"
          max_elapsed_time = "0s"
        }
      }

      // Self scrape: no auth. GreptimeDB has its own authenticated scrape
      // below. Optional target lists default to [] (no scrape, no false up=0).
      prometheus.scrape "infra" {
        targets = [
          {"__address__" = "127.0.0.1:12345", "job" = "alloy"},
          {"__address__" = "storage-metrics:9105", "job" = "storage-metrics"},
        ]
        honor_labels    = true
        scrape_interval = sys.env("INFRA_SCRAPE_INTERVAL")
        forward_to      = [prometheus.remote_write.greptime.receiver]
      }

      // Telegraf scrape only when the mqtt profile is on: set
      // TELEGRAF_SCRAPE_TARGETS='[{"__address__":"telegraf:9273","job":"telegraf"}]'.
      prometheus.scrape "telegraf" {
        targets         = encoding.from_json(sys.env("TELEGRAF_SCRAPE_TARGETS"))
        honor_labels    = true
        scrape_interval = sys.env("INFRA_SCRAPE_INTERVAL")
        forward_to      = [prometheus.remote_write.greptime.receiver]
      }

      // Vehicle exporters run on the Pi (remote/Tailscale). Set e.g.
      // VEHICLE_METRICS_TARGETS='[{"__address__":"<pi>:9102","job":"vehicle-raw-recorder"},{"__address__":"<pi>:9103","job":"vehicle-raw-uploader"},{"__address__":"<pi>:9104","job":"vss-recorder"}]'.
      // Empty (default) means no vehicle scrape; dashboards must treat the
      // absent series as not-configured, not as an outage.
      prometheus.scrape "vehicle" {
        targets         = encoding.from_json(sys.env("VEHICLE_METRICS_TARGETS"))
        honor_labels    = true
        scrape_interval = sys.env("INFRA_SCRAPE_INTERVAL")
        forward_to      = [prometheus.remote_write.greptime.receiver]
      }

      // GreptimeDB self metrics need basic auth when auth is enabled.
      prometheus.scrape "greptimedb" {
        targets = [
          {"__address__" = "greptimedb:4000", "job" = "greptimedb"},
        ]
        honor_labels    = true
        scrape_interval = sys.env("INFRA_SCRAPE_INTERVAL")
        basic_auth {
          username = sys.env("GREPTIME_USER")
          password = sys.env("GREPTIME_PASSWORD")
        }
        forward_to = [prometheus.remote_write.greptime.receiver]
      }

      prometheus.remote_write "greptime" {
        endpoint {
          url = sys.env("GREPTIME_HTTP_URL") + "/v1/prometheus/write?db=" + sys.env("GREPTIME_DB")
          basic_auth {
            username = sys.env("GREPTIME_USER")
            password = sys.env("GREPTIME_PASSWORD")
          }
        }
      }
  alloy_home_config:
    content: |
      // Home profile: HA /api/prometheus scrape -> GreptimeDB remote_write. No ingress.
      prometheus.scrape "ha" {
        targets         = [{"__address__" = sys.env("HA_HOST")}]
        scheme          = sys.env("HA_SCHEME")
        metrics_path    = "/api/prometheus"
        scrape_interval = sys.env("HA_SCRAPE_INTERVAL")
        job_name        = "homeassistant"
        bearer_token    = sys.env("HA_TOKEN")
        forward_to      = [prometheus.remote_write.greptime.receiver]
      }

      prometheus.remote_write "greptime" {
        external_labels = {"source" = "homeassistant"}
        endpoint {
          url = sys.env("GREPTIME_HTTP_URL") + "/v1/prometheus/write?db=" + sys.env("GREPTIME_DB")
          basic_auth {
            username = sys.env("GREPTIME_USER")
            password = sys.env("GREPTIME_PASSWORD")
          }
        }
      }
  telegraf_config:
    content: |
      # MQTT consumer -> GreptimeDB InfluxDB v1 API (/v1/influxdb/write). No local broker.
      # Escaped dollars defer credentials to Telegraf's runtime environment.
      # Other interpolation uses Compose-time settings with safe defaults.
      # Disk buffer keys verified in Telegraf v1.40 config.AgentConfig.
      [agent]
        interval = "60s"
        flush_interval = "30s"
        metric_batch_size = 1000
        metric_buffer_limit = 10000
        buffer_strategy = "disk_write_through"
        buffer_directory = "/var/lib/telegraf/buffer"
        buffer_disk_sync = true

      [[inputs.mqtt_consumer]]
        servers = ["${MQTT_BROKER:-tcp://127.0.0.1:1883}"]
        topics = ${MQTT_TOPICS:-["home/#"]}
        topic_tag = "topic"
        qos = 1
        persistent_session = true
        client_id = "${MQTT_CLIENT_ID:-doda-datalake-telegraf}"
        username = "$${MQTT_USERNAME}"
        password = "$${MQTT_PASSWORD}"
        max_undelivered_messages = 1000
        data_format = "${MQTT_DATA_FORMAT:-json}"

      [[inputs.internal]]
        collect_memstats = false

      [[outputs.influxdb]]
        urls = ["${GREPTIME_HTTP_URL:-http://greptimedb:4000}/v1/influxdb"]
        database = "${GREPTIME_DB:-datalake}"
        username = "$${GREPTIME_USER}"
        password = "$${GREPTIME_PASSWORD}"
        skip_database_creation = true
        timeout = "10s"

      # internal_* only: mqtt_consumer measurements stay in GreptimeDB via the
      # influxdb output; re-exposing them here would double-ingest on scrape.
      [[outputs.prometheus_client]]
        listen = ":9273"
        path = "/metrics"
        namepass = ["internal_*"]
  grafana-datasources:
    content: |
      apiVersion: 1
      datasources:
        - name: Greptime-Prom
          type: prometheus
          uid: greptime-prom
          access: proxy
          url: http://greptimedb:4000/v1/prometheus
          basicAuth: true
          basicAuthUser: $$GREPTIME_USER
          jsonData:
            httpMethod: POST
            httpHeaderName1: x-greptime-db-name
          secureJsonData:
            basicAuthPassword: $$GREPTIME_PASSWORD
            httpHeaderValue1: $$GREPTIME_DB
        - name: Greptime-MySQL
          type: mysql
          uid: greptime-mysql
          access: proxy
          url: greptimedb:4002
          database: $$GREPTIME_DB
          user: $$GREPTIME_USER
          jsonData:
            maxOpenConns: 5
            maxIdleConns: 2
            connMaxLifetime: 60
            timezone: UTC
          secureJsonData:
            password: $$GREPTIME_PASSWORD
  grafana-dashboards:
    content: |
      apiVersion: 1
      providers:
        - name: datalake
          folder: Datalake
          type: file
          allowUiUpdates: false
          options:
            path: /etc/grafana/provisioning/dashboards/json
  grafana-dash-overview:
    content: |
      {"uid":"datalake-overview","title":"Overview","tags":["datalake"],"timezone":"Asia/Seoul","schemaVersion":39,"version":1,"time":{"from":"now-24h","to":"now"},"panels":[
      {"id":1,"type":"dashlist","title":"Datalake dashboards","fieldConfig":{"defaults":{},"overrides":[]},"options":{"showStarred":false,"showRecentlyViewed":false,"showSearch":true,"showHeadings":true},"gridPos":{"h":8,"w":12,"x":0,"y":0}},
      {"id":2,"type":"stat","title":"OTel spans (range, deduped)","description":"Retransmitted spans deduped by (trace_id, span_id); raw COUNT(*) would double-count retries.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT COUNT(*) AS spans FROM (SELECT DISTINCT trace_id, span_id FROM opentelemetry_traces WHERE $$__timeFilter(timestamp)) AS dedup","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"colorMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto"},"gridPos":{"h":8,"w":6,"x":12,"y":0}},
      {"id":3,"type":"stat","title":"Vehicle rows (range)","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT COUNT(*) AS rows FROM vehicle_signal WHERE $$__timeFilter(event_time)","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"colorMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto"},"gridPos":{"h":8,"w":6,"x":12,"y":8}},
      {"id":4,"type":"stat","title":"Last OTel span","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT CAST(MAX(timestamp) AS TIMESTAMP(6)) AS last_span FROM opentelemetry_traces","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"dateTimeAsIso","thresholds":{"mode":"absolute","steps":[{"value":null,"color":"green"}]},"noValue":"No data"},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"/.*/","values":false},"orientation":"auto","textMode":"auto","colorMode":"none"},"gridPos":{"h":8,"w":6,"x":0,"y":8}},
      {"id":5,"type":"stat","title":"Last vehicle sample","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT CAST(MAX(event_time) AS TIMESTAMP(6)) AS last_sample FROM vehicle_signal","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"dateTimeAsIso","thresholds":{"mode":"absolute","steps":[{"value":null,"color":"green"}]},"noValue":"No data"},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"/.*/","values":false},"orientation":"auto","textMode":"auto","colorMode":"none"},"gridPos":{"h":8,"w":6,"x":6,"y":8}}
      ]}
  grafana-dash-ai-usage:
    content: |
      {"uid":"datalake-ai-usage","title":"AI Usage","tags":["datalake","ai"],"timezone":"Asia/Seoul","schemaVersion":39,"version":1,"time":{"from":"now-30d","to":"now"},"panels":[
      {"id":1,"type":"timeseries","title":"Tokens per day by model (summary)","description":"Observed daily usage from ai_daily_summary. Usage is source-selected, not summed across native and hook copies. Native Claude usage is authoritative; Codex turn-cost receipts replace overlapping per-call estimates. cost_source records provenance; reported estimates are not billing invoices. Missing values stay NULL.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT day_start AS `time`, model, SUM(input_tokens) AS input_tokens, SUM(output_tokens) AS output_tokens FROM ai_daily_summary WHERE $$__timeFilter(day_start) GROUP BY `time`, model ORDER BY `time` ASC","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","showLegend":true},"tooltip":{"mode":"multi","sort":"none"}},"gridPos":{"h":8,"w":24,"x":0,"y":0}},
      {"id":2,"type":"table","title":"Tokens per day per client/model (summary)","description":"Observed daily usage from ai_daily_summary. Usage is source-selected, not summed across native and hook copies. Native Claude usage is authoritative; Codex turn-cost receipts replace overlapping per-call estimates. cost_source records provenance; reported estimates are not billing invoices. Missing values stay NULL.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT day_start AS `day`, client, provider, model, input_tokens, output_tokens, cache_read_tokens, cache_write_tokens, reasoning_tokens, total_tokens, cost_usd, cost_source, llm_spans, active_sessions FROM ai_daily_summary WHERE $$__timeFilter(day_start) ORDER BY `day` DESC LIMIT 500","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":24,"x":0,"y":8}},
      {"id":3,"type":"stat","title":"Spans missing token attrs (null, not zero)","description":"Raw-span diagnostic: native OTel attributes absent on these spans; shown as missing, never as 0. Deduped by (trace_id, span_id).","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT COUNT(*) AS spans_missing_tokens FROM (SELECT DISTINCT trace_id, span_id FROM opentelemetry_traces WHERE $$__timeFilter(timestamp) AND `span_attributes.gen_ai.usage.input_tokens` IS NULL AND `span_attributes.gen_ai.usage.output_tokens` IS NULL) AS dedup","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"colorMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto"},"gridPos":{"h":8,"w":8,"x":0,"y":16}},
      {"id":4,"type":"table","title":"Error spans (deduped)","description":"Retransmitted error spans deduped by (trace_id, span_id).","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT service_name, span_name, COUNT(*) AS errors FROM (SELECT DISTINCT trace_id, span_id, service_name, span_name FROM opentelemetry_traces WHERE $$__timeFilter(timestamp) AND span_status_code = 'STATUS_CODE_ERROR') AS dedup GROUP BY service_name, span_name ORDER BY errors DESC LIMIT 50","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":16,"x":8,"y":16}},
      {"id":5,"type":"table","title":"Sessions (summary)","description":"Identity is (client, session_id). Usage is source-selected, not summed across native and hook copies. Native Claude usage is authoritative; Codex turn-cost receipts replace overlapping per-call estimates. cost_source records provenance; reported estimates are not billing invoices. Missing values stay NULL. Modified LOC, accepted/rejected added LOC, native active time, and observed session wall time are distinct. Repository is SHA256 only; branch and outcome require explicit source metadata. All observed session models are preserved as a JSON set.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT session_id, client, provider, models, model_count, CAST(session_start AS TIMESTAMP(6)) AS session_start, CAST(session_end AS TIMESTAMP(6)) AS session_end, duration_s, input_tokens, output_tokens, total_tokens, cost_usd, cost_source, llm_spans, tool_calls, error_count, subagents, lines_added, lines_removed, lines_accepted, lines_rejected, edit_accept_count, edit_reject_count, commit_count, pr_count, active_user_seconds, active_cli_seconds, session_wall_seconds, repo, branch, outcome, activity_sources FROM ai_session_summary WHERE $$__timeFilter(session_start) ORDER BY session_start DESC LIMIT 100","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":24,"x":0,"y":24}}
      ]}
  grafana-dash-ai-tools:
    content: |
      {"uid":"datalake-ai-tools","title":"AI Tools","tags":["datalake","ai"],"timezone":"Asia/Seoul","schemaVersion":39,"version":1,"time":{"from":"now-30d","to":"now"},"panels":[
      {"id":1,"type":"table","title":"Tool calls per day (summary)","description":"ai_tool_daily rows deduped at aggregate time; no raw-span double counting. Empty means no aggregates yet (absence).","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT day_start AS `day`, tool_name AS tool, client, calls, errors, avg_duration_ms FROM ai_tool_daily WHERE $$__timeFilter(day_start) ORDER BY `day` DESC LIMIT 500","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":16,"x":0,"y":0}},
      {"id":2,"type":"stat","title":"Distinct tools (summary)","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT COUNT(DISTINCT tool_name) AS tools FROM ai_tool_daily WHERE $$__timeFilter(day_start)","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"colorMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto"},"gridPos":{"h":8,"w":8,"x":16,"y":0}},
      {"id":3,"type":"timeseries","title":"Tool latency, recent raw spans (ms)","description":"Raw-span diagnostic; retransmissions deduped by (trace_id, span_id). Latest 2000 tool spans, plotted oldest to newest; the inner query picks the recent window, the outer query restores chronological order.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT CAST(`time` AS TIMESTAMP(6)) AS `time`, client, tool, ms FROM (SELECT DISTINCT trace_id, span_id, COALESCE(`span_attributes.coding_agent.client`, service_name) AS client, timestamp AS `time`, `span_attributes.gen_ai.tool.name` AS tool, duration_nano / 1000000.0 AS ms FROM opentelemetry_traces WHERE $$__timeFilter(timestamp) AND `span_attributes.gen_ai.tool.name` IS NOT NULL AND duration_nano IS NOT NULL ORDER BY timestamp DESC LIMIT 2000) AS recent ORDER BY `time` ASC","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","showLegend":true},"tooltip":{"mode":"multi","sort":"none"}},"gridPos":{"h":8,"w":24,"x":0,"y":8}},
      {"id":4,"type":"table","title":"Recent tool errors","description":"Error spans by service/span/tool; span_status_message is privacy-redacted at ingest (non-empty shows redacted), so only identity and timing are shown, never message content.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT CAST(timestamp AS TIMESTAMP(6)) AS timestamp, service_name, span_name, `span_attributes.gen_ai.tool.name` AS tool, span_status_message FROM opentelemetry_traces WHERE $$__timeFilter(timestamp) AND span_status_code = 'STATUS_CODE_ERROR' ORDER BY timestamp DESC LIMIT 100","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":24,"x":0,"y":16}}
      ]}
  grafana-dash-ai-sessions:
    content: |
      {"uid":"datalake-ai-sessions","title":"AI Sessions","tags":["datalake","ai"],"timezone":"Asia/Seoul","schemaVersion":39,"version":1,"time":{"from":"now-30d","to":"now"},"panels":[
      {"id":1,"type":"table","title":"Sessions (summary)","description":"Identity is (client, session_id). Usage is source-selected, not summed across native and hook copies. Native Claude usage is authoritative; Codex turn-cost receipts replace overlapping per-call estimates. cost_source records provenance; reported estimates are not billing invoices. Missing values stay NULL. Modified LOC, accepted/rejected added LOC, native active time, and observed session wall time are distinct. Repository is SHA256 only; branch and outcome require explicit source metadata. All observed session models are preserved as a JSON set.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT session_id, client, provider, models, model_count, CAST(session_start AS TIMESTAMP(6)) AS session_start, CAST(session_end AS TIMESTAMP(6)) AS session_end, duration_s, input_tokens, output_tokens, total_tokens, cost_usd, cost_source, llm_spans, tool_calls, error_count, subagents, lines_added, lines_removed, lines_accepted, lines_rejected, edit_accept_count, edit_reject_count, commit_count, pr_count, active_user_seconds, active_cli_seconds, session_wall_seconds, repo, branch, outcome, activity_sources FROM ai_session_summary WHERE $$__timeFilter(session_start) ORDER BY session_start DESC LIMIT 100","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":24,"x":0,"y":0}},
      {"id":2,"type":"stat","title":"Sessions with id (summary, range)","description":"Session identity is (client, session_id); the same id across clients counts separately. Empty means no aggregates yet (absence), not zero.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT COUNT(*) AS sessions FROM (SELECT DISTINCT client, session_id FROM ai_session_summary WHERE $$__timeFilter(session_start)) AS sessions_scoped","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"colorMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto"},"gridPos":{"h":8,"w":12,"x":0,"y":8}},
      {"id":3,"type":"stat","title":"Spans without session id (null)","description":"Raw-span diagnostic across supported canonical/native session keys; missing identity is not a zero session count.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT COUNT(*) AS spans_no_session FROM (SELECT DISTINCT trace_id, span_id FROM opentelemetry_traces WHERE $$__timeFilter(timestamp) AND COALESCE(NULLIF(`span_attributes.coding_agent.session.id`, ''), NULLIF(`span_attributes.session.id`, ''), NULLIF(`span_attributes.conversation.id`, ''), NULLIF(`span_attributes.gen_ai.conversation.id`, '')) IS NULL) AS dedup","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"colorMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto"},"gridPos":{"h":8,"w":12,"x":12,"y":8}},
      {"id":4,"type":"table","title":"Spans per day (deduped)","description":"Retransmitted spans deduped by (trace_id, span_id).","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT `day`, COUNT(*) AS spans FROM (SELECT DISTINCT trace_id, span_id, CAST(timestamp AS DATE) AS `day` FROM opentelemetry_traces WHERE $$__timeFilter(timestamp)) AS dedup GROUP BY `day` ORDER BY `day` ASC","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":12,"x":0,"y":16}},
      {"id":5,"type":"table","title":"Logs per day (ai_log_daily summary)","description":"ai_log_daily rollups by scope/severity; empty means no log aggregates yet (absence), not zero. Raw opentelemetry_logs remain queryable; body content is privacy-redacted at ingest so only counts are shown here.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT day_start AS `day`, scope_name, severity_text, log_count, error_count FROM ai_log_daily WHERE $$__timeFilter(day_start) ORDER BY `day` DESC LIMIT 500","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":12,"x":12,"y":16}},{"id":6,"type":"table","title":"Daily activity (ai_activity_daily)","description":"ai_activity_daily rows keyed by (client, day_start); per-day rollups of subagents, modified vs accepted/rejected ADDED LOC, edit decisions, commits/PRs, and native active vs observed wall seconds. lines_added/removed are modified LOC; lines_accepted/rejected are accepted/rejected ADDED lines only (explicit decisions, never inferred). active_user/cli_seconds are native active counters; session_wall_seconds is the union of observed session intervals clipped per UTC day, not active time. NULL means unknown/unsupported, never zero-filled; activity_sources names the producer per field. Empty means no aggregates yet (absence).","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT day_start AS `day`, client, subagents, lines_added, lines_removed, lines_accepted, lines_rejected, edit_accept_count, edit_reject_count, commit_count, pr_count, active_user_seconds, active_cli_seconds, session_wall_seconds, activity_sources FROM ai_activity_daily WHERE $$__timeFilter(day_start) ORDER BY `day` DESC LIMIT 500","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":24,"x":0,"y":24}}
      ]}
  grafana-dash-vehicle-overview:
    content: |
      {"uid":"datalake-vehicle-overview","title":"Vehicle Overview","tags":["datalake","vehicle"],"timezone":"Asia/Seoul","schemaVersion":39,"version":1,"time":{"from":"now-7d","to":"now"},"templating":{"list":[{"name":"signal","type":"textbox","label":"VSS path","query":"Vehicle.Speed","current":{"text":"Vehicle.Speed","value":"Vehicle.Speed"}}]},"panels":[
      {"id":1,"type":"stat","title":"Vehicles","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT COUNT(DISTINCT vehicle) AS vehicles FROM vehicle_signal WHERE $$__timeFilter(event_time)","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"colorMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto"},"gridPos":{"h":8,"w":8,"x":0,"y":0}},
      {"id":2,"type":"stat","title":"Distinct paths","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT COUNT(DISTINCT path) AS paths FROM vehicle_signal WHERE $$__timeFilter(event_time)","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"colorMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto"},"gridPos":{"h":8,"w":8,"x":8,"y":0}},
      {"id":3,"type":"stat","title":"Last sample","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT CAST(MAX(event_time) AS TIMESTAMP(6)) AS last_sample FROM vehicle_signal","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"dateTimeAsIso","thresholds":{"mode":"absolute","steps":[{"value":null,"color":"green"}]},"noValue":"No data"},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"/.*/","values":false},"orientation":"auto","textMode":"auto","colorMode":"none"},"gridPos":{"h":8,"w":8,"x":16,"y":0}},
      {"id":4,"type":"timeseries","title":"Signal: $$signal","description":"Latest 5000 samples of the path, plotted oldest to newest; the inner query picks the recent window, the outer query restores chronological order.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT `time`, vehicle, source, decode_epoch, value FROM (SELECT CAST(event_time AS TIMESTAMP(6)) AS `time`, vehicle, source, decode_epoch, value_num AS value FROM vehicle_signal WHERE path = $${signal:sqlstring} AND value_num IS NOT NULL AND $$__timeFilter(event_time) ORDER BY event_time DESC LIMIT 5000) AS recent ORDER BY `time` ASC","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"legend":{"displayMode":"list","placement":"bottom","showLegend":true},"tooltip":{"mode":"single","sort":"none"}},"gridPos":{"h":8,"w":24,"x":0,"y":8}},
      {"id":5,"type":"table","title":"Recent samples","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT CAST(event_time AS TIMESTAMP(6)) AS event_time, vehicle, path, source, value_num, value_text, value_bool, unit FROM vehicle_signal WHERE $$__timeFilter(event_time) ORDER BY event_time DESC LIMIT 100","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":24,"x":0,"y":16}}
      ]}
  grafana-dash-can-vss:
    content: |
      {"uid":"datalake-vehicle-can-vss","title":"CAN / VSS","tags":["datalake","vehicle"],"timezone":"Asia/Seoul","schemaVersion":39,"version":1,"time":{"from":"now-7d","to":"now"},"panels":[
      {"id":1,"type":"table","title":"Decode epochs","description":"Vehicle/source/epoch lineage. Supplemental commit is present only when that DBC is used; replacement overrides report their version and optional commit. Original artifact hashes remain in the immutable generation manifest.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT vehicle, decode_epoch, vehicle_firmware, vss_version, dbc_primary_commit, dbc_supplemental_commit, dbc_override_version, dbc_override_commit, mapping_revision, source, COUNT(*) AS rows, CAST(MIN(event_time) AS TIMESTAMP(6)) AS first_seen, CAST(MAX(event_time) AS TIMESTAMP(6)) AS last_seen FROM vehicle_signal WHERE $$__timeFilter(event_time) GROUP BY vehicle, decode_epoch, vehicle_firmware, vss_version, dbc_primary_commit, dbc_supplemental_commit, dbc_override_version, dbc_override_commit, mapping_revision, source ORDER BY decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":24,"x":0,"y":0}},
      {"id":2,"type":"table","title":"Samples per day per source (can vs fleet)","description":"Source 'fleet' rows, if any, come from a different producer; an empty table or a missing fleet row means nothing stored (absence), not zero.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT CAST(event_time AS DATE) AS `day`, source, COUNT(*) AS rows, COUNT(DISTINCT path) AS paths FROM vehicle_signal WHERE $$__timeFilter(event_time) GROUP BY `day`, source ORDER BY `day` ASC","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":12,"x":0,"y":8}},
      {"id":3,"type":"stat","title":"Distinct paths (can)","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT NULLIF(COUNT(DISTINCT path), 0) AS paths_can FROM vehicle_signal WHERE $$__timeFilter(event_time) AND source = 'can'","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"No CAN data"},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto","colorMode":"none"},"gridPos":{"h":8,"w":6,"x":12,"y":8}},
      {"id":4,"type":"stat","title":"Distinct paths (fleet)","description":"Missing Fleet rows mean no stored Fleet input in this range, not a measured zero.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT NULLIF(COUNT(DISTINCT path), 0) AS paths_fleet FROM vehicle_signal WHERE $$__timeFilter(event_time) AND source = 'fleet'","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"No Fleet data"},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto","colorMode":"none"},"gridPos":{"h":8,"w":6,"x":18,"y":8}},
      {"id":5,"type":"timeseries","title":"Hourly rollup (vehicle_agg, 1h)","description":"vehicle_agg hourly rollups written by aggregate.py, separated by decode_epoch so re-decodes never merge; empty means no aggregates yet (absence). Raw signal panels above remain the fallback.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT window_start AS `time`, vehicle, source, path, decode_epoch, avg_value AS value FROM vehicle_agg WHERE resolution = '1h' AND $$__timeFilter(window_start) ORDER BY `time` ASC LIMIT 5000","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","showLegend":true},"tooltip":{"mode":"multi","sort":"none"}},"gridPos":{"h":8,"w":24,"x":0,"y":16}}
      ]}
  grafana-dash-drives:
    content: |
      {"uid":"datalake-vehicle-drives","title":"Drives","tags":["datalake","vehicle"],"timezone":"Asia/Seoul","schemaVersion":39,"version":1,"time":{"from":"now-7d","to":"now"},"templating":{"list":[{"name":"speed_path","type":"textbox","label":"Speed VSS path","query":"Vehicle.Speed","current":{"text":"Vehicle.Speed","value":"Vehicle.Speed"}}]},"panels":[
      {"id":1,"type":"timeseries","title":"Speed: $$speed_path","description":"Latest 5000 speed samples, plotted oldest to newest; the inner query picks the recent window, the outer query restores chronological order.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT `time`, vehicle, source, decode_epoch, speed FROM (SELECT CAST(event_time AS TIMESTAMP(6)) AS `time`, vehicle, source, decode_epoch, value_num AS speed FROM vehicle_signal WHERE path = $${speed_path:sqlstring} AND value_num IS NOT NULL AND $$__timeFilter(event_time) ORDER BY event_time DESC LIMIT 5000) AS recent ORDER BY `time` ASC","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"legend":{"displayMode":"list","placement":"bottom","showLegend":true},"tooltip":{"mode":"single","sort":"none"}},"gridPos":{"h":8,"w":24,"x":0,"y":0}},
      {"id":2,"type":"table","title":"Speed stats by vehicle / source / epoch","description":"Only samples from the same vehicle, source, decode epoch, and stored unit are combined. CAN and Fleet are never averaged together.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT vehicle, source, decode_epoch, unit, COUNT(*) AS n, AVG(value_num) AS avg_speed, MAX(value_num) AS max_speed FROM vehicle_signal WHERE path = $${speed_path:sqlstring} AND value_num IS NOT NULL AND $$__timeFilter(event_time) GROUP BY vehicle, source, decode_epoch, unit","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":12,"x":0,"y":8}},
      {"id":3,"type":"table","title":"Recent speed rows","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT CAST(event_time AS TIMESTAMP(6)) AS event_time, vehicle, source, value_num, unit, decode_epoch, vehicle_firmware FROM vehicle_signal WHERE path = $${speed_path:sqlstring} AND $$__timeFilter(event_time) ORDER BY event_time DESC LIMIT 100","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":12,"x":12,"y":8}},
      {"id":4,"type":"table","title":"Trips (trip_summary)","description":"Observed trips remain separate by vehicle/source/decode_epoch. ended_at=NULL marks an ongoing trip; its start anchor survives rolling lookback. Distance is a speed integral. energy_kwh requires a bounded, unbroken drive-counter baseline; missing units or resets yield NULL. Wh/km = energy_kwh*1000/NULLIF(distance_km,0).","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT trip_id, vehicle, source, decode_epoch, CAST(started_at AS TIMESTAMP(6)) AS started_at, CAST(ended_at AS TIMESTAMP(6)) AS ended_at, duration_s, distance_km, energy_kwh, energy_kwh * 1000 / NULLIF(distance_km, 0) AS wh_per_km, avg_speed_kph, start_soc, end_soc FROM trip_summary WHERE $$__timeFilter(started_at) ORDER BY started_at DESC LIMIT 100","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":24,"x":0,"y":16}}
      ]}
  grafana-dash-charging:
    content: |
      {"uid":"datalake-vehicle-charging","title":"Charging","tags":["datalake","vehicle"],"timezone":"Asia/Seoul","schemaVersion":39,"version":1,"time":{"from":"now-7d","to":"now"},"panels":[
      {"id":1,"type":"table","title":"Battery/charging paths present","description":"Data-driven path discovery; empty means no such signals stored, not zero.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT DISTINCT path, unit FROM vehicle_signal WHERE (path LIKE '%atter%' OR path LIKE '%harg%' OR path LIKE '%SOC%' OR path LIKE '%Energy%') AND $$__timeFilter(event_time) ORDER BY path","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":24,"x":0,"y":0}},
      {"id":2,"type":"timeseries","title":"Battery/charging values","description":"Latest 5000 battery/charging samples, plotted oldest to newest; the inner query picks the recent window, the outer query restores chronological order.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT `time`, vehicle, source, decode_epoch, path, value FROM (SELECT CAST(event_time AS TIMESTAMP(6)) AS `time`, vehicle, source, decode_epoch, path, value_num AS value FROM vehicle_signal WHERE (path LIKE '%atter%' OR path LIKE '%harg%' OR path LIKE '%SOC%' OR path LIKE '%Energy%') AND value_num IS NOT NULL AND $$__timeFilter(event_time) ORDER BY event_time DESC LIMIT 5000) AS recent ORDER BY `time` ASC","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","showLegend":true},"tooltip":{"mode":"multi","sort":"none"}},"gridPos":{"h":8,"w":24,"x":0,"y":8}},
      {"id":3,"type":"table","title":"Recent battery/charging rows","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT CAST(event_time AS TIMESTAMP(6)) AS event_time, vehicle, path, source, value_num, value_text, unit, decode_epoch FROM vehicle_signal WHERE (path LIKE '%atter%' OR path LIKE '%harg%' OR path LIKE '%SOC%' OR path LIKE '%Energy%') AND $$__timeFilter(event_time) ORDER BY event_time DESC LIMIT 100","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":24,"x":0,"y":16}},
      {"id":4,"type":"table","title":"Charge sessions (charge_session)","description":"Charging requires explicit charging state, dedicated charging power, or a charge-counter increase; SOC rise alone is insufficient. ended_at=NULL marks an ongoing session. Energy uses charge-counter delta, then measured power integration, else NULL; never inferred from battery capacity. Source/epoch groups never merge.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT session_id, vehicle, source, decode_epoch, CAST(started_at AS TIMESTAMP(6)) AS started_at, CAST(ended_at AS TIMESTAMP(6)) AS ended_at, duration_s, energy_added_kwh, start_soc, end_soc, avg_power_kw, max_power_kw FROM charge_session WHERE $$__timeFilter(started_at) ORDER BY started_at DESC LIMIT 100","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":24,"x":0,"y":24}}
      ]}
  grafana-dash-dbc-health:
    content: |
      {"uid":"datalake-vehicle-dbc-health","title":"DBC Health","tags":["datalake","vehicle"],"timezone":"Asia/Seoul","schemaVersion":39,"version":1,"time":{"from":"now-30d","to":"now"},"panels":[
      {"id":1,"type":"table","title":"Decode epoch lineage","description":"Vehicle/source/epoch lineage. Supplemental commit is present only when that DBC is used; replacement overrides report their version and optional commit. Original artifact hashes remain in the immutable generation manifest.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT vehicle, source, decode_epoch, vehicle_firmware, dbc_primary_commit, dbc_supplemental_commit, dbc_override_version, dbc_override_commit, mapping_revision, collector_version, COUNT(*) AS rows, CAST(MIN(event_time) AS TIMESTAMP(6)) AS first_seen, CAST(MAX(event_time) AS TIMESTAMP(6)) AS last_seen FROM vehicle_signal WHERE $$__timeFilter(event_time) GROUP BY vehicle, source, decode_epoch, vehicle_firmware, dbc_primary_commit, dbc_supplemental_commit, dbc_override_version, dbc_override_commit, mapping_revision, collector_version ORDER BY decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":24,"x":0,"y":0}},
      {"id":2,"type":"stat","title":"Rows missing firmware","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT COUNT(*) AS rows_no_firmware FROM vehicle_signal WHERE $$__timeFilter(event_time) AND NULLIF(vehicle_firmware, '') IS NULL","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"colorMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto"},"gridPos":{"h":8,"w":8,"x":0,"y":8}},
      {"id":3,"type":"stat","title":"CAN rows missing DBC provenance","description":"CAN requires a primary commit plus the used supplemental commit or applied override version. Override commit is optional. Fleet rows do not use DBC decoding and are excluded.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT COUNT(*) AS rows_no_dbc FROM vehicle_signal WHERE $$__timeFilter(event_time) AND source <> 'fleet' AND (NULLIF(dbc_primary_commit, '') IS NULL OR (NULLIF(dbc_supplemental_commit, '') IS NULL AND NULLIF(dbc_override_version, '') IS NULL))","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"colorMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto"},"gridPos":{"h":8,"w":8,"x":8,"y":8}},
      {"id":4,"type":"stat","title":"Rows without unit metadata","description":"Dimensionless flags may legitimately have no unit.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT COUNT(*) AS rows_no_unit FROM vehicle_signal WHERE $$__timeFilter(event_time) AND NULLIF(unit, '') IS NULL","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"colorMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto"},"gridPos":{"h":8,"w":8,"x":16,"y":8}},
      {"id":5,"type":"text","title":"Validation coverage","fieldConfig":{"defaults":{},"overrides":[]},"options":{"content":"Raw recorder :9102 reports spool/drop/finalize state and can_validation_* after sealing each chunk. Validation uses the hash-verified epoch DBCs; checksum, expected-signal and cross-signal checks require explicit CAN_VALIDATION_* rules. Unconfigured checks are absent, not healthy zero. Uploader :9103 reports local backlog, verified uploads and actual bucket inventory. VSS :9104 reports durable outbox delivery. Set VEHICLE_METRICS_TARGETS to reachable Pi/Tailnet endpoints; the empty default performs no vehicle scrape. Validation labels identify vehicle and decode_epoch; canonical lineage and immutable manifests remain authoritative.","mode":"markdown"},"gridPos":{"h":8,"w":24,"x":0,"y":16}},
      {"id":6,"type":"table","title":"Raw spool/upload (Prom, instant; vehicle scrape opt-in)","description":"Queries the verbatim raw_recorder_*/raw_uploader_* series from the vehicle scrape jobs vehicle-raw-recorder (:9102) and vehicle-raw-uploader (:9103), driven by VEHICLE_METRICS_TARGETS (default empty = no scrape). Missing means not configured (absence), never zero and never an outage.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","expr":"{__name__=~\"raw_recorder_.*|raw_uploader_.*\",job=~\"vehicle-raw-recorder|vehicle-raw-uploader\"}","format":"table","instant":true,"datasource":{"type":"prometheus","uid":"greptime-prom"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":24,"x":0,"y":24}},
      {"id":7,"type":"table","title":"VSS outbox (Prom, instant; vehicle scrape opt-in)","description":"Missing vss_* series mean no configured vehicle scrape, not zero backlog.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","expr":"{__name__=~\"vss_.*\",job=\"vss-recorder\"}","format":"table","instant":true,"datasource":{"type":"prometheus","uid":"greptime-prom"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":24,"x":0,"y":32}},
      {"id":8,"type":"table","title":"DBC validation by vehicle / epoch","description":"Observed sealed-chunk coverage, unknown IDs, decode/invalid/checksum errors and configured signal checks. Check configured and last-success series before interpreting counters.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","expr":"{__name__=~\"can_validation_.*\",job=\"vehicle-raw-recorder\"}","format":"table","instant":true,"datasource":{"type":"prometheus","uid":"greptime-prom"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":10,"w":24,"x":0,"y":40}},
