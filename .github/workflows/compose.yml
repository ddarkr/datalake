name: Compose validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan working tree and full history with pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -eu
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/gitleaks" dir . --redact=100 --ignore-gitleaks-allow
          "$RUNNER_TEMP/gitleaks" git . --redact=100 --ignore-gitleaks-allow \
            --log-opts="--all --full-history"
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install renderer and pinned synthetic CAN/RAW dependencies
        run: |
          python -m pip install --only-binary=:all: PyYAML==6.0.2 \
            python-can==4.6.1 asammdf==8.8.27 zstd==1.5.6.1 \
            cantools==40.7.1 py-expression-eval==0.3.14 boto3==1.43.98 \
            opentelemetry-proto==1.38.0 grpcio==1.84.0 pyarrow==25.0.1 protobuf==6.33.6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/package-lock.json
      - name: Check coding-agent plugin privacy and installers
        run: |
          npm ci --prefix plugins --ignore-scripts --no-audit --no-fund
          node --test tests/test_plugin_*.mjs
      - name: Check Hermes metadata-only usage exporter
        run: python -m unittest discover -s plugins/hermes/tests -v
      - name: Check environment contract and renderer regressions
        run: |
          python tools/check_env.py
          python -m tests.test_render
      - name: Check offline Python regressions (no credentials or services)
        run: |
          python -m tests.test_trace_privacy
          python -m tests.test_backup
          python -m tests.test_can_backup
          python -m tests.test_storage_metrics
          python -m tests.test_storage
          python -m tests.test_database
          python -m tests.test_otel_retention
          python -m tests.test_retention_capacity
          python -m tests.test_ai_incremental
          python -m tests.test_dashboards
          python -m tests.test_grafana_folders
          python -m tests.test_activity
          python -m tests.test_vehicle_aggregate
          python -m tests.test_fleet
          python -m tests.test_can_receiver
          python -m tests.test_can_http_deadline
          python -m tests.test_can_encoding
          python -m unittest tests.test_can_prefetch
          python -m tests.test_can_decoder
          python -m tests.test_can_otlp_wire
          python tools/demo.py regressions
          python -m tests.test_vss
          python -m tests.test_vss_setup
          for f in tests/test_battery_*.py; do
            module="${f%.py}"
            python -m "${module//\//.}"
          done
      - name: Check packaged read-only CAN receiver startup and durable replay
        run: python -m tests.test_can_receiver_compose
      - name: Check generated deployment bundle is current
        run: |
          python tools/render.py \
            compose/core.yaml compose/database.yaml compose/ingest.yaml \
            compose/grafana.yaml compose/backup.yaml compose/vehicle-raw.yaml \
            compose/vehicle-vss.yaml compose/tesla-fleet.yaml compose/redecode.yaml \
            compose/can-receiver.yaml \
            --out "$RUNNER_TEMP/compose.yaml"
          diff -u compose.yaml "$RUNNER_TEMP/compose.yaml"
      - name: Validate every Compose profile without deployment credentials
        run: |
          docker compose version
          for profile in server home mqtt vehicle fleet backup redecode can-receiver '*'; do
            docker compose --env-file .env.example --profile server --profile "$profile" config --quiet
          done
  synthetic-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Start the isolated File-store demo
        run: python tools/demo.py start --state "$RUNNER_TEMP/datalake-demo"
      - name: Check collection, dedup, queued replay, privacy and fresh offline restore
        run: python tools/demo.py check --state "$RUNNER_TEMP/datalake-demo"
      - name: Show synthetic verification evidence
        run: python tools/demo.py status --state "$RUNNER_TEMP/datalake-demo"
      - name: Remove only this demo's projects and volumes
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/datalake-demo/state.json"; then
            python tools/demo.py stop --state "$RUNNER_TEMP/datalake-demo"
          fi

  can-decode-perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the PR base / push before commit exists for git archive.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned synthetic CAN decode dependencies
        run: |
          python -m pip install --only-binary=:all: cantools==40.7.1 \
            opentelemetry-proto==1.38.0 protobuf==6.33.6
      - name: Materialize baseline archive under RUNNER_TEMP
        id: baseline
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          unavailable() {
            printf '{"baseline_available": false, "cases": {}, "max_slowdown": 0.25, "mismatch": [], "note": "synthetic fixture only; baseline unavailable (%s); no regression gate claimed", "regressions": [], "synthetic": true}\n' "$1" > "$RUNNER_TEMP/can-decode-perf.json"
            echo "available=false" >> "$GITHUB_OUTPUT"
          }
          sha=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            sha="$PR_BASE_SHA"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            sha="$PUSH_BEFORE_SHA"
          else
            unavailable "unsupported-event"
            exit 1
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            unavailable "untrusted-or-missing-sha"
            exit 1
          fi
          if [ "$sha" = "0000000000000000000000000000000000000000" ]; then
            unavailable "initial-push-has-no-before-commit"
            exit 0
          fi
          if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
            unavailable "object-not-present"
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/can-decode-baseline"
          mkdir -p "$RUNNER_TEMP/can-decode-baseline"
          git archive "$sha" | tar -x -C "$RUNNER_TEMP/can-decode-baseline"
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Run synthetic CAN decode regression gate
        if: steps.baseline.outputs.available == 'true'
        run: |
          python tools/benchmark_can_decode.py \
            --baseline-root "$RUNNER_TEMP/can-decode-baseline" \
            --chunks 2000 --repeats 3 --no-instrument \
            --max-slowdown 0.25 \
            --json-out "$RUNNER_TEMP/can-decode-perf.json"
      - name: Upload synthetic decode measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: can-decode-perf
          path: ${{ runner.temp }}/can-decode-perf.json
          if-no-files-found: error
