name: Compose validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan working tree and full history with pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -eu
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/gitleaks" dir . --redact=100 --ignore-gitleaks-allow
          "$RUNNER_TEMP/gitleaks" git . --redact=100 --ignore-gitleaks-allow \
            --log-opts="--all --full-history"
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install renderer and pinned synthetic CAN/RAW dependencies
        run: |
          python -m pip install --only-binary=:all: PyYAML==6.0.2 \
            python-can==4.6.1 asammdf==8.8.27 zstd==1.5.6.1 \
            cantools==40.7.1 py-expression-eval==0.3.14 boto3==1.43.98 \
            opentelemetry-proto==1.38.0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/package-lock.json
      - name: Check coding-agent plugin privacy and installers
        run: |
          npm ci --prefix plugins --ignore-scripts --no-audit --no-fund
          node --test tests/test_plugin_*.mjs
      - name: Check Hermes metadata-only usage exporter
        run: python -m unittest discover -s plugins/hermes/tests -v
      - name: Check environment contract and renderer regressions
        run: |
          python tools/check_env.py
          python tests/test_render.py
      - name: Check offline Python regressions (no credentials or services)
        run: |
          python tests/test_trace_privacy.py
          python tests/test_backup.py
          python tests/test_storage.py
          python tests/test_database.py
          python tests/test_dashboards.py
          python tests/test_activity.py
          python tests/test_vehicle_aggregate.py
          python tests/test_fleet.py
          python tests/test_can_receiver.py
          python tools/demo.py regressions
          python tests/test_vss.py
          python tests/test_vss_setup.py
          for f in tests/test_battery_*.py; do python "$f"; done
      - name: Check packaged read-only CAN receiver startup and durable replay
        run: python tests/test_can_receiver_compose.py
      - name: Check generated deployment bundle is current
        run: |
          python tools/render.py \
            compose/core.yaml compose/database.yaml compose/ingest.yaml \
            compose/grafana.yaml compose/backup.yaml compose/vehicle-raw.yaml \
            compose/vehicle-vss.yaml compose/tesla-fleet.yaml compose/redecode.yaml \
            compose/can-receiver.yaml \
            --out "$RUNNER_TEMP/compose.yaml"
          diff -u compose.yaml "$RUNNER_TEMP/compose.yaml"
      - name: Validate every Compose profile without deployment credentials
        run: |
          docker compose version
          for profile in server home mqtt vehicle fleet backup redecode can-receiver '*'; do
            docker compose --env-file .env.example --profile server --profile "$profile" config --quiet
          done
  synthetic-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Start the isolated File-store demo
        run: python tools/demo.py start --state "$RUNNER_TEMP/datalake-demo"
      - name: Check collection, dedup, queued replay, privacy and fresh offline restore
        run: python tools/demo.py check --state "$RUNNER_TEMP/datalake-demo"
      - name: Show synthetic verification evidence
        run: python tools/demo.py status --state "$RUNNER_TEMP/datalake-demo"
      - name: Remove only this demo's projects and volumes
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/datalake-demo/state.json"; then
            python tools/demo.py stop --state "$RUNNER_TEMP/datalake-demo"
          fi
