services:
  vehicle-raw-deps:
    image: ${VEHICLE_RAW_IMAGE:-python:3.12.8-slim-bookworm}
    profiles: [vehicle]
    volumes:
      - vehicle-venv:/opt/venv
    # Prerequisite: needs network (PyPI) at first boot only.
    # Pinned-content guard: recreate the venv when pins change, so a stale
    # venv can never silently run mismatched writer versions.
    # zstd 1.5.6.1 has a CPython 3.12 Linux ARM64 wheel; newer releases
    # require a compiler there. Keep Pi startup binary-only.
    command:
      - /bin/sh
      - -ec
      - >-
        printf '%s' 'python-can==4.6.1 asammdf==8.8.27 zstd==1.5.6.1 boto3==1.43.98 cantools==40.7.1' > /tmp/.raw_want;
        if test -f /opt/venv/.raw_ready &&
        cmp -s /tmp/.raw_want /opt/venv/.raw_ready; then exit 0; fi;
        python3 -m venv --clear /opt/venv &&
        /opt/venv/bin/pip install --no-cache-dir --only-binary=:all:
        python-can==4.6.1 asammdf==8.8.27 zstd==1.5.6.1 boto3==1.43.98 cantools==40.7.1 &&
        cp /tmp/.raw_want /opt/venv/.raw_ready
    restart: "no"

  raw-recorder:
    image: ${VEHICLE_RAW_IMAGE:-python:3.12.8-slim-bookworm}
    profiles: [vehicle]
    labels:
      datalake.raw-recorder-revision: "2"
    working_dir: /app
    command: [/opt/venv/bin/python, -m, scripts.vehicle.raw.raw_recorder]
    depends_on:
      vehicle-raw-deps:
        condition: service_completed_successfully
    network_mode: host # SocketCAN requirement; only this vehicle service leaves the default net
    cap_add:
      - NET_RAW
    configs:
      - source: raw_recorder_py
        target: /app/scripts/vehicle/raw/raw_recorder.py
        mode: 0444
      - source: raw_can_validation_py
        target: /app/scripts/vehicle/raw/can_validation.py
        mode: 0444
    volumes:
      - vehicle-venv:/opt/venv:ro
      - raw-spool:/spool/raw
      - vehicle-data:/data:ro
    environment:
      VEHICLE_ID: ${VEHICLE_ID:-}
      CAN_INTERFACE: ${CAN_INTERFACE:-can0}
      RAW_SPOOL_DIR: /spool/raw
      RAW_CHUNK_SECONDS: ${RAW_CHUNK_SECONDS:-600}
      RAW_CHUNK_BYTES: ${RAW_CHUNK_BYTES:-67108864}
      RAW_FINALIZE_MEM_FRAMES: ${RAW_FINALIZE_MEM_FRAMES:-20000}
      RAW_TMP_MAX_BYTES: ${RAW_TMP_MAX_BYTES:-2147483648}
      RAW_FSYNC_N: ${RAW_FSYNC_N:-50}
      RAW_FSYNC_SEC: ${RAW_FSYNC_SEC:-1.0}
      RAW_DISK_MIN_FREE_BYTES: ${RAW_DISK_MIN_FREE_BYTES:-1073741824}
      RAW_METRICS_HOST: ${RAW_METRICS_HOST:-127.0.0.1}
      RAW_METRICS_PORT: ${RAW_METRICS_PORT:-9102} # host network_mode: loopback default, Tailnet IP via dotenv
      RAW_REPLAY_ALLOW: ${RAW_REPLAY_ALLOW:-0}
      CAN_VALIDATION_DATA_DIR: /data/current
      CAN_VALIDATION_CHECKSUMS: ${CAN_VALIDATION_CHECKSUMS:-{}}
      CAN_VALIDATION_RANGES: ${CAN_VALIDATION_RANGES:-{}}
      CAN_VALIDATION_EXPECTED_SIGNALS: ${CAN_VALIDATION_EXPECTED_SIGNALS:-[]}
      CAN_VALIDATION_RELATIONS: ${CAN_VALIDATION_RELATIONS:-{}}
    restart: unless-stopped

  # ponytail: separate uploader process (not thread) so recorder survives S3 stalls
  raw-uploader:
    image: ${VEHICLE_RAW_IMAGE:-python:3.12.8-slim-bookworm}
    profiles: [vehicle]
    depends_on:
      vehicle-raw-deps:
        condition: service_completed_successfully
    configs:
      - source: raw_upload_py
        target: /app/scripts/vehicle/raw/raw_upload.py
        mode: 0444
      - source: raw_storage_metrics_py
        target: /app/scripts/storage/storage_metrics.py
        mode: 0444
    volumes:
      - vehicle-venv:/opt/venv:ro
      - raw-spool:/spool/raw
    environment:
      VEHICLE_ID: ${VEHICLE_ID:-}
      RAW_SPOOL_DIR: /spool/raw
      RAW_BUCKET: ${RAW_BUCKET:-}
      RAW_S3_ENDPOINT_URL: ${RAW_S3_ENDPOINT_URL:-}
      RAW_S3_REGION: ${RAW_S3_REGION:-us-west-004}
      RAW_S3_ACCESS_KEY_ID: ${RAW_S3_ACCESS_KEY_ID:-}
      RAW_S3_SECRET_ACCESS_KEY: ${RAW_S3_SECRET_ACCESS_KEY:-}
      RAW_UPLOAD_INTERVAL_SEC: ${RAW_UPLOAD_INTERVAL_SEC:-60}
      RAW_UPLOAD_RETRIES: ${RAW_UPLOAD_RETRIES:-8}
      RAW_PREFLIGHT_CHUNK_BYTES: ${RAW_PREFLIGHT_CHUNK_BYTES:-1048576}
      RAW_INVENTORY_INTERVAL_SEC: ${RAW_INVENTORY_INTERVAL_SEC:-3600}
    # Container listener is fixed; only this host-side bind is configurable.
    ports:
      - ${RAW_METRICS_HOST:-127.0.0.1}:${RAW_UPLOAD_METRICS_PORT:-9103}:9103
    working_dir: /app
    command: [/opt/venv/bin/python, -m, scripts.vehicle.raw.raw_upload]
    restart: unless-stopped

configs:
  raw_recorder_py:
    x-source: scripts/vehicle/raw/raw_recorder.py
  raw_upload_py:
    x-source: scripts/vehicle/raw/raw_upload.py
  raw_can_validation_py:
    x-source: scripts/vehicle/raw/can_validation.py
  raw_storage_metrics_py:
    x-source: scripts/storage/storage_metrics.py

volumes:
  vehicle-venv:
  raw-spool:
