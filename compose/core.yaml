services:
  greptimedb:
    image: ${GREPTIME_IMAGE:-greptime/greptimedb:v1.2.1}
    # Managed volumes are root-owned; both writer (db-init) and reader run
    # as root so 0600/0700 preflight outputs stay readable.
    user: "0:0"
    profiles:
      - server
    command:
      - standalone
      - start
      - --config-file
      - /etc/greptime/greptimedb.toml
    volumes:
      - greptime-data:/data
      - greptime-etc:/etc/greptime:ro
    ports:
      - ${GREPTIME_HTTP_BIND_ADDRESS:-127.0.0.1}:${GREPTIME_HTTP_PORT:-4000}:4000
      - ${GREPTIME_MYSQL_BIND_ADDRESS:-127.0.0.1}:${GREPTIME_MYSQL_PORT:-4002}:4002
    depends_on:
      db-init:
        condition: service_completed_successfully
        # Config/auth lifecycle: db-init rewrites greptimedb.toml on every
        # env change; restart the DB with it so the new config takes effect
        # (plain `up -d` would leave a same-spec DB running on stale config).
        restart: true
    restart: unless-stopped
  db-init:
    image: ${PYTHON_IMAGE:-python:3.12.8-slim-bookworm}
    user: "0:0"
    profiles:
      - server
    working_dir: /app
    command:
      - python
      - -m
      - scripts.database.greptime_preflight
    environment:
      GREPTIME_DB: ${GREPTIME_DB:-datalake}
      GREPTIME_USER: ${GREPTIME_USER:-datalake}
      GREPTIME_PASSWORD: ${GREPTIME_PASSWORD:-}
      GREPTIME_STORAGE_TYPE: ${GREPTIME_STORAGE_TYPE:-S3}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-}
      S3_ROOT: ${S3_ROOT:-greptime}
      GREPTIME_PAGE_CACHE_SIZE: ${GREPTIME_PAGE_CACHE_SIZE:-512MB}
      GREPTIME_WRITE_BUFFER_SIZE: ${GREPTIME_WRITE_BUFFER_SIZE:-128MB}
      GREPTIME_AUTO_FLUSH_INTERVAL: ${GREPTIME_AUTO_FLUSH_INTERVAL:-10m}
      GF_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-}
      OTLP_USER: ${OTLP_USER:-}
      OTLP_PASSWORD: ${OTLP_PASSWORD:-}
      OUT_DIR: /out
    configs:
      - source: greptime_preflight
        target: /app/scripts/database/greptime_preflight.py
    volumes:
      - greptime-etc:/out
    restart: "no"
configs:
  greptime_preflight:
    x-source: scripts/database/greptime_preflight.py
volumes:
  greptime-data:
  greptime-etc:
