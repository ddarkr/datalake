services:
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.4.0}
    profiles: [server]
    # Bump with dashboard changes: inline configs alone do not trigger recreation.
    labels:
      datalake.dashboard-revision: "12"
    depends_on:
      db-schema:
        condition: service_completed_successfully
    ports:
      - ${GF_BIND_ADDRESS:-127.0.0.1}:${GF_HTTP_PORT:-3000}:3000
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-}
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Asia/Seoul
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/overview.json
      GREPTIME_DB: ${GREPTIME_DB:-datalake}
      GREPTIME_USER: ${GREPTIME_USER:-datalake}
      GREPTIME_PASSWORD: ${GREPTIME_PASSWORD:-}
    volumes:
      - grafana-data:/var/lib/grafana
    configs:
      - source: grafana-datasources
        target: /etc/grafana/provisioning/datasources/greptime.yaml
      - source: grafana-dashboards
        target: /etc/grafana/provisioning/dashboards/datalake.yaml
      - source: grafana-dash-overview
        target: /etc/grafana/provisioning/dashboards/json/overview.json
      - source: grafana-dash-ai-usage
        target: /etc/grafana/provisioning/dashboards/json/ai-usage.json
      - source: grafana-dash-ai-tools
        target: /etc/grafana/provisioning/dashboards/json/ai-tools.json
      - source: grafana-dash-ai-sessions
        target: /etc/grafana/provisioning/dashboards/json/ai-sessions.json
      - source: grafana-dash-vehicle-overview
        target: /etc/grafana/provisioning/dashboards/json/vehicle-overview.json
      - source: grafana-dash-can-vss
        target: /etc/grafana/provisioning/dashboards/json/can-vss.json
      - source: grafana-dash-drives
        target: /etc/grafana/provisioning/dashboards/json/drives.json
      - source: grafana-dash-charging
        target: /etc/grafana/provisioning/dashboards/json/charging.json
      - source: grafana-dash-dbc-health
        target: /etc/grafana/provisioning/dashboards/json/dbc-health.json
      - source: grafana-dash-home
        target: /etc/grafana/provisioning/dashboards/json/home.json
      - source: grafana-dash-health
        target: /etc/grafana/provisioning/dashboards/json/datalake-health.json
      - source: grafana-dash-battery
        target: /etc/grafana/provisioning/dashboards/json/battery.json

# MySQL/Grafana accepts at most microsecond timestamp text. Cast projections
# only; canonical TIMESTAMP(9) storage and raw-time filters remain unchanged.
configs:
  grafana-datasources:
    content: |
      apiVersion: 1
      datasources:
        - name: Greptime-Prom
          type: prometheus
          uid: greptime-prom
          access: proxy
          url: http://greptimedb:4000/v1/prometheus
          basicAuth: true
          basicAuthUser: $$GREPTIME_USER
          jsonData:
            httpMethod: POST
            httpHeaderName1: x-greptime-db-name
          secureJsonData:
            basicAuthPassword: $$GREPTIME_PASSWORD
            httpHeaderValue1: $$GREPTIME_DB
        - name: Greptime-MySQL
          type: mysql
          uid: greptime-mysql
          access: proxy
          url: greptimedb:4002
          database: $$GREPTIME_DB
          user: $$GREPTIME_USER
          jsonData:
            maxOpenConns: 5
            maxIdleConns: 2
            connMaxLifetime: 60
            timezone: UTC
          secureJsonData:
            password: $$GREPTIME_PASSWORD
  grafana-dashboards:
    content: |
      apiVersion: 1
      providers:
        - name: datalake
          folder: Datalake
          type: file
          allowUiUpdates: false
          options:
            path: /etc/grafana/provisioning/dashboards/json
  grafana-dash-overview:
    content: |
      {"uid":"datalake-overview","title":"Overview","tags":["datalake"],"timezone":"Asia/Seoul","schemaVersion":39,"version":2,"time":{"from":"now-24h","to":"now"},"description":"Coverage first, then observed service/operation latency and trace identity. HTTP route/status, DB queries, render phases and dropped span events cannot be reconstructed from metadata-only telemetry.","refresh":"","templating":{"list":[{"name":"service","type":"textbox","label":"Service (exact)","query":"","current":{"text":"","value":""},"hide":0,"skipUrlSync":false,"description":"Exact match; leave blank to include all. Operation is a span name, not an HTTP route."},{"name":"operation","type":"textbox","label":"Operation","query":"","current":{"text":"","value":""},"hide":0,"skipUrlSync":false,"description":"Exact match; leave blank to include all. Operation is a span name, not an HTTP route."},{"name":"kind","label":"Span kind","type":"custom","query":"All,SPAN_KIND_SERVER,SPAN_KIND_CLIENT,SPAN_KIND_INTERNAL,SPAN_KIND_PRODUCER,SPAN_KIND_CONSUMER","current":{"text":"All","value":"All"},"includeAll":false,"multi":false},{"name":"trace_id","type":"textbox","label":"Trace ID","query":"","current":{"text":"","value":""},"hide":0,"skipUrlSync":false,"description":"Only the trace/log detail panels use this ID."}]},"panels":[
      {"id":1,"type":"dashlist","title":"Datalake dashboards","fieldConfig":{"defaults":{"noValue":"No data"},"overrides":[]},"options":{"showStarred":false,"showRecentlyViewed":false,"showSearch":true,"showHeadings":true},"gridPos":{"h":8,"w":12,"x":0,"y":0}},
      {"id":2,"type":"stat","title":"Observed spans · final 48h","description":"Observed spans, not HTTP requests. Retransmissions deduplicated by trace/span identity. Raw investigation is limited to the final 48 hours of the selected range; earlier data is intentionally excluded. Missing input stays No data. ","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT NULLIF(COUNT(*), 0) AS spans FROM (SELECT DISTINCT trace_id, span_id, timestamp, service_name, span_name, span_kind, span_status_code, duration_nano FROM opentelemetry_traces WHERE $$__timeFilter(timestamp) AND timestamp >= FROM_UNIXTIME($$__unixEpochTo() - 172800) AND ($${service:sqlstring} = '' OR service_name = $${service:sqlstring}) AND ($${operation:sqlstring} = '' OR span_name = $${operation:sqlstring}) AND ($${kind:sqlstring} = 'All' OR span_kind = $${kind:sqlstring})) AS dedup","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"No data","mappings":[{"type":"special","options":{"match":"null","result":{"text":"No data","color":"gray"}}}]},"overrides":[]},"options":{"colorMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto"},"gridPos":{"h":8,"w":6,"x":12,"y":0}},
      {"id":3,"type":"stat","title":"Vehicle rows (range)","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT NULLIF(COUNT(*), 0) AS rows FROM vehicle_signal WHERE $$__timeFilter(event_time)","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"No data","mappings":[{"type":"special","options":{"match":"null","result":{"text":"No data","color":"gray"}}}]},"overrides":[]},"options":{"colorMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto"},"gridPos":{"h":8,"w":6,"x":12,"y":8}},
      {"id":4,"type":"stat","title":"Last OTel span · all retained data","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT CAST(MAX(timestamp) AS TIMESTAMP(6)) AS last_span FROM opentelemetry_traces WHERE ($${service:sqlstring} = '' OR service_name = $${service:sqlstring}) AND ($${operation:sqlstring} = '' OR span_name = $${operation:sqlstring}) AND ($${kind:sqlstring} = 'All' OR span_kind = $${kind:sqlstring})","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"dateTimeAsIso","thresholds":{"mode":"absolute","steps":[{"value":null,"color":"green"}]},"noValue":"No data","mappings":[{"type":"special","options":{"match":"null","result":{"text":"No data","color":"gray"}}}]},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"/.*/","values":false},"orientation":"auto","textMode":"auto","colorMode":"none"},"gridPos":{"h":8,"w":6,"x":0,"y":8},"description":"Latest retained span matching service/operation/kind, regardless of dashboard time range. A missing service stays No data instead of borrowing another service timestamp."},
      {"id":5,"type":"stat","title":"Last vehicle sample · all retained data","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT CAST(MAX(event_time) AS TIMESTAMP(6)) AS last_sample FROM vehicle_signal","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"dateTimeAsIso","thresholds":{"mode":"absolute","steps":[{"value":null,"color":"green"}]},"noValue":"No data","mappings":[{"type":"special","options":{"match":"null","result":{"text":"No data","color":"gray"}}}]},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"/.*/","values":false},"orientation":"auto","textMode":"auto","colorMode":"none"},"gridPos":{"h":8,"w":6,"x":6,"y":8}},
      {"id":6,"type":"text","title":"Investigation boundaries","options":{"mode":"markdown","content":"**No spans is a collection gap, not a healthy service.** Select an exact service (for example `gasa-v2`), operation and span kind. The queries below cover only the **final 48h** of the selected range and do not auto-refresh. Counts/rates are observed spans, not end-user request volume. HTTP route/method/status, DB statements, render timing and span events are not retained by the current trace allowlist; operation names are **not** route templates. Use Health for **datalake infrastructure** HTTP metrics, not application latency. Select a trace from the slow-span table to inspect parent/child timing and matching log metadata. Empty detail panels mean no selected/matching trace or logs, never proof of no error."},"gridPos":{"x":0,"y":16,"w":24,"h":5}},
      {"id":7,"type":"timeseries","title":"Observed span rate · 1m buckets","description":"Observed spans, not HTTP requests. Retransmissions deduplicated by trace/span identity. Raw investigation is limited to the final 48 hours of the selected range; earlier data is intentionally excluded. Missing input stays No data. One-minute buckets; partial edge buckets understate rate. Empty buckets are gaps, not zeros.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","datasource":{"type":"mysql","uid":"greptime-mysql"},"rawSql":"SELECT CAST(date_trunc('minute', timestamp) AS TIMESTAMP(6)) AS time, COUNT(*) / 60.0 AS spans_per_second FROM (SELECT DISTINCT trace_id, span_id, timestamp, service_name, span_name, span_kind, span_status_code, duration_nano FROM opentelemetry_traces WHERE $$__timeFilter(timestamp) AND timestamp >= FROM_UNIXTIME($$__unixEpochTo() - 172800) AND ($${service:sqlstring} = '' OR service_name = $${service:sqlstring}) AND ($${operation:sqlstring} = '' OR span_name = $${operation:sqlstring}) AND ($${kind:sqlstring} = 'All' OR span_kind = $${kind:sqlstring})) AS dedup GROUP BY time ORDER BY time","format":"time_series"}],"fieldConfig":{"defaults":{"noValue":"No data","unit":"ops","color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","lineWidth":1,"fillOpacity":8,"showPoints":"never","spanNulls":false,"insertNulls":90000}},"overrides":[]},"options":{"legend":{"showLegend":true,"displayMode":"table","placement":"bottom","calcs":["last"]},"tooltip":{"mode":"multi"}},"gridPos":{"x":0,"y":21,"w":12,"h":8}},
      {"id":8,"type":"timeseries","title":"Explicit-status span error rate · 1m","description":"Observed spans, not HTTP requests. Retransmissions deduplicated by trace/span identity. Raw investigation is limited to the final 48 hours of the selected range; earlier data is intentionally excluded. Missing input stays No data. Denominator includes only explicit OK/ERROR status, not UNSET/NULL. This is not HTTP 5xx rate. See status coverage in the comparison table.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","datasource":{"type":"mysql","uid":"greptime-mysql"},"rawSql":"SELECT CAST(date_trunc('minute', timestamp) AS TIMESTAMP(6)) AS time, 100.0 * SUM(CASE WHEN span_status_code = 'STATUS_CODE_ERROR' THEN 1 ELSE 0 END) / NULLIF(SUM(CASE WHEN span_status_code IN ('STATUS_CODE_OK','STATUS_CODE_ERROR') THEN 1 ELSE 0 END), 0) AS error_pct FROM (SELECT DISTINCT trace_id, span_id, timestamp, service_name, span_name, span_kind, span_status_code, duration_nano FROM opentelemetry_traces WHERE $$__timeFilter(timestamp) AND timestamp >= FROM_UNIXTIME($$__unixEpochTo() - 172800) AND ($${service:sqlstring} = '' OR service_name = $${service:sqlstring}) AND ($${operation:sqlstring} = '' OR span_name = $${operation:sqlstring}) AND ($${kind:sqlstring} = 'All' OR span_kind = $${kind:sqlstring})) AS dedup GROUP BY time ORDER BY time","format":"time_series"}],"fieldConfig":{"defaults":{"noValue":"No data","unit":"percent","color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","lineWidth":1,"fillOpacity":8,"showPoints":"never","spanNulls":false,"insertNulls":90000}},"overrides":[]},"options":{"legend":{"showLegend":true,"displayMode":"table","placement":"bottom","calcs":["last"]},"tooltip":{"mode":"multi"}},"gridPos":{"x":12,"y":21,"w":12,"h":8}},
      {"id":9,"type":"table","title":"Service / operation latency · approximate p50 / p95 / p99","description":"Observed spans, not HTTP requests. Retransmissions deduplicated by trace/span identity. Raw investigation is limited to the final 48 hours of the selected range; earlier data is intentionally excluded. Missing input stays No data. Top 20 operation groups by p95. Small sample counts make tail percentiles unstable. Session, tool and server spans remain separate; operation is not a route.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","datasource":{"type":"mysql","uid":"greptime-mysql"},"rawSql":"SELECT service_name, span_kind, span_name AS operation, COUNT(*) AS spans, COUNT(duration_nano) AS duration_samples, SUM(CASE WHEN span_status_code IN ('STATUS_CODE_OK','STATUS_CODE_ERROR') THEN 1 ELSE 0 END) AS explicit_status_samples, 100.0 * SUM(CASE WHEN span_status_code = 'STATUS_CODE_ERROR' THEN 1 ELSE 0 END) / NULLIF(SUM(CASE WHEN span_status_code IN ('STATUS_CODE_OK','STATUS_CODE_ERROR') THEN 1 ELSE 0 END),0) AS error_pct, approx_percentile_cont(duration_nano / 1000000.0, 0.5) AS p50_ms, approx_percentile_cont(duration_nano / 1000000.0, 0.95) AS p95_ms, approx_percentile_cont(duration_nano / 1000000.0, 0.99) AS p99_ms, MAX(duration_nano) / 1000000.0 AS max_ms FROM (SELECT DISTINCT trace_id, span_id, timestamp, service_name, span_name, span_kind, span_status_code, duration_nano FROM opentelemetry_traces WHERE $$__timeFilter(timestamp) AND timestamp >= FROM_UNIXTIME($$__unixEpochTo() - 172800) AND ($${service:sqlstring} = '' OR service_name = $${service:sqlstring}) AND ($${operation:sqlstring} = '' OR span_name = $${operation:sqlstring}) AND ($${kind:sqlstring} = 'All' OR span_kind = $${kind:sqlstring})) AS dedup GROUP BY service_name,span_kind,operation ORDER BY p95_ms DESC LIMIT 20","format":"table"}],"fieldConfig":{"defaults":{"noValue":"No data","custom":{"minWidth":60,"width":85}},"overrides":[{"matcher":{"id":"byRegexp","options":".*_ms$"},"properties":[{"id":"unit","value":"ms"}]},{"matcher":{"id":"byName","options":"error_pct"},"properties":[{"id":"unit","value":"percent"}]},{"matcher":{"id":"byName","options":"service_name"},"properties":[{"id":"custom.width","value":100}]},{"matcher":{"id":"byName","options":"operation"},"properties":[{"id":"custom.width","value":190}]},{"matcher":{"id":"byName","options":"duration_samples"},"properties":[{"id":"displayName","value":"n"}]},{"matcher":{"id":"byName","options":"p50_ms"},"properties":[{"id":"displayName","value":"p50"}]},{"matcher":{"id":"byName","options":"p95_ms"},"properties":[{"id":"displayName","value":"p95"}]},{"matcher":{"id":"byName","options":"p99_ms"},"properties":[{"id":"displayName","value":"p99"}]},{"matcher":{"id":"byName","options":"max_ms"},"properties":[{"id":"displayName","value":"max"}]}]},"options":{"showHeader":true,"cellHeight":"sm"},"gridPos":{"x":0,"y":29,"w":24,"h":9},"transformations":[{"id":"organize","options":{"indexByName":{"service_name":0,"operation":1,"duration_samples":2,"p50_ms":3,"p95_ms":4,"p99_ms":5,"max_ms":6,"error_pct":7,"span_kind":8,"spans":9,"explicit_status_samples":10}}}]},
      {"id":10,"type":"table","title":"Slowest observed spans · top 50","description":"Observed spans, not HTTP requests. Retransmissions deduplicated by trace/span identity. Raw investigation is limited to the final 48 hours of the selected range; earlier data is intentionally excluded. Missing input stays No data. Sorted by duration, not by recency. Click trace_id for detail; duration includes child work, not exclusive CPU/DB time.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","datasource":{"type":"mysql","uid":"greptime-mysql"},"rawSql":"SELECT CAST(timestamp AS TIMESTAMP(6)) AS time, service_name, span_name, span_kind, duration_nano / 1000000.0 AS duration_ms, span_status_code, trace_id, span_id FROM (SELECT DISTINCT trace_id, span_id, timestamp, service_name, span_name, span_kind, span_status_code, duration_nano FROM opentelemetry_traces WHERE $$__timeFilter(timestamp) AND timestamp >= FROM_UNIXTIME($$__unixEpochTo() - 172800) AND ($${service:sqlstring} = '' OR service_name = $${service:sqlstring}) AND ($${operation:sqlstring} = '' OR span_name = $${operation:sqlstring}) AND ($${kind:sqlstring} = 'All' OR span_kind = $${kind:sqlstring})) AS dedup WHERE duration_nano IS NOT NULL ORDER BY duration_nano DESC LIMIT 50","format":"table"}],"fieldConfig":{"defaults":{"noValue":"No data","custom":{"minWidth":70,"width":100}},"overrides":[{"matcher":{"id":"byName","options":"trace_id"},"properties":[{"id":"links","value":[{"title":"Inspect this trace and correlated logs","url":"/d/datalake-overview?var-trace_id=$${__value.raw}&$${__url_time_range}","targetBlank":false}]}]},{"matcher":{"id":"byRegexp","options":".*_ms$"},"properties":[{"id":"unit","value":"ms"}]},{"matcher":{"id":"byName","options":"error_pct"},"properties":[{"id":"unit","value":"percent"}]},{"matcher":{"id":"byName","options":"time"},"properties":[{"id":"custom.width","value":160}]},{"matcher":{"id":"byName","options":"span_name"},"properties":[{"id":"custom.width","value":190}]},{"matcher":{"id":"byName","options":"trace_id"},"properties":[{"id":"custom.width","value":240}]}]},"options":{"showHeader":true,"cellHeight":"sm"},"gridPos":{"x":0,"y":38,"w":24,"h":10},"transformations":[{"id":"organize","options":{"indexByName":{"time":0,"service_name":1,"span_name":2,"duration_ms":3,"trace_id":4,"span_status_code":5,"span_kind":6,"span_id":7},"excludeByName":{"span_kind":true,"span_id":true}}}]},
      {"id":11,"type":"table","title":"Selected trace · parent / child spans","description":"Observed spans, not HTTP requests. Retransmissions deduplicated by trace/span identity. Raw investigation is limited to the final 48 hours of the selected range; earlier data is intentionally excluded. Missing input stays No data. Requires Trace ID. Ignores service/operation/kind filters so cross-service children remain visible. First 200 spans chronologically; missing parents can reflect sampling, retention or the range limit. Not a reconstructed waterfall.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","datasource":{"type":"mysql","uid":"greptime-mysql"},"rawSql":"SELECT DISTINCT CAST(timestamp AS TIMESTAMP(6)) AS time, service_name, span_name, span_kind, duration_nano / 1000000.0 AS duration_ms, span_status_code, trace_id, span_id, parent_span_id FROM opentelemetry_traces WHERE $$__timeFilter(timestamp) AND timestamp >= FROM_UNIXTIME($$__unixEpochTo() - 172800) AND $${trace_id:sqlstring} <> '' AND trace_id = $${trace_id:sqlstring} ORDER BY time LIMIT 200","format":"table"}],"fieldConfig":{"defaults":{"noValue":"No data"},"overrides":[{"matcher":{"id":"byRegexp","options":".*_ms$"},"properties":[{"id":"unit","value":"ms"}]},{"matcher":{"id":"byName","options":"error_pct"},"properties":[{"id":"unit","value":"percent"}]}]},"options":{"showHeader":true,"cellHeight":"sm"},"gridPos":{"x":0,"y":48,"w":24,"h":10}},
      {"id":12,"type":"table","title":"Selected trace · correlated log metadata","description":"Requires Trace ID; final 48h of the selected range. Exact trace identity correlation, latest 100 logs. Log bodies are privacy-redacted and deliberately not shown. No matching rows does not prove there were no logs or errors.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","datasource":{"type":"mysql","uid":"greptime-mysql"},"rawSql":"SELECT CAST(timestamp AS TIMESTAMP(6)) AS time, severity_text, severity_number, scope_name, trace_id, span_id FROM opentelemetry_logs WHERE $$__timeFilter(timestamp) AND timestamp >= FROM_UNIXTIME($$__unixEpochTo() - 172800) AND $${trace_id:sqlstring} <> '' AND trace_id = $${trace_id:sqlstring} ORDER BY timestamp DESC LIMIT 100","format":"table"}],"fieldConfig":{"defaults":{"noValue":"No data"},"overrides":[]},"options":{"showHeader":true,"cellHeight":"sm"},"gridPos":{"x":0,"y":58,"w":24,"h":8}}
      ]}
  grafana-dash-ai-usage:
    content: |
      {"uid":"datalake-ai-usage","title":"AI Usage","tags":["datalake","ai"],"timezone":"Asia/Seoul","schemaVersion":39,"version":4,"time":{"from":"now-30d","to":"now"},"description":"Token economics · model mix · observed usage. Costs are reported estimates plus supplemental public list-rate estimates (cached pricing, not invoices); missing values remain unknown. Known totals are partial when unpriced calls remain; NULL unpriced coverage marks legacy rows.","refresh":"5m","links":[{"title":"Usage","type":"link","url":"/d/datalake-ai-usage","includeVars":false,"keepTime":true,"targetBlank":false},{"title":"Tools","type":"link","url":"/d/datalake-ai-tools","includeVars":false,"keepTime":true,"targetBlank":false},{"title":"Sessions","type":"link","url":"/d/datalake-ai-sessions","includeVars":false,"keepTime":true,"targetBlank":false}],"panels":[
      {"id":10,"title":"Input tokens","type":"stat","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT SUM(input_tokens) AS tokens FROM ai_daily_summary WHERE $$__timeFilter(day_start)","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","color":{"mode":"fixed","fixedColor":"blue"},"decimals":0,"mappings":[{"type":"special","options":{"match":"null","result":{"text":"No data","color":"gray"}}}]},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"text":{"valueSize":40}},"gridPos":{"x":0,"y":0,"w":6,"h":4}},
      {"id":11,"title":"Output tokens","type":"stat","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT SUM(output_tokens) AS tokens FROM ai_daily_summary WHERE $$__timeFilter(day_start)","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","color":{"mode":"fixed","fixedColor":"green"},"decimals":0,"mappings":[{"type":"special","options":{"match":"null","result":{"text":"No data","color":"gray"}}}]},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"text":{"valueSize":40}},"gridPos":{"x":6,"y":0,"w":6,"h":4}},
      {"id":12,"title":"Known cost · USD","type":"stat","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT CASE WHEN SUM(cost_usd) IS NULL AND SUM(cost_estimated_usd) IS NULL THEN NULL ELSE COALESCE(SUM(cost_usd), 0) + COALESCE(SUM(cost_estimated_usd), 0) END AS cost_total, SUM(cost_usd) AS cost_reported, SUM(cost_estimated_usd) AS cost_supplemental, CASE WHEN COUNT(*) = COUNT(cost_unpriced_calls) THEN SUM(cost_unpriced_calls) ELSE NULL END AS unpriced_calls FROM ai_daily_summary WHERE $$__timeFilter(day_start)","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"currencyUSD","noValue":"Unknown","color":{"mode":"fixed","fixedColor":"orange"},"decimals":4,"mappings":[]},"overrides":[{"matcher":{"id":"byName","options":"cost_total"},"properties":[{"id":"displayName","value":"Known total"}]},{"matcher":{"id":"byName","options":"cost_reported"},"properties":[{"id":"displayName","value":"Reported"}]},{"matcher":{"id":"byName","options":"cost_supplemental"},"properties":[{"id":"displayName","value":"Estimated"}]},{"matcher":{"id":"byName","options":"unpriced_calls"},"properties":[{"id":"unit","value":"short"},{"id":"decimals","value":0},{"id":"displayName","value":"Unpriced"}]}]},"options":{"colorMode":"none","graphMode":"none","justifyMode":"center","orientation":"horizontal","textMode":"value_and_name","wideLayout":true,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"text":{"valueSize":14,"titleSize":11}},"gridPos":{"x":12,"y":0,"w":6,"h":4},"description":"Known total = reported cost_usd + supplemental cost_estimated_usd (current LiteLLM public list-rate estimate, not invoice). Total NULL when both NULL; partial when unpriced calls > 0 or coverage is unknown. Unpriced 0 means all rows evaluated with no unresolved calls; Unknown includes legacy/unprocessed rows. Missing cost is not zero."},
      {"id":13,"title":"Sessions","type":"stat","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT NULLIF(COUNT(*), 0) AS sessions FROM (SELECT DISTINCT client, session_id FROM ai_session_summary WHERE $$__timeFilter(session_start)) AS observed_sessions","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","color":{"mode":"fixed","fixedColor":"purple"},"decimals":0,"mappings":[{"type":"special","options":{"match":"null","result":{"text":"No data","color":"gray"}}}]},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"text":{"valueSize":40}},"gridPos":{"x":18,"y":0,"w":6,"h":4}},
      {"id":1,"type":"timeseries","title":"Daily token flow","description":"Observed daily usage from ai_daily_summary. Usage is source-selected, not summed across native and hook copies. Native Claude usage is authoritative; Codex turn-cost receipts replace overlapping per-call estimates. cost_source records provenance; reported plus supplemental public list-rate estimates are not billing invoices. cost_estimated_usd NULL means nothing estimated; cost_unpriced_calls 0 means evaluated with nothing unresolved, NULL marks legacy/unprocessed rows. Missing values stay NULL.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT day_start AS `time`, model, SUM(input_tokens) AS input_tokens, SUM(output_tokens) AS output_tokens FROM ai_daily_summary WHERE $$__timeFilter(day_start) GROUP BY `time`, model ORDER BY `time` ASC","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"—","unit":"short","color":{"mode":"palette-classic"},"custom":{"drawStyle":"bars","lineInterpolation":"linear","barAlignment":0,"barWidthFactor":0.1,"lineWidth":1,"fillOpacity":75,"gradientMode":"opacity","showPoints":"auto","pointSize":5,"spanNulls":false,"axisBorderShow":false,"axisColorMode":"text","scaleDistribution":{"type":"linear"},"stacking":{"mode":"normal","group":"A"},"hideFrom":{"tooltip":false,"viz":false,"legend":false},"barMaxWidth":32}},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull"],"showLegend":true},"tooltip":{"mode":"multi","sort":"desc"}},"gridPos":{"x":0,"y":4,"w":16,"h":10}},
      {"id":14,"title":"Model mix · input tokens","type":"bargauge","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT model, SUM(input_tokens) AS tokens FROM ai_daily_summary WHERE $$__timeFilter(day_start) AND input_tokens IS NOT NULL GROUP BY model ORDER BY tokens DESC LIMIT 8","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"short","noValue":"—","color":{"mode":"continuous-BlPu"},"min":0},"overrides":[]},"options":{"displayMode":"gradient","orientation":"horizontal","showUnfilled":true,"valueMode":"color","namePlacement":"left","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":true},"text":{"titleSize":12,"valueSize":18}},"gridPos":{"x":16,"y":4,"w":8,"h":10}},
      {"id":20,"type":"row","title":"Usage ledger","collapsed":false,"panels":[],"gridPos":{"x":0,"y":14,"w":24,"h":1}},
      {"id":2,"type":"table","title":"Usage by client & model","description":"Observed daily usage from ai_daily_summary. Usage is source-selected, not summed across native and hook copies. Native Claude usage is authoritative; Codex turn-cost receipts replace overlapping per-call estimates. cost_source records provenance; reported plus supplemental public list-rate estimates are not billing invoices. cost_estimated_usd NULL means nothing estimated; cost_unpriced_calls 0 means evaluated with nothing unresolved, NULL marks legacy/unprocessed rows. Missing values stay NULL.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT day_start AS `day`, client, provider, model, input_tokens, output_tokens, cache_read_tokens, cache_write_tokens, reasoning_tokens, total_tokens, cost_usd, cost_estimated_usd, CASE WHEN cost_usd IS NULL AND cost_estimated_usd IS NULL THEN NULL ELSE COALESCE(cost_usd, 0) + COALESCE(cost_estimated_usd, 0) END AS cost_total, cost_unpriced_calls, cost_source, llm_spans, active_sessions FROM ai_daily_summary WHERE $$__timeFilter(day_start) ORDER BY `day` DESC LIMIT 500","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"—","custom":{"align":"auto","cellOptions":{"type":"auto"},"inspect":false}},"overrides":[{"matcher":{"id":"byRegexp","options":".*tokens$|^calls$|^llm_spans$|^tool_calls$"},"properties":[{"id":"unit","value":"short"}]},{"matcher":{"id":"byRegexp","options":"^cost_usd$|^cost_estimated_usd$|^cost_total$"},"properties":[{"id":"unit","value":"currencyUSD"}]},{"matcher":{"id":"byRegexp","options":".*duration_ms$|^ms$"},"properties":[{"id":"unit","value":"ms"}]},{"matcher":{"id":"byRegexp","options":".*seconds$|^duration_s$"},"properties":[{"id":"unit","value":"s"}]},{"matcher":{"id":"byRegexp","options":"^errors$|^error_count$"},"properties":[{"id":"custom.cellOptions","value":{"type":"color-text"}},{"id":"thresholds","value":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}},{"id":"color","value":{"mode":"thresholds"}}]}]},"options":{"showHeader":true,"cellHeight":"sm","enablePagination":true},"gridPos":{"x":0,"y":15,"w":24,"h":9}},
      {"id":5,"type":"table","title":"Session ledger","description":"Identity is (client, session_id). Usage is source-selected, not summed across native and hook copies. Native Claude usage is authoritative; Codex turn-cost receipts replace overlapping per-call estimates. cost_source records provenance; reported plus supplemental public list-rate estimates are not billing invoices. cost_estimated_usd NULL means nothing estimated; cost_unpriced_calls 0 means evaluated with nothing unresolved, NULL marks legacy/unprocessed rows. Missing values stay NULL. Modified LOC, accepted/rejected added LOC, native active time, and observed session wall time are distinct. Repository is SHA256 only; branch and outcome require explicit source metadata. All observed session models are preserved as a JSON set.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT session_id, client, provider, models, model_count, CAST(session_start AS TIMESTAMP(6)) AS session_start, CAST(session_end AS TIMESTAMP(6)) AS session_end, duration_s, input_tokens, output_tokens, total_tokens, cost_usd, cost_estimated_usd, CASE WHEN cost_usd IS NULL AND cost_estimated_usd IS NULL THEN NULL ELSE COALESCE(cost_usd, 0) + COALESCE(cost_estimated_usd, 0) END AS cost_total, cost_unpriced_calls, cost_source, llm_spans, tool_calls, error_count, subagents, lines_added, lines_removed, lines_accepted, lines_rejected, edit_accept_count, edit_reject_count, commit_count, pr_count, active_user_seconds, active_cli_seconds, session_wall_seconds, repo, branch, outcome, activity_sources FROM ai_session_summary WHERE $$__timeFilter(session_start) ORDER BY session_start DESC LIMIT 100","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"—","custom":{"align":"auto","cellOptions":{"type":"auto"},"inspect":false}},"overrides":[{"matcher":{"id":"byRegexp","options":".*tokens$|^calls$|^llm_spans$|^tool_calls$"},"properties":[{"id":"unit","value":"short"}]},{"matcher":{"id":"byRegexp","options":"^cost_usd$|^cost_estimated_usd$|^cost_total$"},"properties":[{"id":"unit","value":"currencyUSD"}]},{"matcher":{"id":"byRegexp","options":".*duration_ms$|^ms$"},"properties":[{"id":"unit","value":"ms"}]},{"matcher":{"id":"byRegexp","options":".*seconds$|^duration_s$"},"properties":[{"id":"unit","value":"s"}]},{"matcher":{"id":"byRegexp","options":"^errors$|^error_count$"},"properties":[{"id":"custom.cellOptions","value":{"type":"color-text"}},{"id":"thresholds","value":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}},{"id":"color","value":{"mode":"thresholds"}}]}]},"options":{"showHeader":true,"cellHeight":"sm","enablePagination":true},"gridPos":{"x":0,"y":24,"w":24,"h":9}},
      {"id":21,"type":"row","title":"Collection diagnostics","collapsed":false,"panels":[],"gridPos":{"x":0,"y":33,"w":24,"h":1}},
      {"id":3,"type":"stat","title":"Spans without token attributes","description":"Raw-span diagnostic: native OTel attributes absent on these spans; shown as missing, never as 0. Deduped by (trace_id, span_id). Final 48h of the selected range only. Empty input is No data; 0 means observed spans had the attribute. This is raw attribute coverage, not a claim every span should carry tokens/session identity.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT SUM(missing) AS spans_missing_tokens FROM (SELECT DISTINCT trace_id,span_id,CASE WHEN `span_attributes.gen_ai.usage.input_tokens` IS NULL AND `span_attributes.gen_ai.usage.output_tokens` IS NULL THEN 1 ELSE 0 END AS missing FROM opentelemetry_traces WHERE $$__timeFilter(timestamp) AND timestamp >= FROM_UNIXTIME($$__unixEpochTo() - 172800)) AS observed","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"No data","unit":"short","color":{"mode":"fixed","fixedColor":"blue"},"decimals":0,"mappings":[{"type":"special","options":{"match":"null","result":{"text":"No data","color":"gray"}}}]},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"text":{"valueSize":40}},"gridPos":{"x":0,"y":34,"w":6,"h":6}},
      {"id":4,"type":"table","title":"Reported span errors","description":"Retransmitted error spans deduped by (trace_id, span_id).","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT service_name, span_name, COUNT(*) AS errors FROM (SELECT DISTINCT trace_id, span_id, service_name, span_name FROM opentelemetry_traces WHERE $$__timeFilter(timestamp) AND span_status_code = 'STATUS_CODE_ERROR') AS dedup GROUP BY service_name, span_name ORDER BY errors DESC LIMIT 50","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"—","custom":{"align":"auto","cellOptions":{"type":"auto"},"inspect":false}},"overrides":[{"matcher":{"id":"byRegexp","options":".*tokens$|^calls$|^llm_spans$|^tool_calls$"},"properties":[{"id":"unit","value":"short"}]},{"matcher":{"id":"byRegexp","options":"^cost_usd$|^cost_estimated_usd$|^cost_total$"},"properties":[{"id":"unit","value":"currencyUSD"}]},{"matcher":{"id":"byRegexp","options":".*duration_ms$|^ms$"},"properties":[{"id":"unit","value":"ms"}]},{"matcher":{"id":"byRegexp","options":".*seconds$|^duration_s$"},"properties":[{"id":"unit","value":"s"}]},{"matcher":{"id":"byRegexp","options":"^errors$|^error_count$"},"properties":[{"id":"custom.cellOptions","value":{"type":"color-text"}},{"id":"thresholds","value":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}},{"id":"color","value":{"mode":"thresholds"}}]}]},"options":{"showHeader":true,"cellHeight":"sm","enablePagination":true},"gridPos":{"x":6,"y":34,"w":18,"h":6}}
      ]}
  grafana-dash-ai-tools:
    content: |
      {"uid":"datalake-ai-tools","title":"AI Tools","tags":["datalake","ai"],"timezone":"Asia/Seoul","schemaVersion":39,"version":3,"time":{"from":"now-30d","to":"now"},"description":"Tool execution · call volume · latency. Summary metrics are deduplicated; missing telemetry is not a healthy zero.","refresh":"5m","links":[{"title":"Usage","type":"link","url":"/d/datalake-ai-usage","includeVars":false,"keepTime":true,"targetBlank":false},{"title":"Tools","type":"link","url":"/d/datalake-ai-tools","includeVars":false,"keepTime":true,"targetBlank":false},{"title":"Sessions","type":"link","url":"/d/datalake-ai-sessions","includeVars":false,"keepTime":true,"targetBlank":false}],"templating":{"list":[{"name":"client","type":"textbox","label":"Client (exact)","query":"","current":{"text":"","value":""},"hide":0,"skipUrlSync":false,"description":"Leave blank to include all."},{"name":"tool","type":"textbox","label":"Tool (exact)","query":"","current":{"text":"","value":""},"hide":0,"skipUrlSync":false,"description":"Leave blank to include all."}]},"panels":[
      {"id":10,"title":"Tool calls","type":"stat","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT SUM(calls) AS calls FROM ai_tool_daily WHERE $$__timeFilter(day_start) AND ($${client:sqlstring} = '' OR client = $${client:sqlstring}) AND ($${tool:sqlstring} = '' OR tool_name = $${tool:sqlstring})","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"short","noValue":"—","color":{"mode":"fixed","fixedColor":"blue"},"decimals":0},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"text":{"valueSize":40}},"gridPos":{"x":0,"y":0,"w":6,"h":4}},
      {"id":2,"type":"stat","title":"Distinct tools","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT NULLIF(COUNT(DISTINCT tool_name), 0) AS tools FROM ai_tool_daily WHERE $$__timeFilter(day_start) AND ($${client:sqlstring} = '' OR client = $${client:sqlstring}) AND ($${tool:sqlstring} = '' OR tool_name = $${tool:sqlstring})","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"No data","unit":"short","color":{"mode":"fixed","fixedColor":"green"},"decimals":0,"mappings":[{"type":"special","options":{"match":"null","result":{"text":"No data","color":"gray"}}}]},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"text":{"valueSize":40}},"gridPos":{"x":6,"y":0,"w":6,"h":4}},
      {"id":11,"title":"Reported errors","type":"stat","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT SUM(errors) AS errors FROM ai_tool_daily WHERE $$__timeFilter(day_start) AND ($${client:sqlstring} = '' OR client = $${client:sqlstring}) AND ($${tool:sqlstring} = '' OR tool_name = $${tool:sqlstring})","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"short","noValue":"—","color":{"mode":"fixed","fixedColor":"orange"},"decimals":0},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"text":{"valueSize":40}},"gridPos":{"x":12,"y":0,"w":6,"h":4}},
      {"id":12,"title":"Error rate","type":"stat","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT 100.0 * SUM(errors) / NULLIF(SUM(calls), 0) AS error_rate FROM ai_tool_daily WHERE $$__timeFilter(day_start) AND ($${client:sqlstring} = '' OR client = $${client:sqlstring}) AND ($${tool:sqlstring} = '' OR tool_name = $${tool:sqlstring})","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"percent","noValue":"—","color":{"mode":"fixed","fixedColor":"purple"},"decimals":2},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"text":{"valueSize":40}},"gridPos":{"x":18,"y":0,"w":6,"h":4}},
      {"id":13,"title":"Most-used tools","type":"bargauge","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT tool_name AS tool, SUM(calls) AS calls FROM ai_tool_daily WHERE $$__timeFilter(day_start) AND ($${client:sqlstring} = '' OR client = $${client:sqlstring}) AND ($${tool:sqlstring} = '' OR tool_name = $${tool:sqlstring}) GROUP BY tool_name ORDER BY calls DESC LIMIT 10","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"short","noValue":"—","color":{"mode":"continuous-BlPu"},"min":0},"overrides":[]},"options":{"displayMode":"gradient","orientation":"horizontal","showUnfilled":true,"valueMode":"color","namePlacement":"left","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":true},"text":{"titleSize":12,"valueSize":18}},"gridPos":{"x":0,"y":4,"w":10,"h":10}},
      {"id":14,"title":"Daily tool activity","type":"timeseries","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT day_start AS `time`, client, SUM(calls) AS calls FROM ai_tool_daily WHERE $$__timeFilter(day_start) AND ($${client:sqlstring} = '' OR client = $${client:sqlstring}) AND ($${tool:sqlstring} = '' OR tool_name = $${tool:sqlstring}) GROUP BY `time`, client ORDER BY `time`","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"short","noValue":"—","color":{"mode":"palette-classic"},"custom":{"drawStyle":"bars","lineInterpolation":"linear","barAlignment":0,"barWidthFactor":0.1,"lineWidth":1,"fillOpacity":75,"gradientMode":"opacity","showPoints":"auto","pointSize":5,"spanNulls":false,"axisBorderShow":false,"axisColorMode":"text","scaleDistribution":{"type":"linear"},"stacking":{"mode":"normal","group":"A"},"hideFrom":{"tooltip":false,"viz":false,"legend":false},"barMaxWidth":32}},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull"],"showLegend":true},"tooltip":{"mode":"multi","sort":"desc"}},"gridPos":{"x":10,"y":4,"w":14,"h":10}},
      {"id":3,"type":"timeseries","title":"Tool latency · recent executions","description":"Raw-span diagnostic; retransmissions deduped by (trace_id, span_id). Latest 2000 tool spans, plotted oldest to newest; the inner query picks the recent window, the outer query restores chronological order. Only the final 48h of the selected range are scanned; client/tool filters apply.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT CAST(`time` AS TIMESTAMP(6)) AS `time`, client, tool, ms FROM (SELECT DISTINCT trace_id, span_id, COALESCE(`span_attributes.coding_agent.client`, service_name) AS client, timestamp AS `time`, `span_attributes.gen_ai.tool.name` AS tool, duration_nano / 1000000.0 AS ms FROM opentelemetry_traces WHERE $$__timeFilter(timestamp) AND timestamp >= FROM_UNIXTIME($$__unixEpochTo() - 172800) AND ($${client:sqlstring} = '' OR COALESCE(`span_attributes.coding_agent.client`,service_name) = $${client:sqlstring}) AND ($${tool:sqlstring} = '' OR `span_attributes.gen_ai.tool.name` = $${tool:sqlstring}) AND `span_attributes.gen_ai.tool.name` IS NOT NULL AND duration_nano IS NOT NULL ORDER BY timestamp DESC LIMIT 2000) AS recent ORDER BY `time` ASC","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"—","unit":"ms","color":{"mode":"palette-classic"},"custom":{"drawStyle":"points","lineInterpolation":"linear","barAlignment":0,"barWidthFactor":0.65,"lineWidth":1,"fillOpacity":75,"gradientMode":"opacity","showPoints":"always","pointSize":5,"spanNulls":false,"axisBorderShow":false,"axisColorMode":"text","scaleDistribution":{"type":"linear"},"stacking":{"mode":"none","group":"A"},"hideFrom":{"tooltip":false,"viz":false,"legend":false}}},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["mean","max"],"showLegend":true},"tooltip":{"mode":"multi","sort":"desc"}},"gridPos":{"x":0,"y":14,"w":24,"h":9}},
      {"id":20,"type":"row","title":"Execution ledger","collapsed":false,"panels":[],"gridPos":{"x":0,"y":32,"w":24,"h":1}},
      {"id":1,"type":"table","title":"Daily tool breakdown","description":"ai_tool_daily rows deduped at aggregate time; no raw-span double counting. Empty means no aggregates yet (absence).","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT day_start AS `day`, tool_name AS tool, client, calls, errors, avg_duration_ms FROM ai_tool_daily WHERE $$__timeFilter(day_start) AND ($${client:sqlstring} = '' OR client = $${client:sqlstring}) AND ($${tool:sqlstring} = '' OR tool_name = $${tool:sqlstring}) ORDER BY `day` DESC LIMIT 500","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"—","custom":{"align":"auto","cellOptions":{"type":"auto"},"inspect":false}},"overrides":[{"matcher":{"id":"byRegexp","options":".*tokens$|^calls$|^llm_spans$|^tool_calls$"},"properties":[{"id":"unit","value":"short"}]},{"matcher":{"id":"byRegexp","options":"^cost_usd$|^cost_estimated_usd$|^cost_total$"},"properties":[{"id":"unit","value":"currencyUSD"}]},{"matcher":{"id":"byRegexp","options":".*duration_ms$|^ms$"},"properties":[{"id":"unit","value":"ms"}]},{"matcher":{"id":"byRegexp","options":".*seconds$|^duration_s$"},"properties":[{"id":"unit","value":"s"}]},{"matcher":{"id":"byRegexp","options":"^errors$|^error_count$"},"properties":[{"id":"custom.cellOptions","value":{"type":"color-text"}},{"id":"thresholds","value":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}},{"id":"color","value":{"mode":"thresholds"}}]}]},"options":{"showHeader":true,"cellHeight":"sm","enablePagination":true},"gridPos":{"x":0,"y":33,"w":24,"h":9}},
      {"id":4,"type":"table","title":"Recent tool errors","description":"Latest 100 observed tool error spans in the final 48h of the selected range; exact retransmission duplicates removed. Client/tool filters apply. Click trace_id to inspect related spans/log metadata; error content stays redacted.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT DISTINCT CAST(timestamp AS TIMESTAMP(6)) AS time, service_name, span_name, `span_attributes.gen_ai.tool.name` AS tool, duration_nano / 1000000.0 AS duration_ms, trace_id, span_id FROM opentelemetry_traces WHERE $$__timeFilter(timestamp) AND timestamp >= FROM_UNIXTIME($$__unixEpochTo() - 172800) AND `span_attributes.gen_ai.tool.name` IS NOT NULL AND ($${client:sqlstring} = '' OR COALESCE(`span_attributes.coding_agent.client`,service_name) = $${client:sqlstring}) AND ($${tool:sqlstring} = '' OR `span_attributes.gen_ai.tool.name` = $${tool:sqlstring}) AND span_status_code = 'STATUS_CODE_ERROR' ORDER BY time DESC LIMIT 100","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"—","custom":{"align":"auto","cellOptions":{"type":"auto"},"inspect":false}},"overrides":[{"matcher":{"id":"byRegexp","options":".*tokens$|^calls$|^llm_spans$|^tool_calls$"},"properties":[{"id":"unit","value":"short"}]},{"matcher":{"id":"byRegexp","options":"^cost_usd$|^cost_estimated_usd$|^cost_total$"},"properties":[{"id":"unit","value":"currencyUSD"}]},{"matcher":{"id":"byRegexp","options":".*duration_ms$|^ms$"},"properties":[{"id":"unit","value":"ms"}]},{"matcher":{"id":"byRegexp","options":".*seconds$|^duration_s$"},"properties":[{"id":"unit","value":"s"}]},{"matcher":{"id":"byRegexp","options":"^errors$|^error_count$"},"properties":[{"id":"custom.cellOptions","value":{"type":"color-text"}},{"id":"thresholds","value":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}},{"id":"color","value":{"mode":"thresholds"}}]},{"matcher":{"id":"byName","options":"trace_id"},"properties":[{"id":"links","value":[{"title":"Inspect this trace and correlated logs","url":"/d/datalake-overview?var-trace_id=$${__value.raw}&$${__url_time_range}","targetBlank":false}]}]}]},"options":{"showHeader":true,"cellHeight":"sm","enablePagination":true},"gridPos":{"x":0,"y":42,"w":24,"h":8}},
      {"id":15,"type":"table","title":"Tool latency tails · approximate p50 / p95 / p99","description":"Final 48h of the selected range, top 20 client/tool groups by p95. Computed from raw observations, NOT percentiles of daily averages. Small sample counts make tail estimates unstable. No matching spans means No data.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","datasource":{"type":"mysql","uid":"greptime-mysql"},"rawSql":"SELECT client, tool, COUNT(*) AS duration_samples, approx_percentile_cont(ms,0.5) AS p50_ms, approx_percentile_cont(ms,0.95) AS p95_ms, approx_percentile_cont(ms,0.99) AS p99_ms, MAX(ms) AS max_ms FROM (SELECT DISTINCT trace_id,span_id,COALESCE(`span_attributes.coding_agent.client`,service_name) AS client,`span_attributes.gen_ai.tool.name` AS tool,duration_nano / 1000000.0 AS ms FROM opentelemetry_traces WHERE $$__timeFilter(timestamp) AND timestamp >= FROM_UNIXTIME($$__unixEpochTo() - 172800) AND `span_attributes.gen_ai.tool.name` IS NOT NULL AND ($${client:sqlstring} = '' OR COALESCE(`span_attributes.coding_agent.client`,service_name) = $${client:sqlstring}) AND ($${tool:sqlstring} = '' OR `span_attributes.gen_ai.tool.name` = $${tool:sqlstring}) AND duration_nano IS NOT NULL) AS dedup GROUP BY client,tool ORDER BY p95_ms DESC LIMIT 20","format":"table"}],"fieldConfig":{"defaults":{"noValue":"No data","custom":{"minWidth":55,"width":80}},"overrides":[{"matcher":{"id":"byRegexp","options":".*_ms$"},"properties":[{"id":"unit","value":"ms"}]},{"matcher":{"id":"byName","options":"client"},"properties":[{"id":"custom.width","value":100}]},{"matcher":{"id":"byName","options":"tool"},"properties":[{"id":"custom.width","value":150}]},{"matcher":{"id":"byName","options":"duration_samples"},"properties":[{"id":"displayName","value":"n"}]}]},"options":{"showHeader":true,"cellHeight":"sm"},"gridPos":{"x":0,"y":23,"w":24,"h":9}}
      ]}
  grafana-dash-ai-sessions:
    content: |
      {"uid":"datalake-ai-sessions","title":"AI Sessions","tags":["datalake","ai"],"timezone":"Asia/Seoul","schemaVersion":39,"version":4,"time":{"from":"now-30d","to":"now"},"description":"Session activity · client mix · coding outcomes. Session identity is (client, session_id). Observed wall time is not active work time.","refresh":"5m","links":[{"title":"Usage","type":"link","url":"/d/datalake-ai-usage","includeVars":false,"keepTime":true,"targetBlank":false},{"title":"Tools","type":"link","url":"/d/datalake-ai-tools","includeVars":false,"keepTime":true,"targetBlank":false},{"title":"Sessions","type":"link","url":"/d/datalake-ai-sessions","includeVars":false,"keepTime":true,"targetBlank":false}],"panels":[
      {"id":2,"type":"stat","title":"Sessions","description":"Session identity is (client, session_id); the same id across clients counts separately. Empty means no aggregates yet (absence), not zero.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT NULLIF(COUNT(*), 0) AS sessions FROM (SELECT DISTINCT client, session_id FROM ai_session_summary WHERE $$__timeFilter(session_start)) AS sessions_scoped","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"No data","unit":"short","color":{"mode":"fixed","fixedColor":"blue"},"decimals":0,"mappings":[{"type":"special","options":{"match":"null","result":{"text":"No data","color":"gray"}}}]},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"text":{"valueSize":40}},"gridPos":{"x":0,"y":0,"w":6,"h":4}},
      {"id":10,"title":"Tool calls","type":"stat","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT SUM(tool_calls) AS calls FROM ai_session_summary WHERE $$__timeFilter(session_start)","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","color":{"mode":"fixed","fixedColor":"green"},"decimals":0,"mappings":[{"type":"special","options":{"match":"null","result":{"text":"No data","color":"gray"}}}]},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"text":{"valueSize":40}},"gridPos":{"x":6,"y":0,"w":6,"h":4}},
      {"id":11,"title":"Reported errors","type":"stat","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT SUM(error_count) AS errors FROM ai_session_summary WHERE $$__timeFilter(session_start)","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","color":{"mode":"fixed","fixedColor":"orange"},"decimals":0,"mappings":[{"type":"special","options":{"match":"null","result":{"text":"No data","color":"gray"}}}]},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"text":{"valueSize":40}},"gridPos":{"x":12,"y":0,"w":6,"h":4}},
      {"id":12,"title":"Observed wall time","type":"stat","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT SUM(session_wall_seconds) AS wall_time FROM ai_session_summary WHERE $$__timeFilter(session_start)","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"s","noValue":"No data","color":{"mode":"fixed","fixedColor":"purple"},"decimals":0,"mappings":[{"type":"special","options":{"match":"null","result":{"text":"No data","color":"gray"}}}]},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"text":{"valueSize":40}},"gridPos":{"x":18,"y":0,"w":6,"h":4},"description":"Sum of reported session wall seconds. Concurrent sessions overlap; this is neither elapsed calendar time nor active user time."},
      {"id":13,"title":"Session starts · by client","type":"timeseries","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT CAST(date_trunc('day', session_start) AS TIMESTAMP(6)) AS `time`, client, COUNT(*) AS sessions FROM ai_session_summary WHERE $$__timeFilter(session_start) GROUP BY `time`, client ORDER BY `time`","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"short","noValue":"—","color":{"mode":"palette-classic"},"custom":{"drawStyle":"bars","lineInterpolation":"linear","barAlignment":0,"barWidthFactor":0.1,"lineWidth":1,"fillOpacity":75,"gradientMode":"opacity","showPoints":"auto","pointSize":5,"spanNulls":false,"axisBorderShow":false,"axisColorMode":"text","scaleDistribution":{"type":"linear"},"stacking":{"mode":"normal","group":"A"},"hideFrom":{"tooltip":false,"viz":false,"legend":false},"barMaxWidth":32}},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull"],"showLegend":true},"tooltip":{"mode":"multi","sort":"desc"}},"gridPos":{"x":0,"y":4,"w":16,"h":10}},
      {"id":14,"title":"Client mix · sessions","type":"bargauge","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT client, COUNT(*) AS sessions FROM ai_session_summary WHERE $$__timeFilter(session_start) GROUP BY client ORDER BY sessions DESC","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"short","noValue":"—","color":{"mode":"continuous-BlPu"},"min":0},"overrides":[]},"options":{"displayMode":"gradient","orientation":"horizontal","showUnfilled":true,"valueMode":"color","namePlacement":"left","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":true},"text":{"titleSize":12,"valueSize":18}},"gridPos":{"x":16,"y":4,"w":8,"h":10}},
      {"id":20,"type":"row","title":"Session & activity ledgers","collapsed":false,"panels":[],"gridPos":{"x":0,"y":14,"w":24,"h":1}},
      {"id":1,"type":"table","title":"Session ledger","description":"Identity is (client, session_id). Usage is source-selected, not summed across native and hook copies. Native Claude usage is authoritative; Codex turn-cost receipts replace overlapping per-call estimates. cost_source records provenance; reported plus supplemental public list-rate estimates are not billing invoices. cost_estimated_usd NULL means nothing estimated; cost_unpriced_calls 0 means evaluated with nothing unresolved, NULL marks legacy/unprocessed rows. Missing values stay NULL. Modified LOC, accepted/rejected added LOC, native active time, and observed session wall time are distinct. Repository is SHA256 only; branch and outcome require explicit source metadata. All observed session models are preserved as a JSON set.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT session_id, client, provider, models, model_count, CAST(session_start AS TIMESTAMP(6)) AS session_start, CAST(session_end AS TIMESTAMP(6)) AS session_end, duration_s, input_tokens, output_tokens, total_tokens, cost_usd, cost_estimated_usd, CASE WHEN cost_usd IS NULL AND cost_estimated_usd IS NULL THEN NULL ELSE COALESCE(cost_usd, 0) + COALESCE(cost_estimated_usd, 0) END AS cost_total, cost_unpriced_calls, cost_source, llm_spans, tool_calls, error_count, subagents, lines_added, lines_removed, lines_accepted, lines_rejected, edit_accept_count, edit_reject_count, commit_count, pr_count, active_user_seconds, active_cli_seconds, session_wall_seconds, repo, branch, outcome, activity_sources FROM ai_session_summary WHERE $$__timeFilter(session_start) ORDER BY session_start DESC LIMIT 100","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"—","custom":{"align":"auto","cellOptions":{"type":"auto"},"inspect":false}},"overrides":[{"matcher":{"id":"byRegexp","options":".*tokens$|^calls$|^llm_spans$|^tool_calls$"},"properties":[{"id":"unit","value":"short"}]},{"matcher":{"id":"byRegexp","options":"^cost_usd$|^cost_estimated_usd$|^cost_total$"},"properties":[{"id":"unit","value":"currencyUSD"}]},{"matcher":{"id":"byRegexp","options":".*duration_ms$|^ms$"},"properties":[{"id":"unit","value":"ms"}]},{"matcher":{"id":"byRegexp","options":".*seconds$|^duration_s$"},"properties":[{"id":"unit","value":"s"}]},{"matcher":{"id":"byRegexp","options":"^errors$|^error_count$"},"properties":[{"id":"custom.cellOptions","value":{"type":"color-text"}},{"id":"thresholds","value":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}},{"id":"color","value":{"mode":"thresholds"}}]}]},"options":{"showHeader":true,"cellHeight":"sm","enablePagination":true},"gridPos":{"x":0,"y":15,"w":24,"h":10}},
      {"id":6,"type":"table","title":"Daily coding activity","description":"ai_activity_daily rows keyed by (client, day_start); per-day rollups of subagents, modified vs accepted/rejected ADDED LOC, edit decisions, commits/PRs, and native active vs observed wall seconds. lines_added/removed are modified LOC; lines_accepted/rejected are accepted/rejected ADDED lines only (explicit decisions, never inferred). active_user/cli_seconds are native active counters; session_wall_seconds is the union of observed session intervals clipped per UTC day, not active time. NULL means unknown/unsupported, never zero-filled; activity_sources names the producer per field. Empty means no aggregates yet (absence).","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT day_start AS `day`, client, subagents, lines_added, lines_removed, lines_accepted, lines_rejected, edit_accept_count, edit_reject_count, commit_count, pr_count, active_user_seconds, active_cli_seconds, session_wall_seconds, activity_sources FROM ai_activity_daily WHERE $$__timeFilter(day_start) ORDER BY `day` DESC LIMIT 500","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"—","custom":{"align":"auto","cellOptions":{"type":"auto"},"inspect":false}},"overrides":[{"matcher":{"id":"byRegexp","options":".*tokens$|^calls$|^llm_spans$|^tool_calls$"},"properties":[{"id":"unit","value":"short"}]},{"matcher":{"id":"byRegexp","options":"^cost_usd$|^cost_estimated_usd$|^cost_total$"},"properties":[{"id":"unit","value":"currencyUSD"}]},{"matcher":{"id":"byRegexp","options":".*duration_ms$|^ms$"},"properties":[{"id":"unit","value":"ms"}]},{"matcher":{"id":"byRegexp","options":".*seconds$|^duration_s$"},"properties":[{"id":"unit","value":"s"}]},{"matcher":{"id":"byRegexp","options":"^errors$|^error_count$"},"properties":[{"id":"custom.cellOptions","value":{"type":"color-text"}},{"id":"thresholds","value":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}},{"id":"color","value":{"mode":"thresholds"}}]}]},"options":{"showHeader":true,"cellHeight":"sm","enablePagination":true},"gridPos":{"x":0,"y":25,"w":24,"h":8}},
      {"id":21,"type":"row","title":"Collection diagnostics","collapsed":false,"panels":[],"gridPos":{"x":0,"y":33,"w":24,"h":1}},
      {"id":3,"type":"stat","title":"Spans without session identity","description":"Raw-span diagnostic across supported canonical/native session keys; missing identity is not a zero session count. Final 48h of the selected range only. Empty input is No data; 0 means observed spans had the attribute. This is raw attribute coverage, not a claim every span should carry tokens/session identity.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT SUM(missing) AS spans_no_session FROM (SELECT DISTINCT trace_id,span_id,CASE WHEN COALESCE(NULLIF(`span_attributes.coding_agent.session.id`, ''), NULLIF(`span_attributes.session.id`, ''), NULLIF(`span_attributes.conversation.id`, ''), NULLIF(`span_attributes.gen_ai.conversation.id`, '')) IS NULL THEN 1 ELSE 0 END AS missing FROM opentelemetry_traces WHERE $$__timeFilter(timestamp) AND timestamp >= FROM_UNIXTIME($$__unixEpochTo() - 172800)) AS observed","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"No data","unit":"short","color":{"mode":"fixed","fixedColor":"blue"},"decimals":0,"mappings":[{"type":"special","options":{"match":"null","result":{"text":"No data","color":"gray"}}}]},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"text":{"valueSize":40}},"gridPos":{"x":0,"y":34,"w":6,"h":6}},
      {"id":4,"type":"table","title":"Spans per day (deduped)","description":"Retransmitted spans deduped by (trace_id, span_id).","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT `day`, COUNT(*) AS spans FROM (SELECT DISTINCT trace_id, span_id, CAST(timestamp AS DATE) AS `day` FROM opentelemetry_traces WHERE $$__timeFilter(timestamp)) AS dedup GROUP BY `day` ORDER BY `day` ASC","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"—","custom":{"align":"auto","cellOptions":{"type":"auto"},"inspect":false}},"overrides":[{"matcher":{"id":"byRegexp","options":".*tokens$|^calls$|^llm_spans$|^tool_calls$"},"properties":[{"id":"unit","value":"short"}]},{"matcher":{"id":"byRegexp","options":"^cost_usd$|^cost_estimated_usd$|^cost_total$"},"properties":[{"id":"unit","value":"currencyUSD"}]},{"matcher":{"id":"byRegexp","options":".*duration_ms$|^ms$"},"properties":[{"id":"unit","value":"ms"}]},{"matcher":{"id":"byRegexp","options":".*seconds$|^duration_s$"},"properties":[{"id":"unit","value":"s"}]},{"matcher":{"id":"byRegexp","options":"^errors$|^error_count$"},"properties":[{"id":"custom.cellOptions","value":{"type":"color-text"}},{"id":"thresholds","value":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}},{"id":"color","value":{"mode":"thresholds"}}]}]},"options":{"showHeader":true,"cellHeight":"sm","enablePagination":true},"gridPos":{"x":6,"y":34,"w":18,"h":6}},
      {"id":5,"type":"table","title":"Logs per day (ai_log_daily summary)","description":"ai_log_daily rollups by scope/severity; empty means no log aggregates yet (absence), not zero. Raw opentelemetry_logs remain queryable; body content is privacy-redacted at ingest so only counts are shown here.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT day_start AS `day`, scope_name, severity_text, log_count, error_count FROM ai_log_daily WHERE $$__timeFilter(day_start) ORDER BY `day` DESC LIMIT 500","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"—","custom":{"align":"auto","cellOptions":{"type":"auto"},"inspect":false}},"overrides":[{"matcher":{"id":"byRegexp","options":".*tokens$|^calls$|^llm_spans$|^tool_calls$"},"properties":[{"id":"unit","value":"short"}]},{"matcher":{"id":"byRegexp","options":"^cost_usd$|^cost_estimated_usd$|^cost_total$"},"properties":[{"id":"unit","value":"currencyUSD"}]},{"matcher":{"id":"byRegexp","options":".*duration_ms$|^ms$"},"properties":[{"id":"unit","value":"ms"}]},{"matcher":{"id":"byRegexp","options":".*seconds$|^duration_s$"},"properties":[{"id":"unit","value":"s"}]},{"matcher":{"id":"byRegexp","options":"^errors$|^error_count$"},"properties":[{"id":"custom.cellOptions","value":{"type":"color-text"}},{"id":"thresholds","value":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}},{"id":"color","value":{"mode":"thresholds"}}]}]},"options":{"showHeader":true,"cellHeight":"sm","enablePagination":true},"gridPos":{"x":0,"y":40,"w":24,"h":8}}
      ]}
  grafana-dash-vehicle-overview:
    content: |
      {"uid":"datalake-vehicle-overview","title":"차량 개요","tags":["datalake","vehicle"],"timezone":"Asia/Seoul","schemaVersion":39,"version":7,"time":{"from":"now-2d","to":"now"},"templating":{"list":[{"name":"vehicle","type":"query","label":"차량","query":"SELECT DISTINCT vehicle FROM vehicle_signal UNION SELECT DISTINCT vehicle FROM vehicle_analysis ORDER BY vehicle","current":{},"description":"확인할 차량을 선택하세요. 서로 다른 차량의 값은 합산하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"refresh":1,"sort":1,"options":[],"includeAll":false,"multi":false},{"name":"source","type":"query","label":"수집 경로","query":"SELECT '' AS __value, '전체' AS __text UNION SELECT DISTINCT source AS __value, source AS __text FROM vehicle_signal WHERE ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) ORDER BY __value","current":{"text":"전체","value":""},"description":"Exact match; can and fleet are never merged.","hide":0,"datasource":{"type":"mysql","uid":"greptime-mysql"},"options":[],"refresh":1,"includeAll":false,"multi":false},{"name":"epoch","type":"query","label":"해석 버전","query":"SELECT '' AS __value, '전체' AS __text UNION SELECT DISTINCT COALESCE(decode_epoch, '') AS __value, COALESCE(decode_epoch, '') AS __text FROM vehicle_signal WHERE ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) ORDER BY __value","current":{"text":"전체","value":""},"description":"Exact match; blank includes all epochs as separate scopes.","hide":0,"datasource":{"type":"mysql","uid":"greptime-mysql"},"options":[],"refresh":1,"includeAll":false,"multi":false},{"name":"signal","type":"query","label":"신호","query":"SELECT DISTINCT path FROM vehicle_signal WHERE value_num IS NOT NULL ORDER BY path","datasource":{"type":"mysql","uid":"greptime-mysql"},"refresh":1,"sort":1,"current":{"text":"Vehicle.Powertrain.TractionBattery.StateOfCharge.Displayed","value":"Vehicle.Powertrain.TractionBattery.StateOfCharge.Displayed"},"includeAll":false,"multi":false,"options":[],"description":"직접 확인할 신호 경로입니다."}]},"description":"내 차의 마지막 상태(잔량, 전력, 충전·기어, 온도)와 최근 변화입니다. 값은 차량이 마지막으로 보낸 기록이며 실시간이 아닐 수 있습니다. 배터리 세부는 '배터리' 링크에서 확인하세요.","links":[{"title":"배터리","type":"link","url":"/d/datalake-vehicle-battery","includeVars":true,"keepTime":true,"targetBlank":false},{"title":"충전","type":"link","url":"/d/datalake-vehicle-charging","includeVars":true,"keepTime":true,"targetBlank":false},{"title":"주행","type":"link","url":"/d/datalake-vehicle-drives","includeVars":true,"keepTime":true,"targetBlank":false},{"title":"수집 진단 · CAN/VSS","type":"link","url":"/d/datalake-vehicle-can-vss","includeVars":true,"keepTime":true,"targetBlank":false},{"title":"수집 진단 · DBC","type":"link","url":"/d/datalake-vehicle-dbc-health","includeVars":true,"keepTime":true,"targetBlank":false}],"panels":[
      {"id":90,"type":"text","title":"CAN 보고값 해석","options":{"mode":"markdown","content":"**CAN은 미검증 보고값입니다.** 선택 기간의 관측 기록이며 현재 차량 상태나 건강 판정이 아닙니다. 아래 관측 시각과 DB 수신 시각을 구분하세요. CAN 기어·충전 상태는 DBC enum을 표시하며 충전 허용을 실제 충전 중으로 단정하지 않습니다. 대응 신호가 없는 온도·셀 번호와 검증되지 않은 전력·에너지 계산은 판단 불가로 남습니다."},"gridPos":{"x":0,"y":0,"w":24,"h":3}},
      {"id":91,"type":"table","title":"CAN 보고값 · 관측 시각과 DB 수신 시각","description":"선택 기간의 신호별 최신 원본 보고값입니다. invalid/unknown_enum과 원본 단위를 그대로 보여주며 건강 판정으로 사용하지 않습니다. 최신 무효 보고도 숨기지 않습니다. 차량 식별자는 자동으로 합치지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, source_field ORDER BY event_time DESC, ingest_time DESC, envelope_id DESC) AS latest_rank FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND ((source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socUI' AND source_field = 'BMS_socUI') OR (source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socAvg' AND source_field = 'BMS_socAvg') OR (source = 'can' AND path = 'Vehicle.CAN.x352.BMS_nominalEnergyRemaining' AND source_field = 'BMS_nominalEnergyRemaining') OR (source = 'can' AND path = 'Vehicle.CAN.x118.DI_gear' AND source_field = 'DI_gear') OR (source = 'can' AND path = 'Vehicle.CAN.x13D.CP_hvChargeStatus' AND source_field = 'CP_hvChargeStatus') OR (source = 'can' AND path = 'Vehicle.CAN.x20C.VCRIGHT_tempAmbientRaw' AND source_field = 'VCRIGHT_tempAmbientRaw') OR (source = 'can' AND path = 'Vehicle.CAN.x332.BMS_brickVoltageMax' AND source_field = 'BMS_brickVoltageMax') OR (source = 'can' AND path = 'Vehicle.CAN.x332.BMS_brickVoltageMin' AND source_field = 'BMS_brickVoltageMin') OR (source = 'can' AND path = 'Vehicle.CAN.x257.DI_vehicleSpeed' AND source_field = 'DI_vehicleSpeed') OR (source = 'can' AND path = 'Vehicle.CAN.x132.BMS_packVoltage' AND source_field = 'BMS_packVoltage') OR (source = 'can' AND path = 'Vehicle.CAN.x132.BMS_packCurrent' AND source_field = 'BMS_packCurrent'))) SELECT vehicle AS `차량`, source AS `수집원`, decode_epoch AS `해석 버전`, source_field AS `원본 신호`, value_num AS `숫자 보고값`, value_text AS `상태 보고값`, unit AS `원본 단위`, quality AS `품질`, CAST(event_time AS TIMESTAMP(6)) AS `관측 시각`, CAST(ingest_time AS TIMESTAMP(6)) AS `DB 수신 시각` FROM latest WHERE latest_rank = 1 ORDER BY vehicle, source, decode_epoch, source_field","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음"},"overrides":[{"matcher":{"id":"byName","options":"관측 시각"},"properties":[{"id":"unit","value":"dateTimeAsIso"}]},{"matcher":{"id":"byName","options":"DB 수신 시각"},"properties":[{"id":"unit","value":"dateTimeAsIso"}]}]},"options":{"showHeader":true},"gridPos":{"x":0,"y":3,"w":24,"h":5}},
      {"id":1,"type":"gauge","title":"배터리 잔량 · 보고값","description":"차량 화면에 표시되는 잔량(BatteryLevel)입니다. 색은 10%·20% 이하일 때 바뀌며 배터리 상태 판정이 아닙니다. 차량이 표시하는 BatteryLevel입니다. 물리 SOC나 추정 SOC와 다를 수 있습니다. 선택 기간의 가장 최근 보고값이며, 최신 값이 무효이면 과거 값으로 대체하지 않습니다. 개별 값의 관측 시각과 차량 식별자는 아래 분석 기록에서 확인할 수 있습니다. CAN 대응: BMS_socUI의 미검증 보고값입니다. 관측 시각은 위 CAN 보고값 표를 확인하세요. 단위 불일치·최신 무효 값은 과거 정상 값으로 대체하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH signals AS (SELECT event_time, vehicle, source, decode_epoch, ingest_time, envelope_id, value_num, value_text, value_bool, path AS path, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socUI' AND source_field = 'BMS_socUI' THEN 'BatteryLevel' ELSE source_field END AS source_field, unit AS unit, quality, (quality = 'reported_unverified' AND ((source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socUI' AND source_field = 'BMS_socUI'))) AS can_report FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, source_field ORDER BY event_time DESC, ingest_time DESC, envelope_id DESC) AS latest_rank FROM signals WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field = 'BatteryLevel') SELECT vehicle, source, decode_epoch, CAST(event_time AS TIMESTAMP(6)) AS observed_at, CASE WHEN unit = '%' AND (quality IS NULL OR quality = 'ok' OR can_report) THEN value_num ELSE NULL END AS reading FROM latest WHERE latest_rank = 1 ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"percent","decimals":0,"noValue":"판단 불가","color":{"mode":"thresholds"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"판단 불가","color":"#6E7681","index":0}}}],"min":0,"max":100,"thresholds":{"mode":"absolute","steps":[{"value":null,"color":"#E02F44"},{"value":10,"color":"#FF9830"},{"value":20,"color":"#56A64B"}]}},"overrides":[{"matcher":{"id":"byName","options":"observed_at"},"properties":[{"id":"unit","value":"dateTimeAsIso"}]}]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":true},"orientation":"auto","showThresholdLabels":false,"showThresholdMarkers":false,"sizing":"auto","minVizHeight":75,"minVizWidth":75,"text":{"valueSize":44}},"gridPos":{"x":0,"y":8,"w":6,"h":8}},
      {"id":2,"type":"stat","title":"남은 에너지 · 보고값","description":"차량 BMS가 보고한 남은 에너지(EnergyRemaining, kWh)의 가장 최근 값입니다. 최신 값이 무효이면 과거 값으로 대체하지 않습니다. CAN 대응: BMS_nominalEnergyRemaining의 미검증 보고값입니다. 관측 시각은 위 CAN 보고값 표를 확인하세요. 단위 불일치·최신 무효 값은 과거 정상 값으로 대체하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH signals AS (SELECT event_time, vehicle, source, decode_epoch, ingest_time, envelope_id, value_num, value_text, value_bool, path AS path, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x352.BMS_nominalEnergyRemaining' AND source_field = 'BMS_nominalEnergyRemaining' THEN 'EnergyRemaining' ELSE source_field END AS source_field, unit AS unit, quality, (quality = 'reported_unverified' AND ((source = 'can' AND path = 'Vehicle.CAN.x352.BMS_nominalEnergyRemaining' AND source_field = 'BMS_nominalEnergyRemaining'))) AS can_report FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, source_field ORDER BY event_time DESC, ingest_time DESC, envelope_id DESC) AS latest_rank FROM signals WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field IN ('EnergyRemaining')) SELECT vehicle, source, decode_epoch, MAX(CASE WHEN unit = 'kWh' AND (quality IS NULL OR quality = 'ok' OR can_report) THEN value_num END) AS reading FROM latest WHERE latest_rank = 1 GROUP BY vehicle, source, decode_epoch ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"kwatth","noValue":"기록 없음","color":{"mode":"fixed","fixedColor":"#3274D9"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"기록 없음","color":"#6E7681","index":0}}}]},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":true},"text":{"valueSize":34,"titleSize":12}},"gridPos":{"x":6,"y":8,"w":5,"h":4}},
      {"id":6,"type":"stat","title":"최근 완료 구간 배터리 전력","description":"시간별 분석이 완료된 가장 최근 구간의 마지막 동시 팩 전압·전류 관측입니다. 실시간 전력이 아닙니다. 정확한 차량·수집원·해석 버전의 단위 교정(scale/offset)과 current_sign을 적용하며 + 충전 / − 사용입니다. 최신 무효·단위 미확인·시각 불일치·구간 끝에서 max_gap_ns 초과는 판단 불가이고, 더 최근의 미분석 원시 입력도 과거 값으로 대체하지 않습니다. 관측 시각은 분석 기록의 value_text에 UTC로 남습니다. 선택 기간 끝의 바로 전 완료 시간 구간이 없으면 과거 구간 숫자를 표시하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND `metric` = 'battery.energy.latest_power_kw'), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric` ORDER BY window_start DESC, computed_at DESC, revision DESC) AS latest_rank FROM revisions WHERE revision_rank = 1), raw_frontier AS (SELECT vehicle, source, decode_epoch, MAX(event_time) AS raw_event_time, MAX(ingest_time) AS raw_ingest_time FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field IN ('PackVoltage', 'PackCurrent') GROUP BY vehicle, source, decode_epoch) SELECT latest.vehicle, latest.source, latest.decode_epoch, CAST(latest.value_text AS TIMESTAMP(6)) AS observed_at, CASE WHEN latest.window_end >= FROM_UNIXTIME(CAST(FLOOR($$__unixEpochTo() / 3600) * 3600 - 1 AS BIGINT)) AND latest.status = 'derived' AND latest.unit = 'kW' AND latest.value_text IS NOT NULL AND (raw.raw_event_time IS NULL OR raw.raw_event_time <= CAST(latest.value_text AS TIMESTAMP(6))) AND (raw.raw_ingest_time IS NULL OR raw.raw_ingest_time <= latest.computed_at) THEN latest.`value` ELSE NULL END AS reading FROM latest LEFT JOIN raw_frontier raw ON raw.vehicle = latest.vehicle AND raw.source = latest.source AND COALESCE(raw.decode_epoch, '') = COALESCE(latest.decode_epoch, '') WHERE latest.latest_rank = 1 ORDER BY latest.vehicle, latest.source, latest.decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"kwatt","noValue":"기록 없음","color":{"mode":"thresholds"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"판단 불가","color":"#6E7681","index":0}}}],"decimals":1,"thresholds":{"mode":"absolute","steps":[{"value":null,"color":"#3274D9"},{"value":-0.5,"color":"#6E7681"},{"value":0.5,"color":"#56A64B"}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"/^reading$/","values":true},"text":{"valueSize":34,"titleSize":12}},"gridPos":{"x":11,"y":8,"w":5,"h":4}},
      {"id":7,"type":"stat","title":"기어 · 보고값","description":"가장 최근 기어 상태입니다. 무효로 들어온 최신 값은 과거 값으로 대체하지 않습니다. CAN 대응: DI_gear의 미검증 보고값입니다. 관측 시각은 위 CAN 보고값 표를 확인하세요. 단위 불일치·최신 무효 값은 과거 정상 값으로 대체하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH signals AS (SELECT event_time, vehicle, source, decode_epoch, ingest_time, envelope_id, value_num, value_text, value_bool, path AS path, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x118.DI_gear' AND source_field = 'DI_gear' THEN 'Gear' ELSE source_field END AS source_field, unit AS unit, quality, (quality = 'reported_unverified' AND ((source = 'can' AND path = 'Vehicle.CAN.x118.DI_gear' AND source_field = 'DI_gear'))) AS can_report FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, source_field ORDER BY event_time DESC, ingest_time DESC, envelope_id DESC) AS latest_rank FROM signals WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field IN ('Gear')) SELECT vehicle, source, decode_epoch, MAX(CASE WHEN source_field = 'Gear' AND (quality IS NULL OR quality = 'ok' OR can_report) AND (source <> 'can' OR value_text IN ('DI_GEAR_P', 'DI_GEAR_D', 'DI_GEAR_R', 'DI_GEAR_N')) THEN value_text END) AS reading FROM latest WHERE latest_rank = 1 GROUP BY vehicle, source, decode_epoch ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"none","noValue":"기록 없음","color":{"mode":"thresholds"},"mappings":[{"type":"value","options":{"P":{"text":"주차","color":"#5E6A7A","index":0},"D":{"text":"주행","color":"#3274D9","index":1},"R":{"text":"후진","color":"#A352CC","index":2},"N":{"text":"중립","color":"#E0B400","index":3},"DI_GEAR_P":{"text":"주차 · CAN 미검증","color":"#FF9830","index":4},"DI_GEAR_D":{"text":"주행 · CAN 미검증","color":"#FF9830","index":5},"DI_GEAR_R":{"text":"후진 · CAN 미검증","color":"#FF9830","index":6},"DI_GEAR_N":{"text":"중립 · CAN 미검증","color":"#FF9830","index":7}}},{"type":"special","options":{"match":"null","result":{"text":"판단 불가","color":"#6E7681","index":0}}}],"thresholds":{"mode":"absolute","steps":[{"value":null,"color":"#6E7681"}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"/^reading$/","values":true},"text":{"valueSize":26,"titleSize":12}},"gridPos":{"x":16,"y":8,"w":4,"h":4}},
      {"id":3,"type":"stat","title":"마지막 관측","description":"원본 event_time 기준 마지막 관측 시각입니다(기간 필터와 무관). DB 수신 시각이나 현재 상태가 아닙니다. CAN 원본 보고값 표에서 각각의 관측 시각을 확인하세요.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT vehicle, source, decode_epoch, CAST(MAX(event_time) AS BIGINT) / 1000000 AS reading FROM vehicle_signal WHERE ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) GROUP BY vehicle, source, decode_epoch ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"dateTimeFromNow","decimals":2,"noValue":"수신 기록 없음","color":{"mode":"fixed","fixedColor":"#6E7681"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"수신 기록 없음","color":"#6E7681","index":0}}}]},"overrides":[]},"options":{"colorMode":"value","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":true},"text":{"valueSize":24,"titleSize":12}},"gridPos":{"x":20,"y":8,"w":4,"h":4}},
      {"id":8,"type":"stat","title":"충전 상태 · 보고값","description":"가장 최근 충전 상태(DetailedChargeState)입니다. CAN 대응: CP_hvChargeStatus의 미검증 보고값입니다. 관측 시각은 위 CAN 보고값 표를 확인하세요. 단위 불일치·최신 무효 값은 과거 정상 값으로 대체하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH signals AS (SELECT event_time, vehicle, source, decode_epoch, ingest_time, envelope_id, value_num, value_text, value_bool, path AS path, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x13D.CP_hvChargeStatus' AND source_field = 'CP_hvChargeStatus' THEN 'DetailedChargeState' ELSE source_field END AS source_field, unit AS unit, quality, (quality = 'reported_unverified' AND ((source = 'can' AND path = 'Vehicle.CAN.x13D.CP_hvChargeStatus' AND source_field = 'CP_hvChargeStatus'))) AS can_report FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, source_field ORDER BY event_time DESC, ingest_time DESC, envelope_id DESC) AS latest_rank FROM signals WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field IN ('DetailedChargeState')) SELECT vehicle, source, decode_epoch, MAX(CASE WHEN source_field = 'DetailedChargeState' AND (quality IS NULL OR quality = 'ok' OR can_report) AND (source <> 'can' OR value_text IN ('CP_CHARGE_INACTIVE', 'CP_CHARGE_CONNECTED', 'CP_CHARGE_STANDBY', 'CP_EXT_EVSE_TEST_ACTIVE', 'CP_EVSE_TEST_PASSED', 'CP_CHARGE_ENABLED', 'CP_CHARGE_FAULTED')) THEN value_text END) AS reading FROM latest WHERE latest_rank = 1 GROUP BY vehicle, source, decode_epoch ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"none","noValue":"기록 없음","color":{"mode":"thresholds"},"mappings":[{"type":"value","options":{"DetailedChargeStateDisconnected":{"text":"케이블 분리","color":"#5E6A7A","index":0},"DetailedChargeStateNoPower":{"text":"전원 없음","color":"#FF9830","index":1},"DetailedChargeStateStarting":{"text":"충전 시작","color":"#96D98D","index":2},"DetailedChargeStateCharging":{"text":"충전 중","color":"#56A64B","index":3},"DetailedChargeStateStopped":{"text":"충전 멈춤","color":"#F2CC0C","index":4},"DetailedChargeStateComplete":{"text":"충전 완료","color":"#5794F2","index":5},"CP_CHARGE_INACTIVE":{"text":"비활성 · CAN 미검증","color":"#FF9830","index":6},"CP_CHARGE_CONNECTED":{"text":"연결됨 · CAN 미검증","color":"#FF9830","index":7},"CP_CHARGE_STANDBY":{"text":"대기 · CAN 미검증","color":"#FF9830","index":8},"CP_EXT_EVSE_TEST_ACTIVE":{"text":"외부 EVSE 시험 중 · CAN 미검증","color":"#FF9830","index":9},"CP_EVSE_TEST_PASSED":{"text":"EVSE 시험 통과 · CAN 미검증","color":"#FF9830","index":10},"CP_CHARGE_ENABLED":{"text":"충전 허용 · CAN 미검증","color":"#FF9830","index":11},"CP_CHARGE_FAULTED":{"text":"충전 오류 보고 · CAN 미검증","color":"#FF9830","index":12}}},{"type":"special","options":{"match":"null","result":{"text":"판단 불가","color":"#6E7681","index":0}}}],"thresholds":{"mode":"absolute","steps":[{"value":null,"color":"#6E7681"}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"/^reading$/","values":true},"text":{"valueSize":26,"titleSize":12}},"gridPos":{"x":6,"y":12,"w":5,"h":4}},
      {"id":9,"type":"stat","title":"실내 / 외기 · 보고값","description":"가장 최근 실내(InsideTemp)·외기(OutsideTemp) 온도입니다. 배터리 온도와 비교해 보세요. CAN 대응: VCRIGHT_tempAmbientRaw의 미검증 보고값입니다. 관측 시각은 위 CAN 보고값 표를 확인하세요. 단위 불일치·최신 무효 값은 과거 정상 값으로 대체하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH signals AS (SELECT event_time, vehicle, source, decode_epoch, ingest_time, envelope_id, value_num, value_text, value_bool, path AS path, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x20C.VCRIGHT_tempAmbientRaw' AND source_field = 'VCRIGHT_tempAmbientRaw' THEN 'OutsideTemp' ELSE source_field END AS source_field, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x20C.VCRIGHT_tempAmbientRaw' AND source_field = 'VCRIGHT_tempAmbientRaw' AND unit = '°C' THEN 'celsius' ELSE unit END AS unit, quality, (quality = 'reported_unverified' AND ((source = 'can' AND path = 'Vehicle.CAN.x20C.VCRIGHT_tempAmbientRaw' AND source_field = 'VCRIGHT_tempAmbientRaw'))) AS can_report FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, source_field ORDER BY event_time DESC, ingest_time DESC, envelope_id DESC) AS latest_rank FROM signals WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field IN ('InsideTemp', 'OutsideTemp')) SELECT vehicle, source, decode_epoch, MAX(CASE WHEN source_field = 'InsideTemp' AND (quality IS NULL OR quality = 'ok' OR can_report) AND unit = 'celsius' THEN value_num END) AS cabin, MAX(CASE WHEN source_field = 'OutsideTemp' AND (quality IS NULL OR quality = 'ok' OR can_report) AND unit = 'celsius' THEN value_num END) AS outside FROM latest WHERE latest_rank = 1 GROUP BY vehicle, source, decode_epoch ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"celsius","noValue":"기록 없음","color":{"mode":"fixed","fixedColor":"#6E7681"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"기록 없음","color":"#6E7681","index":0}}}],"decimals":1},"overrides":[{"matcher":{"id":"byName","options":"cabin"},"properties":[{"id":"displayName","value":"실내"}]},{"matcher":{"id":"byName","options":"outside"},"properties":[{"id":"displayName","value":"외기"}]}]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value_and_name","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":true},"text":{"valueSize":22,"titleSize":12}},"gridPos":{"x":11,"y":12,"w":7,"h":4}},
      {"id":10,"type":"stat","title":"배터리 온도","description":"가장 최근 배터리 모듈 최고 온도입니다. 단위 메타데이터가 V/celsius로 확인된 유효 샘플만 표시하며, fleet/fleet-v1 자체는 교정 증거가 아닙니다. 단위 미확인은 판단 불가입니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, source_field ORDER BY event_time DESC, ingest_time DESC, envelope_id DESC) AS latest_rank FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field IN ('ModuleTempMax', 'ModuleTempMin')) SELECT vehicle, source, decode_epoch, MAX(CASE WHEN source_field = 'ModuleTempMax' AND unit = 'celsius' AND (quality IS NULL OR quality IN ('ok', 'valid', 'unit_unverified')) THEN value_num END) AS pack_max, MAX(CASE WHEN source_field = 'ModuleTempMin' AND unit = 'celsius' AND (quality IS NULL OR quality IN ('ok', 'valid', 'unit_unverified')) THEN value_num END) AS pack_min FROM latest WHERE latest_rank = 1 GROUP BY vehicle, source, decode_epoch ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"celsius","noValue":"판단 불가","color":{"mode":"fixed","fixedColor":"#FF9830"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"판단 불가","color":"#6E7681","index":0}}}],"decimals":1},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"/^pack_max$/","values":true},"text":{"valueSize":26,"titleSize":12}},"gridPos":{"x":18,"y":12,"w":6,"h":4}},
      {"id":11,"type":"timeseries","title":"잔량 변화","description":"차량 표시 잔량과 BMS 잔량을 구간 평균으로 표시합니다. 두 값은 서로 다른 항목입니다. CAN 대응: BMS_socUI, BMS_socAvg의 미검증 보고값입니다. 관측 시각은 위 CAN 보고값 표를 확인하세요. 단위 불일치·최신 무효 값은 과거 정상 값으로 대체하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"interval":"5m","targets":[{"refId":"A","format":"time_series","rawSql":"WITH signals AS (SELECT event_time, vehicle, source, decode_epoch, ingest_time, envelope_id, value_num, value_text, value_bool, path AS path, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socUI' AND source_field = 'BMS_socUI' THEN 'BatteryLevel' WHEN source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socAvg' AND source_field = 'BMS_socAvg' THEN 'Soc' ELSE source_field END AS source_field, unit AS unit, quality, (quality = 'reported_unverified' AND ((source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socUI' AND source_field = 'BMS_socUI') OR (source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socAvg' AND source_field = 'BMS_socAvg'))) AS can_report FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT CAST(date_bin(INTERVAL $$__interval_ms MILLISECOND, event_time) AS TIMESTAMP(6)) AS `time`, CONCAT(CASE source_field WHEN 'BatteryLevel' THEN '차량 표시 잔량' WHEN 'Soc' THEN 'BMS 잔량' END, CASE WHEN source = 'fleet' AND decode_epoch = 'fleet-v1' THEN '' ELSE CONCAT(' · ', source, '/', COALESCE(decode_epoch, '')) END) AS `metric`, CASE source_field WHEN 'BatteryLevel' THEN AVG(value_num) WHEN 'Soc' THEN AVG(value_num) END AS `value` FROM signals WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field IN ('BatteryLevel', 'Soc') AND value_num IS NOT NULL AND (quality IS NULL OR quality = 'ok' OR can_report) GROUP BY 1, source, decode_epoch, source_field ORDER BY 1","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"percent","noValue":"기록 없음","custom":{"drawStyle":"line","lineInterpolation":"smooth","lineWidth":2,"fillOpacity":10,"gradientMode":"opacity","showPoints":"never","spanNulls":false,"axisBorderShow":false,"axisPlacement":"auto","barAlignment":0,"barWidthFactor":0.8,"pointSize":4,"stacking":{"mode":"none","group":"A"},"thresholdsStyle":{"mode":"off"}},"color":{"mode":"palette-classic"},"decimals":0,"min":0,"max":100},"overrides":[{"matcher":{"id":"byName","options":"차량 표시 잔량"},"properties":[{"id":"color","value":{"mode":"fixed","fixedColor":"#56A64B"}}]},{"matcher":{"id":"byName","options":"BMS 잔량"},"properties":[{"id":"color","value":{"mode":"fixed","fixedColor":"#3274D9"}}]}]},"options":{"legend":{"displayMode":"list","placement":"bottom","showLegend":true,"calcs":[]},"tooltip":{"mode":"multi","sort":"desc"}},"gridPos":{"x":0,"y":16,"w":12,"h":8}},
      {"id":12,"type":"timeseries","title":"시간별 마지막 교정 전력 (+ 충전 / − 사용)","description":"각 완료된 시간 구간의 마지막 동시 교정 샘플(kW)입니다. 시간 평균·kWh·실시간 전력이 아닙니다. x축은 실제 관측 시각(UTC 저장, 대시보드 시간대 표시)입니다. 최신 invalid/unmatched/stale 결과는 NULL이며 구간별 최신 리비전이 이전 정상 값을 덮습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"interval":"1h","targets":[{"refId":"A","format":"time_series","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND `metric` = 'battery.energy.latest_power_kw') SELECT CAST(value_text AS TIMESTAMP(6)) AS `time`, CONCAT(vehicle, ' · ', source, '/', COALESCE(decode_epoch, '')) AS `metric`, CASE WHEN status = 'derived' AND unit = 'kW' THEN `value` ELSE NULL END AS `value` FROM revisions WHERE revision_rank = 1 AND value_text IS NOT NULL ORDER BY 1","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"kwatt","noValue":"기록 없음","custom":{"drawStyle":"points","lineInterpolation":"linear","lineWidth":2,"fillOpacity":0,"gradientMode":"scheme","showPoints":"always","spanNulls":false,"axisBorderShow":false,"axisPlacement":"auto","barAlignment":0,"barWidthFactor":0.8,"pointSize":4,"stacking":{"mode":"none","group":"A"},"thresholdsStyle":{"mode":"off"}},"color":{"mode":"thresholds"},"decimals":1,"thresholds":{"mode":"absolute","steps":[{"value":null,"color":"#3274D9"},{"value":0,"color":"#56A64B"}]}},"overrides":[]},"options":{"legend":{"displayMode":"list","placement":"bottom","showLegend":true,"calcs":[]},"tooltip":{"mode":"multi","sort":"desc"}},"gridPos":{"x":12,"y":16,"w":12,"h":8}},
      {"id":13,"type":"state-timeline","title":"충전 상태 기록","description":"충전 케이블·충전 진행 상태 변화입니다. CAN 대응: CP_hvChargeStatus의 미검증 보고값입니다. 관측 시각은 위 CAN 보고값 표를 확인하세요. 단위 불일치·최신 무효 값은 과거 정상 값으로 대체하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH signals AS (SELECT event_time, vehicle, source, decode_epoch, ingest_time, envelope_id, value_num, value_text, value_bool, path AS path, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x13D.CP_hvChargeStatus' AND source_field = 'CP_hvChargeStatus' THEN 'DetailedChargeState' ELSE source_field END AS source_field, unit AS unit, quality, (quality = 'reported_unverified' AND ((source = 'can' AND path = 'Vehicle.CAN.x13D.CP_hvChargeStatus' AND source_field = 'CP_hvChargeStatus'))) AS can_report FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT CAST(event_time AS TIMESTAMP(6)) AS `time`, CONCAT(vehicle, ' · ', source, '/', COALESCE(decode_epoch, '')) AS series, CASE WHEN (quality IS NULL OR quality = 'ok' OR can_report) AND (source <> 'can' OR value_text IN ('CP_CHARGE_INACTIVE', 'CP_CHARGE_CONNECTED', 'CP_CHARGE_STANDBY', 'CP_EXT_EVSE_TEST_ACTIVE', 'CP_EVSE_TEST_PASSED', 'CP_CHARGE_ENABLED', 'CP_CHARGE_FAULTED')) THEN value_text ELSE NULL END AS `충전` FROM signals WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field = 'DetailedChargeState' ORDER BY event_time, ingest_time, envelope_id","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음","mappings":[{"type":"value","options":{"DetailedChargeStateDisconnected":{"text":"분리","color":"#5E6A7A","index":0},"DetailedChargeStateNoPower":{"text":"전원 없음","color":"#FF9830","index":1},"DetailedChargeStateStarting":{"text":"시작","color":"#96D98D","index":2},"DetailedChargeStateCharging":{"text":"충전","color":"#56A64B","index":3},"DetailedChargeStateStopped":{"text":"멈춤","color":"#F2CC0C","index":4},"DetailedChargeStateComplete":{"text":"완료","color":"#5794F2","index":5},"CP_CHARGE_INACTIVE":{"text":"비활성 · CAN 미검증","color":"#FF9830","index":6},"CP_CHARGE_CONNECTED":{"text":"연결됨 · CAN 미검증","color":"#FF9830","index":7},"CP_CHARGE_STANDBY":{"text":"대기 · CAN 미검증","color":"#FF9830","index":8},"CP_EXT_EVSE_TEST_ACTIVE":{"text":"외부 EVSE 시험 중 · CAN 미검증","color":"#FF9830","index":9},"CP_EVSE_TEST_PASSED":{"text":"EVSE 시험 통과 · CAN 미검증","color":"#FF9830","index":10},"CP_CHARGE_ENABLED":{"text":"충전 허용 · CAN 미검증","color":"#FF9830","index":11},"CP_CHARGE_FAULTED":{"text":"충전 오류 보고 · CAN 미검증","color":"#FF9830","index":12}}}],"color":{"mode":"thresholds"},"thresholds":{"mode":"absolute","steps":[{"value":null,"color":"#6E7681"}]},"custom":{"fillOpacity":80,"lineWidth":0,"spanNulls":false}},"overrides":[]},"options":{"mergeValues":true,"showValue":"auto","alignValue":"center","rowHeight":0.8,"legend":{"showLegend":false},"tooltip":{"mode":"single"}},"gridPos":{"x":0,"y":24,"w":24,"h":3},"transformations":[{"id":"partitionByValues","options":{"fields":["series"]}}]},
      {"id":14,"type":"state-timeline","title":"기어 기록","description":"주차·주행·후진 상태 변화입니다. CAN 대응: DI_gear의 미검증 보고값입니다. 관측 시각은 위 CAN 보고값 표를 확인하세요. 단위 불일치·최신 무효 값은 과거 정상 값으로 대체하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH signals AS (SELECT event_time, vehicle, source, decode_epoch, ingest_time, envelope_id, value_num, value_text, value_bool, path AS path, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x118.DI_gear' AND source_field = 'DI_gear' THEN 'Gear' ELSE source_field END AS source_field, unit AS unit, quality, (quality = 'reported_unverified' AND ((source = 'can' AND path = 'Vehicle.CAN.x118.DI_gear' AND source_field = 'DI_gear'))) AS can_report FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT CAST(event_time AS TIMESTAMP(6)) AS `time`, CONCAT(vehicle, ' · ', source, '/', COALESCE(decode_epoch, '')) AS series, CASE WHEN (quality IS NULL OR quality = 'ok' OR can_report) AND (source <> 'can' OR value_text IN ('DI_GEAR_P', 'DI_GEAR_D', 'DI_GEAR_R', 'DI_GEAR_N')) THEN value_text ELSE NULL END AS `기어` FROM signals WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field = 'Gear' ORDER BY event_time, ingest_time, envelope_id","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음","mappings":[{"type":"value","options":{"P":{"text":"주차","color":"#5E6A7A","index":0},"D":{"text":"주행","color":"#3274D9","index":1},"R":{"text":"후진","color":"#A352CC","index":2},"N":{"text":"중립","color":"#E0B400","index":3},"DI_GEAR_P":{"text":"주차 · CAN 미검증","color":"#FF9830","index":4},"DI_GEAR_D":{"text":"주행 · CAN 미검증","color":"#FF9830","index":5},"DI_GEAR_R":{"text":"후진 · CAN 미검증","color":"#FF9830","index":6},"DI_GEAR_N":{"text":"중립 · CAN 미검증","color":"#FF9830","index":7}}}],"color":{"mode":"thresholds"},"thresholds":{"mode":"absolute","steps":[{"value":null,"color":"#6E7681"}]},"custom":{"fillOpacity":80,"lineWidth":0,"spanNulls":false}},"overrides":[]},"options":{"mergeValues":true,"showValue":"auto","alignValue":"center","rowHeight":0.8,"legend":{"showLegend":false},"tooltip":{"mode":"single"}},"gridPos":{"x":0,"y":27,"w":24,"h":3},"transformations":[{"id":"partitionByValues","options":{"fields":["series"]}}]},
      {"id":20,"type":"row","title":"신호 직접 찾아보기","collapsed":true,"gridPos":{"x":0,"y":30,"w":24,"h":1},"panels":[{"id":4,"type":"timeseries","title":"신호: $$signal","description":"위의 '신호' 목록에서 고른 경로의 최근 5000개 샘플입니다. 수집 경로·해석 버전은 섞지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT `time`, CONCAT(source, ' · ', COALESCE(decode_epoch, '')) AS series, value FROM (SELECT CAST(event_time AS TIMESTAMP(6)) AS `time`, source, decode_epoch, value_num AS value FROM vehicle_signal WHERE path = $${signal:sqlstring} AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND value_num IS NOT NULL AND $$__timeFilter(event_time) ORDER BY event_time DESC LIMIT 5000) AS recent ORDER BY `time` ASC","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"none","noValue":"기록 없음","custom":{"drawStyle":"line","lineInterpolation":"smooth","lineWidth":2,"fillOpacity":10,"gradientMode":"opacity","showPoints":"never","spanNulls":false,"axisBorderShow":false,"axisPlacement":"auto","barAlignment":0,"barWidthFactor":0.8,"pointSize":4,"stacking":{"mode":"none","group":"A"},"thresholdsStyle":{"mode":"off"}},"color":{"mode":"palette-classic"}},"overrides":[]},"options":{"legend":{"displayMode":"list","placement":"bottom","showLegend":true,"calcs":[]},"tooltip":{"mode":"multi","sort":"desc"}},"gridPos":{"x":0,"y":31,"w":24,"h":9}},{"id":5,"type":"table","title":"최근 수신 기록 (100건)","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT CAST(event_time AS TIMESTAMP(6)) AS event_time, vehicle, path, source, value_num, value_text, value_bool, unit FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) ORDER BY event_time DESC LIMIT 100","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"x":0,"y":40,"w":24,"h":9},"description":"선택 기간의 가장 최근 원시 신호 100건입니다."}]}
      ]}
  grafana-dash-can-vss:
    content: |
      {"uid":"datalake-vehicle-can-vss","title":"수집 진단 · CAN / VSS","tags":["datalake","vehicle","diagnostics"],"timezone":"Asia/Seoul","schemaVersion":39,"version":2,"time":{"from":"now-7d","to":"now"},"links":[{"title":"배터리","type":"link","url":"/d/datalake-vehicle-battery","includeVars":true,"keepTime":true,"targetBlank":false},{"title":"차량 개요","type":"link","url":"/d/datalake-vehicle-overview","includeVars":true,"keepTime":true,"targetBlank":false},{"title":"충전","type":"link","url":"/d/datalake-vehicle-charging","includeVars":true,"keepTime":true,"targetBlank":false},{"title":"주행","type":"link","url":"/d/datalake-vehicle-drives","includeVars":true,"keepTime":true,"targetBlank":false},{"title":"수집 진단 · DBC","type":"link","url":"/d/datalake-vehicle-dbc-health","includeVars":true,"keepTime":true,"targetBlank":false}],"description":"엔지니어링 진단용입니다. 수집 경로·해석 버전별 데이터 양과 롤업을 확인합니다. 일상적인 차량 확인은 '차량 개요'·'배터리'를 사용하세요.","panels":[
      {"id":1,"type":"table","title":"Decode epochs","description":"Vehicle/source/epoch lineage. Supplemental commit is present only when that DBC is used; replacement overrides report their version and optional commit. Original artifact hashes remain in the immutable generation manifest.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT vehicle, decode_epoch, vehicle_firmware, vss_version, dbc_primary_commit, dbc_supplemental_commit, dbc_override_version, dbc_override_commit, mapping_revision, source, COUNT(*) AS rows, CAST(MIN(event_time) AS TIMESTAMP(6)) AS first_seen, CAST(MAX(event_time) AS TIMESTAMP(6)) AS last_seen FROM vehicle_signal WHERE $$__timeFilter(event_time) GROUP BY vehicle, decode_epoch, vehicle_firmware, vss_version, dbc_primary_commit, dbc_supplemental_commit, dbc_override_version, dbc_override_commit, mapping_revision, source ORDER BY decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":24,"x":0,"y":0}},
      {"id":2,"type":"table","title":"Samples per day per source (can vs fleet)","description":"Source 'fleet' rows, if any, come from a different producer; an empty table or a missing fleet row means nothing stored (absence), not zero.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT CAST(event_time AS DATE) AS `day`, source, COUNT(*) AS rows, COUNT(DISTINCT path) AS paths FROM vehicle_signal WHERE $$__timeFilter(event_time) GROUP BY `day`, source ORDER BY `day` ASC","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":12,"x":0,"y":8}},
      {"id":3,"type":"stat","title":"Distinct paths (can)","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT NULLIF(COUNT(DISTINCT path), 0) AS paths_can FROM vehicle_signal WHERE $$__timeFilter(event_time) AND source = 'can'","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"No CAN data"},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto","colorMode":"none"},"gridPos":{"h":8,"w":6,"x":12,"y":8}},
      {"id":4,"type":"stat","title":"Distinct paths (fleet)","description":"Missing Fleet rows mean no stored Fleet input in this range, not a measured zero.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT NULLIF(COUNT(DISTINCT path), 0) AS paths_fleet FROM vehicle_signal WHERE $$__timeFilter(event_time) AND source = 'fleet'","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"No Fleet data"},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto","colorMode":"none"},"gridPos":{"h":8,"w":6,"x":18,"y":8}},
      {"id":5,"type":"timeseries","title":"Hourly rollup (vehicle_agg, 1h)","description":"vehicle_agg hourly rollups written by aggregate.py, separated by decode_epoch so re-decodes never merge; empty means no aggregates yet (absence). Raw signal panels above remain the fallback.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT window_start AS `time`, vehicle, source, path, decode_epoch, avg_value AS value FROM vehicle_agg WHERE resolution = '1h' AND $$__timeFilter(window_start) ORDER BY `time` ASC LIMIT 5000","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","showLegend":true},"tooltip":{"mode":"multi","sort":"none"}},"gridPos":{"h":8,"w":24,"x":0,"y":16}}
      ]}
  grafana-dash-drives:
    content: |
      {"uid":"datalake-vehicle-drives","title":"주행","tags":["datalake","vehicle"],"timezone":"Asia/Seoul","schemaVersion":39,"version":5,"time":{"from":"now-2d","to":"now"},"templating":{"list":[{"name":"vehicle","type":"query","label":"차량","query":"SELECT DISTINCT vehicle FROM vehicle_signal UNION SELECT DISTINCT vehicle FROM vehicle_analysis ORDER BY vehicle","current":{},"description":"확인할 차량을 선택하세요. 서로 다른 차량의 값은 합산하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"refresh":1,"sort":1,"options":[],"includeAll":false,"multi":false},{"name":"source","type":"query","label":"수집 경로","query":"SELECT '' AS __value, '전체' AS __text UNION SELECT DISTINCT source AS __value, source AS __text FROM vehicle_signal WHERE ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) ORDER BY __value","current":{"text":"전체","value":""},"description":"Exact match; can and fleet are never merged.","hide":0,"datasource":{"type":"mysql","uid":"greptime-mysql"},"options":[],"refresh":1,"includeAll":false,"multi":false},{"name":"epoch","type":"query","label":"해석 버전","query":"SELECT '' AS __value, '전체' AS __text UNION SELECT DISTINCT COALESCE(decode_epoch, '') AS __value, COALESCE(decode_epoch, '') AS __text FROM vehicle_signal WHERE ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) ORDER BY __value","current":{"text":"전체","value":""},"description":"Exact match; blank includes all epochs as separate scopes.","hide":0,"datasource":{"type":"mysql","uid":"greptime-mysql"},"options":[],"refresh":1,"includeAll":false,"multi":false}]},"links":[{"title":"배터리","type":"link","url":"/d/datalake-vehicle-battery","includeVars":true,"keepTime":true,"targetBlank":false},{"title":"차량 개요","type":"link","url":"/d/datalake-vehicle-overview","includeVars":true,"keepTime":true,"targetBlank":false},{"title":"충전","type":"link","url":"/d/datalake-vehicle-charging","includeVars":true,"keepTime":true,"targetBlank":false},{"title":"수집 진단 · CAN/VSS","type":"link","url":"/d/datalake-vehicle-can-vss","includeVars":true,"keepTime":true,"targetBlank":false},{"title":"수집 진단 · DBC","type":"link","url":"/d/datalake-vehicle-dbc-health","includeVars":true,"keepTime":true,"targetBlank":false}],"description":"주행 상태와 사용 에너지, 속도, 주행 기록입니다. 거리는 속도 적분이며 속도 신호가 없으면 주행 기록도 만들어지지 않습니다.","panels":[
      {"id":90,"type":"text","title":"CAN 보고값 해석","options":{"mode":"markdown","content":"**CAN은 미검증 보고값입니다.** 선택 기간의 관측 기록이며 현재 차량 상태나 건강 판정이 아닙니다. 아래 관측 시각과 DB 수신 시각을 구분하세요. CAN 기어·충전 상태는 DBC enum을 표시하며 충전 허용을 실제 충전 중으로 단정하지 않습니다. 대응 신호가 없는 온도·셀 번호와 검증되지 않은 전력·에너지 계산은 판단 불가로 남습니다."},"gridPos":{"x":0,"y":0,"w":24,"h":3}},
      {"id":91,"type":"table","title":"CAN 보고값 · 관측 시각과 DB 수신 시각","description":"선택 기간의 신호별 최신 원본 보고값입니다. invalid/unknown_enum과 원본 단위를 그대로 보여주며 건강 판정으로 사용하지 않습니다. 최신 무효 보고도 숨기지 않습니다. 차량 식별자는 자동으로 합치지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, source_field ORDER BY event_time DESC, ingest_time DESC, envelope_id DESC) AS latest_rank FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND ((source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socUI' AND source_field = 'BMS_socUI') OR (source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socAvg' AND source_field = 'BMS_socAvg') OR (source = 'can' AND path = 'Vehicle.CAN.x352.BMS_nominalEnergyRemaining' AND source_field = 'BMS_nominalEnergyRemaining') OR (source = 'can' AND path = 'Vehicle.CAN.x118.DI_gear' AND source_field = 'DI_gear') OR (source = 'can' AND path = 'Vehicle.CAN.x13D.CP_hvChargeStatus' AND source_field = 'CP_hvChargeStatus') OR (source = 'can' AND path = 'Vehicle.CAN.x20C.VCRIGHT_tempAmbientRaw' AND source_field = 'VCRIGHT_tempAmbientRaw') OR (source = 'can' AND path = 'Vehicle.CAN.x332.BMS_brickVoltageMax' AND source_field = 'BMS_brickVoltageMax') OR (source = 'can' AND path = 'Vehicle.CAN.x332.BMS_brickVoltageMin' AND source_field = 'BMS_brickVoltageMin') OR (source = 'can' AND path = 'Vehicle.CAN.x257.DI_vehicleSpeed' AND source_field = 'DI_vehicleSpeed') OR (source = 'can' AND path = 'Vehicle.CAN.x132.BMS_packVoltage' AND source_field = 'BMS_packVoltage') OR (source = 'can' AND path = 'Vehicle.CAN.x132.BMS_packCurrent' AND source_field = 'BMS_packCurrent'))) SELECT vehicle AS `차량`, source AS `수집원`, decode_epoch AS `해석 버전`, source_field AS `원본 신호`, value_num AS `숫자 보고값`, value_text AS `상태 보고값`, unit AS `원본 단위`, quality AS `품질`, CAST(event_time AS TIMESTAMP(6)) AS `관측 시각`, CAST(ingest_time AS TIMESTAMP(6)) AS `DB 수신 시각` FROM latest WHERE latest_rank = 1 ORDER BY vehicle, source, decode_epoch, source_field","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음"},"overrides":[{"matcher":{"id":"byName","options":"관측 시각"},"properties":[{"id":"unit","value":"dateTimeAsIso"}]},{"matcher":{"id":"byName","options":"DB 수신 시각"},"properties":[{"id":"unit","value":"dateTimeAsIso"}]}]},"options":{"showHeader":true},"gridPos":{"x":0,"y":3,"w":24,"h":5}},
      {"id":5,"type":"stat","title":"오늘 사용 에너지","description":"오늘(KST 0시부터) 시간별 방전 누적계 증가량과 주차 중 소모량의 합입니다. 분석이 끝난 시간 구간만 더하므로 진행 중인 현재 시간은 다음 집계 후 반영됩니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE `metric` IN ('battery.energy.discharge_energy_kwh', 'battery.energy.parked_discharge_kwh') AND window_start >= date_trunc('day', now() AT TIME ZONE 'Asia/Seoul') AT TIME ZONE 'Asia/Seoul' AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT vehicle, source, decode_epoch, COUNT(*) AS windows, SUM(`value`) AS reading FROM revisions WHERE revision_rank = 1 AND status = 'derived' AND unit = 'kWh' AND `value` IS NOT NULL GROUP BY vehicle, source, decode_epoch ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"kwatth","noValue":"기록 없음","color":{"mode":"fixed","fixedColor":"#FF9830"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"기록 없음","color":"#6E7681","index":0}}}]},"overrides":[{"matcher":{"id":"byName","options":"windows"},"properties":[{"id":"custom.hidden","value":true}]}]},"options":{"colorMode":"value","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"/^reading$/","values":true},"text":{"valueSize":22,"titleSize":12}},"gridPos":{"x":0,"y":8,"w":6,"h":4}},
      {"id":6,"type":"stat","title":"이번 주 사용 에너지","description":"이번 주(KST 월요일 0시부터) 방전 누적계 증가량과 주차 중 소모량의 합입니다. 분석 보존 기간 밖의 구간은 포함하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE `metric` IN ('battery.energy.discharge_energy_kwh', 'battery.energy.parked_discharge_kwh') AND window_start >= date_trunc('week', now() AT TIME ZONE 'Asia/Seoul') AT TIME ZONE 'Asia/Seoul' AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT vehicle, source, decode_epoch, COUNT(*) AS windows, SUM(`value`) AS reading FROM revisions WHERE revision_rank = 1 AND status = 'derived' AND unit = 'kWh' AND `value` IS NOT NULL GROUP BY vehicle, source, decode_epoch ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"kwatth","noValue":"기록 없음","color":{"mode":"fixed","fixedColor":"#FF9830"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"기록 없음","color":"#6E7681","index":0}}}]},"overrides":[{"matcher":{"id":"byName","options":"windows"},"properties":[{"id":"custom.hidden","value":true}]}]},"options":{"colorMode":"value","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"/^reading$/","values":true},"text":{"valueSize":22,"titleSize":12}},"gridPos":{"x":6,"y":8,"w":6,"h":4}},
      {"id":7,"type":"stat","title":"최근 완료 구간 배터리 전력","description":"시간별 분석이 완료된 가장 최근 구간의 마지막 동시 팩 전압·전류 관측입니다. 실시간 전력이 아닙니다. 정확한 차량·수집원·해석 버전의 단위 교정(scale/offset)과 current_sign을 적용하며 + 충전 / − 사용입니다. 최신 무효·단위 미확인·시각 불일치·구간 끝에서 max_gap_ns 초과는 판단 불가이고, 더 최근의 미분석 원시 입력도 과거 값으로 대체하지 않습니다. 관측 시각은 분석 기록의 value_text에 UTC로 남습니다. 선택 기간 끝의 바로 전 완료 시간 구간이 없으면 과거 구간 숫자를 표시하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND `metric` = 'battery.energy.latest_power_kw'), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric` ORDER BY window_start DESC, computed_at DESC, revision DESC) AS latest_rank FROM revisions WHERE revision_rank = 1), raw_frontier AS (SELECT vehicle, source, decode_epoch, MAX(event_time) AS raw_event_time, MAX(ingest_time) AS raw_ingest_time FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field IN ('PackVoltage', 'PackCurrent') GROUP BY vehicle, source, decode_epoch) SELECT latest.vehicle, latest.source, latest.decode_epoch, CAST(latest.value_text AS TIMESTAMP(6)) AS observed_at, CASE WHEN latest.window_end >= FROM_UNIXTIME(CAST(FLOOR($$__unixEpochTo() / 3600) * 3600 - 1 AS BIGINT)) AND latest.status = 'derived' AND latest.unit = 'kW' AND latest.value_text IS NOT NULL AND (raw.raw_event_time IS NULL OR raw.raw_event_time <= CAST(latest.value_text AS TIMESTAMP(6))) AND (raw.raw_ingest_time IS NULL OR raw.raw_ingest_time <= latest.computed_at) THEN latest.`value` ELSE NULL END AS reading FROM latest LEFT JOIN raw_frontier raw ON raw.vehicle = latest.vehicle AND raw.source = latest.source AND COALESCE(raw.decode_epoch, '') = COALESCE(latest.decode_epoch, '') WHERE latest.latest_rank = 1 ORDER BY latest.vehicle, latest.source, latest.decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"kwatt","noValue":"기록 없음","color":{"mode":"thresholds"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"판단 불가","color":"#6E7681","index":0}}}],"decimals":1,"thresholds":{"mode":"absolute","steps":[{"value":null,"color":"#3274D9"},{"value":-0.5,"color":"#6E7681"},{"value":0.5,"color":"#56A64B"}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"/^reading$/","values":true},"text":{"valueSize":34,"titleSize":12}},"gridPos":{"x":12,"y":8,"w":6,"h":4}},
      {"id":8,"type":"stat","title":"기어 · 보고값","description":"가장 최근 기어 상태입니다. 무효로 들어온 최신 값은 과거 값으로 대체하지 않습니다. CAN 대응: DI_gear의 미검증 보고값입니다. 관측 시각은 위 CAN 보고값 표를 확인하세요. 단위 불일치·최신 무효 값은 과거 정상 값으로 대체하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH signals AS (SELECT event_time, vehicle, source, decode_epoch, ingest_time, envelope_id, value_num, value_text, value_bool, path AS path, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x118.DI_gear' AND source_field = 'DI_gear' THEN 'Gear' ELSE source_field END AS source_field, unit AS unit, quality, (quality = 'reported_unverified' AND ((source = 'can' AND path = 'Vehicle.CAN.x118.DI_gear' AND source_field = 'DI_gear'))) AS can_report FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, source_field ORDER BY event_time DESC, ingest_time DESC, envelope_id DESC) AS latest_rank FROM signals WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field IN ('Gear')) SELECT vehicle, source, decode_epoch, MAX(CASE WHEN source_field = 'Gear' AND (quality IS NULL OR quality = 'ok' OR can_report) AND (source <> 'can' OR value_text IN ('DI_GEAR_P', 'DI_GEAR_D', 'DI_GEAR_R', 'DI_GEAR_N')) THEN value_text END) AS reading FROM latest WHERE latest_rank = 1 GROUP BY vehicle, source, decode_epoch ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"none","noValue":"기록 없음","color":{"mode":"thresholds"},"mappings":[{"type":"value","options":{"P":{"text":"주차","color":"#5E6A7A","index":0},"D":{"text":"주행","color":"#3274D9","index":1},"R":{"text":"후진","color":"#A352CC","index":2},"N":{"text":"중립","color":"#E0B400","index":3},"DI_GEAR_P":{"text":"주차 · CAN 미검증","color":"#FF9830","index":4},"DI_GEAR_D":{"text":"주행 · CAN 미검증","color":"#FF9830","index":5},"DI_GEAR_R":{"text":"후진 · CAN 미검증","color":"#FF9830","index":6},"DI_GEAR_N":{"text":"중립 · CAN 미검증","color":"#FF9830","index":7}}},{"type":"special","options":{"match":"null","result":{"text":"판단 불가","color":"#6E7681","index":0}}}],"thresholds":{"mode":"absolute","steps":[{"value":null,"color":"#6E7681"}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"/^reading$/","values":true},"text":{"valueSize":26,"titleSize":12}},"gridPos":{"x":18,"y":8,"w":6,"h":4}},
      {"id":9,"type":"state-timeline","title":"기어 기록","description":"주차·주행·후진 상태 변화입니다. CAN 대응: DI_gear의 미검증 보고값입니다. 관측 시각은 위 CAN 보고값 표를 확인하세요. 단위 불일치·최신 무효 값은 과거 정상 값으로 대체하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH signals AS (SELECT event_time, vehicle, source, decode_epoch, ingest_time, envelope_id, value_num, value_text, value_bool, path AS path, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x118.DI_gear' AND source_field = 'DI_gear' THEN 'Gear' ELSE source_field END AS source_field, unit AS unit, quality, (quality = 'reported_unverified' AND ((source = 'can' AND path = 'Vehicle.CAN.x118.DI_gear' AND source_field = 'DI_gear'))) AS can_report FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT CAST(event_time AS TIMESTAMP(6)) AS `time`, CONCAT(vehicle, ' · ', source, '/', COALESCE(decode_epoch, '')) AS series, CASE WHEN (quality IS NULL OR quality = 'ok' OR can_report) AND (source <> 'can' OR value_text IN ('DI_GEAR_P', 'DI_GEAR_D', 'DI_GEAR_R', 'DI_GEAR_N')) THEN value_text ELSE NULL END AS `기어` FROM signals WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field = 'Gear' ORDER BY event_time, ingest_time, envelope_id","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음","mappings":[{"type":"value","options":{"P":{"text":"주차","color":"#5E6A7A","index":0},"D":{"text":"주행","color":"#3274D9","index":1},"R":{"text":"후진","color":"#A352CC","index":2},"N":{"text":"중립","color":"#E0B400","index":3},"DI_GEAR_P":{"text":"주차 · CAN 미검증","color":"#FF9830","index":4},"DI_GEAR_D":{"text":"주행 · CAN 미검증","color":"#FF9830","index":5},"DI_GEAR_R":{"text":"후진 · CAN 미검증","color":"#FF9830","index":6},"DI_GEAR_N":{"text":"중립 · CAN 미검증","color":"#FF9830","index":7}}}],"color":{"mode":"thresholds"},"thresholds":{"mode":"absolute","steps":[{"value":null,"color":"#6E7681"}]},"custom":{"fillOpacity":80,"lineWidth":0,"spanNulls":false}},"overrides":[]},"options":{"mergeValues":true,"showValue":"auto","alignValue":"center","rowHeight":0.8,"legend":{"showLegend":false},"tooltip":{"mode":"single"}},"gridPos":{"x":0,"y":12,"w":24,"h":3},"transformations":[{"id":"partitionByValues","options":{"fields":["series"]}}]},
      {"id":1,"type":"timeseries","title":"속도","description":"Vehicle.Speed (km/h) 구간 평균입니다. 차량이 속도 신호를 보내지 않으면 비어 있습니다(Fleet Telemetry 수집 항목 설정 필요). CAN 대응: DI_vehicleSpeed의 미검증 보고값입니다. 관측 시각은 위 CAN 보고값 표를 확인하세요. 단위 불일치·최신 무효 값은 과거 정상 값으로 대체하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"interval":"1m","targets":[{"refId":"A","format":"time_series","rawSql":"WITH signals AS (SELECT event_time, vehicle, source, decode_epoch, ingest_time, envelope_id, value_num, value_text, value_bool, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x257.DI_vehicleSpeed' AND source_field = 'DI_vehicleSpeed' THEN 'Vehicle.Speed' ELSE path END AS path, source_field AS source_field, unit AS unit, quality, (quality = 'reported_unverified' AND ((source = 'can' AND path = 'Vehicle.CAN.x257.DI_vehicleSpeed' AND source_field = 'DI_vehicleSpeed'))) AS can_report FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT CAST(date_bin(INTERVAL $$__interval_ms MILLISECOND, event_time) AS TIMESTAMP(6)) AS `time`, CONCAT('속도', CASE WHEN source = 'fleet' AND decode_epoch = 'fleet-v1' THEN '' ELSE CONCAT(' · ', source, '/', COALESCE(decode_epoch, '')) END) AS `metric`, AVG(value_num) AS `value` FROM signals WHERE path = 'Vehicle.Speed' AND unit = 'km/h' AND value_num IS NOT NULL AND (quality IS NULL OR quality = 'ok' OR can_report) AND $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) GROUP BY 1, source, decode_epoch ORDER BY 1","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"velocitykmh","noValue":"속도 신호 수집 없음","custom":{"drawStyle":"line","lineInterpolation":"smooth","lineWidth":2,"fillOpacity":15,"gradientMode":"opacity","showPoints":"never","spanNulls":false,"axisBorderShow":false,"axisPlacement":"auto","barAlignment":0,"barWidthFactor":0.8,"pointSize":4,"stacking":{"mode":"none","group":"A"},"thresholdsStyle":{"mode":"off"}},"color":{"mode":"palette-classic"},"decimals":0},"overrides":[]},"options":{"legend":{"displayMode":"list","placement":"bottom","showLegend":true,"calcs":[]},"tooltip":{"mode":"multi","sort":"desc"}},"gridPos":{"x":0,"y":15,"w":24,"h":6}},
      {"id":10,"type":"timeseries","title":"시간별 사용 에너지","description":"분석이 끝난 시간 구간별 사용량과 주차 중 소모량입니다(− 방향).","datasource":{"type":"mysql","uid":"greptime-mysql"},"interval":"1h","targets":[{"refId":"A","format":"time_series","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND `metric` IN ('battery.energy.discharge_energy_kwh', 'battery.energy.parked_discharge_kwh')) SELECT CAST(window_start AS TIMESTAMP(6)) AS `time`, CASE `metric` WHEN 'battery.energy.discharge_energy_kwh' THEN '사용' WHEN 'battery.energy.parked_discharge_kwh' THEN '주차 중 소모' END AS `metric`, SUM(`value` * CASE `metric` WHEN 'battery.energy.discharge_energy_kwh' THEN -1 WHEN 'battery.energy.parked_discharge_kwh' THEN -1 END) AS `value` FROM revisions WHERE revision_rank = 1 AND status = 'derived' AND unit = 'kWh' AND `value` IS NOT NULL GROUP BY 1, 2 ORDER BY 1","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"kwatth","noValue":"기록 없음","custom":{"drawStyle":"bars","lineInterpolation":"linear","lineWidth":2,"fillOpacity":80,"gradientMode":"opacity","showPoints":"never","spanNulls":false,"axisBorderShow":false,"axisPlacement":"auto","barAlignment":0,"barWidthFactor":0.8,"pointSize":4,"stacking":{"mode":"normal","group":"A"},"thresholdsStyle":{"mode":"off"}},"color":{"mode":"palette-classic"}},"overrides":[{"matcher":{"id":"byName","options":"사용"},"properties":[{"id":"color","value":{"mode":"fixed","fixedColor":"#FF9830"}}]},{"matcher":{"id":"byName","options":"주차 중 소모"},"properties":[{"id":"color","value":{"mode":"fixed","fixedColor":"#A352CC"}}]}]},"options":{"legend":{"displayMode":"list","placement":"bottom","showLegend":true,"calcs":[]},"tooltip":{"mode":"multi","sort":"desc"}},"gridPos":{"x":0,"y":23,"w":24,"h":7}},
      {"id":4,"type":"table","title":"주행 기록","description":"Observed trips remain separate by vehicle/source/decode_epoch. ended_at=NULL marks an ongoing trip; its start anchor survives rolling lookback. Distance is a speed integral. energy_kwh requires a bounded, unbroken drive-counter baseline; missing units or resets yield NULL. Wh/km = energy_kwh*1000/NULLIF(distance_km,0).","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT trip_id, vehicle, source, decode_epoch, CAST(started_at AS TIMESTAMP(6)) AS started_at, CAST(ended_at AS TIMESTAMP(6)) AS ended_at, duration_s, distance_km, energy_kwh, energy_kwh * 1000 / NULLIF(distance_km, 0) AS wh_per_km, avg_speed_kph, start_soc, end_soc FROM trip_summary WHERE $$__timeFilter(started_at) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) ORDER BY started_at DESC LIMIT 100","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"주행 기록 없음","custom":{"align":"auto","cellOptions":{"type":"auto"},"inspect":false}},"overrides":[{"matcher":{"id":"byName","options":"started_at"},"properties":[{"id":"displayName","value":"시작"},{"id":"unit","value":"dateTimeAsLocal"}]},{"matcher":{"id":"byName","options":"ended_at"},"properties":[{"id":"displayName","value":"종료 (비어 있으면 진행 중)"},{"id":"unit","value":"dateTimeAsLocal"}]},{"matcher":{"id":"byName","options":"duration_s"},"properties":[{"id":"displayName","value":"시간"},{"id":"unit","value":"s"}]},{"matcher":{"id":"byName","options":"distance_km"},"properties":[{"id":"displayName","value":"거리"},{"id":"unit","value":"lengthkm"}]},{"matcher":{"id":"byName","options":"energy_kwh"},"properties":[{"id":"displayName","value":"사용 에너지"},{"id":"unit","value":"kwatth"}]},{"matcher":{"id":"byName","options":"wh_per_km"},"properties":[{"id":"displayName","value":"전비"},{"id":"unit","value":"suffix: Wh/km"}]},{"matcher":{"id":"byName","options":"avg_speed_kph"},"properties":[{"id":"displayName","value":"평균 속도"},{"id":"unit","value":"velocitykmh"}]},{"matcher":{"id":"byName","options":"start_soc"},"properties":[{"id":"displayName","value":"시작 잔량"},{"id":"unit","value":"percent"}]},{"matcher":{"id":"byName","options":"end_soc"},"properties":[{"id":"displayName","value":"종료 잔량"},{"id":"unit","value":"percent"}]},{"matcher":{"id":"byName","options":"source"},"properties":[{"id":"displayName","value":"수집 경로"}]},{"matcher":{"id":"byName","options":"decode_epoch"},"properties":[{"id":"displayName","value":"해석 버전"}]},{"matcher":{"id":"byName","options":"trip_id"},"properties":[{"id":"custom.hidden","value":true}]},{"matcher":{"id":"byName","options":"vehicle"},"properties":[{"id":"custom.hidden","value":true}]}]},"options":{"showHeader":true,"cellHeight":"sm","footer":{"show":false,"reducer":["sum"],"countRows":false,"fields":""}},"gridPos":{"x":0,"y":30,"w":24,"h":6}}
      ]}
  grafana-dash-charging:
    content: |
      {"uid":"datalake-vehicle-charging","title":"충전","tags":["datalake","vehicle"],"timezone":"Asia/Seoul","schemaVersion":39,"version":5,"time":{"from":"now-2d","to":"now"},"templating":{"list":[{"name":"vehicle","type":"query","label":"차량","query":"SELECT DISTINCT vehicle FROM vehicle_signal UNION SELECT DISTINCT vehicle FROM vehicle_analysis ORDER BY vehicle","current":{},"description":"확인할 차량을 선택하세요. 서로 다른 차량의 값은 합산하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"refresh":1,"sort":1,"options":[],"includeAll":false,"multi":false},{"name":"source","type":"query","label":"수집 경로","query":"SELECT '' AS __value, '전체' AS __text UNION SELECT DISTINCT source AS __value, source AS __text FROM vehicle_signal WHERE ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) ORDER BY __value","current":{"text":"전체","value":""},"description":"Exact match; can and fleet are never merged.","hide":0,"datasource":{"type":"mysql","uid":"greptime-mysql"},"options":[],"refresh":1,"includeAll":false,"multi":false},{"name":"epoch","type":"query","label":"해석 버전","query":"SELECT '' AS __value, '전체' AS __text UNION SELECT DISTINCT COALESCE(decode_epoch, '') AS __value, COALESCE(decode_epoch, '') AS __text FROM vehicle_signal WHERE ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) ORDER BY __value","current":{"text":"전체","value":""},"description":"Exact match; blank includes all epochs as separate scopes.","hide":0,"datasource":{"type":"mysql","uid":"greptime-mysql"},"options":[],"refresh":1,"includeAll":false,"multi":false}]},"links":[{"title":"배터리","type":"link","url":"/d/datalake-vehicle-battery","includeVars":true,"keepTime":true,"targetBlank":false},{"title":"차량 개요","type":"link","url":"/d/datalake-vehicle-overview","includeVars":true,"keepTime":true,"targetBlank":false},{"title":"주행","type":"link","url":"/d/datalake-vehicle-drives","includeVars":true,"keepTime":true,"targetBlank":false},{"title":"수집 진단 · CAN/VSS","type":"link","url":"/d/datalake-vehicle-can-vss","includeVars":true,"keepTime":true,"targetBlank":false},{"title":"수집 진단 · DBC","type":"link","url":"/d/datalake-vehicle-dbc-health","includeVars":true,"keepTime":true,"targetBlank":false}],"description":"충전 상태, 충전 전력, 충전량과 충전 기록입니다. 충전 기록은 명시적인 충전 상태·전력·충전 누적계 증가가 있을 때만 만들어지며 잔량 상승만으로 추정하지 않습니다.","panels":[
      {"id":90,"type":"text","title":"CAN 보고값 해석","options":{"mode":"markdown","content":"**CAN은 미검증 보고값입니다.** 선택 기간의 관측 기록이며 현재 차량 상태나 건강 판정이 아닙니다. 아래 관측 시각과 DB 수신 시각을 구분하세요. CAN 기어·충전 상태는 DBC enum을 표시하며 충전 허용을 실제 충전 중으로 단정하지 않습니다. 대응 신호가 없는 온도·셀 번호와 검증되지 않은 전력·에너지 계산은 판단 불가로 남습니다."},"gridPos":{"x":0,"y":0,"w":24,"h":3}},
      {"id":91,"type":"table","title":"CAN 보고값 · 관측 시각과 DB 수신 시각","description":"선택 기간의 신호별 최신 원본 보고값입니다. invalid/unknown_enum과 원본 단위를 그대로 보여주며 건강 판정으로 사용하지 않습니다. 최신 무효 보고도 숨기지 않습니다. 차량 식별자는 자동으로 합치지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, source_field ORDER BY event_time DESC, ingest_time DESC, envelope_id DESC) AS latest_rank FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND ((source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socUI' AND source_field = 'BMS_socUI') OR (source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socAvg' AND source_field = 'BMS_socAvg') OR (source = 'can' AND path = 'Vehicle.CAN.x352.BMS_nominalEnergyRemaining' AND source_field = 'BMS_nominalEnergyRemaining') OR (source = 'can' AND path = 'Vehicle.CAN.x118.DI_gear' AND source_field = 'DI_gear') OR (source = 'can' AND path = 'Vehicle.CAN.x13D.CP_hvChargeStatus' AND source_field = 'CP_hvChargeStatus') OR (source = 'can' AND path = 'Vehicle.CAN.x20C.VCRIGHT_tempAmbientRaw' AND source_field = 'VCRIGHT_tempAmbientRaw') OR (source = 'can' AND path = 'Vehicle.CAN.x332.BMS_brickVoltageMax' AND source_field = 'BMS_brickVoltageMax') OR (source = 'can' AND path = 'Vehicle.CAN.x332.BMS_brickVoltageMin' AND source_field = 'BMS_brickVoltageMin') OR (source = 'can' AND path = 'Vehicle.CAN.x257.DI_vehicleSpeed' AND source_field = 'DI_vehicleSpeed') OR (source = 'can' AND path = 'Vehicle.CAN.x132.BMS_packVoltage' AND source_field = 'BMS_packVoltage') OR (source = 'can' AND path = 'Vehicle.CAN.x132.BMS_packCurrent' AND source_field = 'BMS_packCurrent'))) SELECT vehicle AS `차량`, source AS `수집원`, decode_epoch AS `해석 버전`, source_field AS `원본 신호`, value_num AS `숫자 보고값`, value_text AS `상태 보고값`, unit AS `원본 단위`, quality AS `품질`, CAST(event_time AS TIMESTAMP(6)) AS `관측 시각`, CAST(ingest_time AS TIMESTAMP(6)) AS `DB 수신 시각` FROM latest WHERE latest_rank = 1 ORDER BY vehicle, source, decode_epoch, source_field","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음"},"overrides":[{"matcher":{"id":"byName","options":"관측 시각"},"properties":[{"id":"unit","value":"dateTimeAsIso"}]},{"matcher":{"id":"byName","options":"DB 수신 시각"},"properties":[{"id":"unit","value":"dateTimeAsIso"}]}]},"options":{"showHeader":true},"gridPos":{"x":0,"y":3,"w":24,"h":5}},
      {"id":5,"type":"stat","title":"충전 상태 · 보고값","description":"가장 최근 충전 상태(DetailedChargeState)입니다. CAN 대응: CP_hvChargeStatus의 미검증 보고값입니다. 관측 시각은 위 CAN 보고값 표를 확인하세요. 단위 불일치·최신 무효 값은 과거 정상 값으로 대체하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH signals AS (SELECT event_time, vehicle, source, decode_epoch, ingest_time, envelope_id, value_num, value_text, value_bool, path AS path, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x13D.CP_hvChargeStatus' AND source_field = 'CP_hvChargeStatus' THEN 'DetailedChargeState' ELSE source_field END AS source_field, unit AS unit, quality, (quality = 'reported_unverified' AND ((source = 'can' AND path = 'Vehicle.CAN.x13D.CP_hvChargeStatus' AND source_field = 'CP_hvChargeStatus'))) AS can_report FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, source_field ORDER BY event_time DESC, ingest_time DESC, envelope_id DESC) AS latest_rank FROM signals WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field IN ('DetailedChargeState')) SELECT vehicle, source, decode_epoch, MAX(CASE WHEN source_field = 'DetailedChargeState' AND (quality IS NULL OR quality = 'ok' OR can_report) AND (source <> 'can' OR value_text IN ('CP_CHARGE_INACTIVE', 'CP_CHARGE_CONNECTED', 'CP_CHARGE_STANDBY', 'CP_EXT_EVSE_TEST_ACTIVE', 'CP_EVSE_TEST_PASSED', 'CP_CHARGE_ENABLED', 'CP_CHARGE_FAULTED')) THEN value_text END) AS reading FROM latest WHERE latest_rank = 1 GROUP BY vehicle, source, decode_epoch ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"none","noValue":"기록 없음","color":{"mode":"thresholds"},"mappings":[{"type":"value","options":{"DetailedChargeStateDisconnected":{"text":"케이블 분리","color":"#5E6A7A","index":0},"DetailedChargeStateNoPower":{"text":"전원 없음","color":"#FF9830","index":1},"DetailedChargeStateStarting":{"text":"충전 시작","color":"#96D98D","index":2},"DetailedChargeStateCharging":{"text":"충전 중","color":"#56A64B","index":3},"DetailedChargeStateStopped":{"text":"충전 멈춤","color":"#F2CC0C","index":4},"DetailedChargeStateComplete":{"text":"충전 완료","color":"#5794F2","index":5},"CP_CHARGE_INACTIVE":{"text":"비활성 · CAN 미검증","color":"#FF9830","index":6},"CP_CHARGE_CONNECTED":{"text":"연결됨 · CAN 미검증","color":"#FF9830","index":7},"CP_CHARGE_STANDBY":{"text":"대기 · CAN 미검증","color":"#FF9830","index":8},"CP_EXT_EVSE_TEST_ACTIVE":{"text":"외부 EVSE 시험 중 · CAN 미검증","color":"#FF9830","index":9},"CP_EVSE_TEST_PASSED":{"text":"EVSE 시험 통과 · CAN 미검증","color":"#FF9830","index":10},"CP_CHARGE_ENABLED":{"text":"충전 허용 · CAN 미검증","color":"#FF9830","index":11},"CP_CHARGE_FAULTED":{"text":"충전 오류 보고 · CAN 미검증","color":"#FF9830","index":12}}},{"type":"special","options":{"match":"null","result":{"text":"판단 불가","color":"#6E7681","index":0}}}],"thresholds":{"mode":"absolute","steps":[{"value":null,"color":"#6E7681"}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"/^reading$/","values":true},"text":{"valueSize":26,"titleSize":12}},"gridPos":{"x":0,"y":8,"w":6,"h":4}},
      {"id":6,"type":"stat","title":"최근 완료 구간 배터리 전력","description":"시간별 분석이 완료된 가장 최근 구간의 마지막 동시 팩 전압·전류 관측입니다. 실시간 전력이 아닙니다. 정확한 차량·수집원·해석 버전의 단위 교정(scale/offset)과 current_sign을 적용하며 + 충전 / − 사용입니다. 최신 무효·단위 미확인·시각 불일치·구간 끝에서 max_gap_ns 초과는 판단 불가이고, 더 최근의 미분석 원시 입력도 과거 값으로 대체하지 않습니다. 관측 시각은 분석 기록의 value_text에 UTC로 남습니다. 선택 기간 끝의 바로 전 완료 시간 구간이 없으면 과거 구간 숫자를 표시하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND `metric` = 'battery.energy.latest_power_kw'), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric` ORDER BY window_start DESC, computed_at DESC, revision DESC) AS latest_rank FROM revisions WHERE revision_rank = 1), raw_frontier AS (SELECT vehicle, source, decode_epoch, MAX(event_time) AS raw_event_time, MAX(ingest_time) AS raw_ingest_time FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field IN ('PackVoltage', 'PackCurrent') GROUP BY vehicle, source, decode_epoch) SELECT latest.vehicle, latest.source, latest.decode_epoch, CAST(latest.value_text AS TIMESTAMP(6)) AS observed_at, CASE WHEN latest.window_end >= FROM_UNIXTIME(CAST(FLOOR($$__unixEpochTo() / 3600) * 3600 - 1 AS BIGINT)) AND latest.status = 'derived' AND latest.unit = 'kW' AND latest.value_text IS NOT NULL AND (raw.raw_event_time IS NULL OR raw.raw_event_time <= CAST(latest.value_text AS TIMESTAMP(6))) AND (raw.raw_ingest_time IS NULL OR raw.raw_ingest_time <= latest.computed_at) THEN latest.`value` ELSE NULL END AS reading FROM latest LEFT JOIN raw_frontier raw ON raw.vehicle = latest.vehicle AND raw.source = latest.source AND COALESCE(raw.decode_epoch, '') = COALESCE(latest.decode_epoch, '') WHERE latest.latest_rank = 1 ORDER BY latest.vehicle, latest.source, latest.decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"kwatt","noValue":"기록 없음","color":{"mode":"thresholds"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"판단 불가","color":"#6E7681","index":0}}}],"decimals":1,"thresholds":{"mode":"absolute","steps":[{"value":null,"color":"#3274D9"},{"value":-0.5,"color":"#6E7681"},{"value":0.5,"color":"#56A64B"}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"/^reading$/","values":true},"text":{"valueSize":34,"titleSize":12}},"gridPos":{"x":6,"y":8,"w":6,"h":4}},
      {"id":7,"type":"stat","title":"오늘 충전","description":"오늘 배터리에 들어간 충전 에너지(DCChargingEnergyIn 증가량, 배터리 측 AC+DC)의 합입니다. 충전기 계량값과 다를 수 있습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE `metric` IN ('battery.energy.dc_charging_energy_in_kwh') AND window_start >= date_trunc('day', now() AT TIME ZONE 'Asia/Seoul') AT TIME ZONE 'Asia/Seoul' AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT vehicle, source, decode_epoch, COUNT(*) AS windows, SUM(`value`) AS reading FROM revisions WHERE revision_rank = 1 AND status = 'derived' AND unit = 'kWh' AND `value` IS NOT NULL GROUP BY vehicle, source, decode_epoch ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"kwatth","noValue":"기록 없음","color":{"mode":"fixed","fixedColor":"#56A64B"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"기록 없음","color":"#6E7681","index":0}}}]},"overrides":[{"matcher":{"id":"byName","options":"windows"},"properties":[{"id":"custom.hidden","value":true}]}]},"options":{"colorMode":"value","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"/^reading$/","values":true},"text":{"valueSize":22,"titleSize":12}},"gridPos":{"x":12,"y":8,"w":6,"h":4}},
      {"id":8,"type":"stat","title":"이번 주 충전","description":"이번 주 배터리에 들어간 충전 에너지(DCChargingEnergyIn 증가량)의 합입니다. 충전 손실 전 충전기 입력량이 아닙니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE `metric` IN ('battery.energy.dc_charging_energy_in_kwh') AND window_start >= date_trunc('week', now() AT TIME ZONE 'Asia/Seoul') AT TIME ZONE 'Asia/Seoul' AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT vehicle, source, decode_epoch, COUNT(*) AS windows, SUM(`value`) AS reading FROM revisions WHERE revision_rank = 1 AND status = 'derived' AND unit = 'kWh' AND `value` IS NOT NULL GROUP BY vehicle, source, decode_epoch ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"kwatth","noValue":"기록 없음","color":{"mode":"fixed","fixedColor":"#56A64B"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"기록 없음","color":"#6E7681","index":0}}}]},"overrides":[{"matcher":{"id":"byName","options":"windows"},"properties":[{"id":"custom.hidden","value":true}]}]},"options":{"colorMode":"value","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"/^reading$/","values":true},"text":{"valueSize":22,"titleSize":12}},"gridPos":{"x":18,"y":8,"w":6,"h":4}},
      {"id":9,"type":"timeseries","title":"잔량 변화","description":"차량 표시 잔량과 BMS 잔량을 구간 평균으로 표시합니다. 두 값은 서로 다른 항목입니다. CAN 대응: BMS_socUI, BMS_socAvg의 미검증 보고값입니다. 관측 시각은 위 CAN 보고값 표를 확인하세요. 단위 불일치·최신 무효 값은 과거 정상 값으로 대체하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"interval":"5m","targets":[{"refId":"A","format":"time_series","rawSql":"WITH signals AS (SELECT event_time, vehicle, source, decode_epoch, ingest_time, envelope_id, value_num, value_text, value_bool, path AS path, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socUI' AND source_field = 'BMS_socUI' THEN 'BatteryLevel' WHEN source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socAvg' AND source_field = 'BMS_socAvg' THEN 'Soc' ELSE source_field END AS source_field, unit AS unit, quality, (quality = 'reported_unverified' AND ((source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socUI' AND source_field = 'BMS_socUI') OR (source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socAvg' AND source_field = 'BMS_socAvg'))) AS can_report FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT CAST(date_bin(INTERVAL $$__interval_ms MILLISECOND, event_time) AS TIMESTAMP(6)) AS `time`, CONCAT(CASE source_field WHEN 'BatteryLevel' THEN '차량 표시 잔량' WHEN 'Soc' THEN 'BMS 잔량' END, CASE WHEN source = 'fleet' AND decode_epoch = 'fleet-v1' THEN '' ELSE CONCAT(' · ', source, '/', COALESCE(decode_epoch, '')) END) AS `metric`, CASE source_field WHEN 'BatteryLevel' THEN AVG(value_num) WHEN 'Soc' THEN AVG(value_num) END AS `value` FROM signals WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field IN ('BatteryLevel', 'Soc') AND value_num IS NOT NULL AND (quality IS NULL OR quality = 'ok' OR can_report) GROUP BY 1, source, decode_epoch, source_field ORDER BY 1","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"percent","noValue":"기록 없음","custom":{"drawStyle":"line","lineInterpolation":"smooth","lineWidth":2,"fillOpacity":10,"gradientMode":"opacity","showPoints":"never","spanNulls":false,"axisBorderShow":false,"axisPlacement":"auto","barAlignment":0,"barWidthFactor":0.8,"pointSize":4,"stacking":{"mode":"none","group":"A"},"thresholdsStyle":{"mode":"off"}},"color":{"mode":"palette-classic"},"decimals":0,"min":0,"max":100},"overrides":[{"matcher":{"id":"byName","options":"차량 표시 잔량"},"properties":[{"id":"color","value":{"mode":"fixed","fixedColor":"#56A64B"}}]},{"matcher":{"id":"byName","options":"BMS 잔량"},"properties":[{"id":"color","value":{"mode":"fixed","fixedColor":"#3274D9"}}]}]},"options":{"legend":{"displayMode":"list","placement":"bottom","showLegend":true,"calcs":[]},"tooltip":{"mode":"multi","sort":"desc"}},"gridPos":{"x":0,"y":12,"w":12,"h":8}},
      {"id":10,"type":"timeseries","title":"시간별 마지막 교정 전력 (+ 충전 / − 사용)","description":"각 완료된 시간 구간의 마지막 동시 교정 샘플(kW)입니다. 시간 평균·kWh·실시간 전력이 아닙니다. x축은 실제 관측 시각(UTC 저장, 대시보드 시간대 표시)입니다. 최신 invalid/unmatched/stale 결과는 NULL이며 구간별 최신 리비전이 이전 정상 값을 덮습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"interval":"1h","targets":[{"refId":"A","format":"time_series","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND `metric` = 'battery.energy.latest_power_kw') SELECT CAST(value_text AS TIMESTAMP(6)) AS `time`, CONCAT(vehicle, ' · ', source, '/', COALESCE(decode_epoch, '')) AS `metric`, CASE WHEN status = 'derived' AND unit = 'kW' THEN `value` ELSE NULL END AS `value` FROM revisions WHERE revision_rank = 1 AND value_text IS NOT NULL ORDER BY 1","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"kwatt","noValue":"기록 없음","custom":{"drawStyle":"points","lineInterpolation":"linear","lineWidth":2,"fillOpacity":0,"gradientMode":"scheme","showPoints":"always","spanNulls":false,"axisBorderShow":false,"axisPlacement":"auto","barAlignment":0,"barWidthFactor":0.8,"pointSize":4,"stacking":{"mode":"none","group":"A"},"thresholdsStyle":{"mode":"off"}},"color":{"mode":"thresholds"},"decimals":1,"thresholds":{"mode":"absolute","steps":[{"value":null,"color":"#3274D9"},{"value":0,"color":"#56A64B"}]}},"overrides":[]},"options":{"legend":{"displayMode":"list","placement":"bottom","showLegend":true,"calcs":[]},"tooltip":{"mode":"multi","sort":"desc"}},"gridPos":{"x":12,"y":12,"w":12,"h":8}},
      {"id":11,"type":"state-timeline","title":"충전 상태 기록","description":"충전 케이블·충전 진행 상태 변화입니다. CAN 대응: CP_hvChargeStatus의 미검증 보고값입니다. 관측 시각은 위 CAN 보고값 표를 확인하세요. 단위 불일치·최신 무효 값은 과거 정상 값으로 대체하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH signals AS (SELECT event_time, vehicle, source, decode_epoch, ingest_time, envelope_id, value_num, value_text, value_bool, path AS path, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x13D.CP_hvChargeStatus' AND source_field = 'CP_hvChargeStatus' THEN 'DetailedChargeState' ELSE source_field END AS source_field, unit AS unit, quality, (quality = 'reported_unverified' AND ((source = 'can' AND path = 'Vehicle.CAN.x13D.CP_hvChargeStatus' AND source_field = 'CP_hvChargeStatus'))) AS can_report FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT CAST(event_time AS TIMESTAMP(6)) AS `time`, CONCAT(vehicle, ' · ', source, '/', COALESCE(decode_epoch, '')) AS series, CASE WHEN (quality IS NULL OR quality = 'ok' OR can_report) AND (source <> 'can' OR value_text IN ('CP_CHARGE_INACTIVE', 'CP_CHARGE_CONNECTED', 'CP_CHARGE_STANDBY', 'CP_EXT_EVSE_TEST_ACTIVE', 'CP_EVSE_TEST_PASSED', 'CP_CHARGE_ENABLED', 'CP_CHARGE_FAULTED')) THEN value_text ELSE NULL END AS `충전` FROM signals WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field = 'DetailedChargeState' ORDER BY event_time, ingest_time, envelope_id","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음","mappings":[{"type":"value","options":{"DetailedChargeStateDisconnected":{"text":"분리","color":"#5E6A7A","index":0},"DetailedChargeStateNoPower":{"text":"전원 없음","color":"#FF9830","index":1},"DetailedChargeStateStarting":{"text":"시작","color":"#96D98D","index":2},"DetailedChargeStateCharging":{"text":"충전","color":"#56A64B","index":3},"DetailedChargeStateStopped":{"text":"멈춤","color":"#F2CC0C","index":4},"DetailedChargeStateComplete":{"text":"완료","color":"#5794F2","index":5},"CP_CHARGE_INACTIVE":{"text":"비활성 · CAN 미검증","color":"#FF9830","index":6},"CP_CHARGE_CONNECTED":{"text":"연결됨 · CAN 미검증","color":"#FF9830","index":7},"CP_CHARGE_STANDBY":{"text":"대기 · CAN 미검증","color":"#FF9830","index":8},"CP_EXT_EVSE_TEST_ACTIVE":{"text":"외부 EVSE 시험 중 · CAN 미검증","color":"#FF9830","index":9},"CP_EVSE_TEST_PASSED":{"text":"EVSE 시험 통과 · CAN 미검증","color":"#FF9830","index":10},"CP_CHARGE_ENABLED":{"text":"충전 허용 · CAN 미검증","color":"#FF9830","index":11},"CP_CHARGE_FAULTED":{"text":"충전 오류 보고 · CAN 미검증","color":"#FF9830","index":12}}}],"color":{"mode":"thresholds"},"thresholds":{"mode":"absolute","steps":[{"value":null,"color":"#6E7681"}]},"custom":{"fillOpacity":80,"lineWidth":0,"spanNulls":false}},"overrides":[]},"options":{"mergeValues":true,"showValue":"auto","alignValue":"center","rowHeight":0.8,"legend":{"showLegend":false},"tooltip":{"mode":"single"}},"gridPos":{"x":0,"y":20,"w":24,"h":3},"transformations":[{"id":"partitionByValues","options":{"fields":["series"]}}]},
      {"id":12,"type":"timeseries","title":"시간별 충전 에너지","description":"분석이 끝난 시간 구간별 충전 에너지(DCChargingEnergyIn 증가량, 배터리 측 AC+DC)입니다. 충전기 계량값과 다를 수 있습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"interval":"1h","targets":[{"refId":"A","format":"time_series","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND `metric` IN ('battery.energy.dc_charging_energy_in_kwh')) SELECT CAST(window_start AS TIMESTAMP(6)) AS `time`, CASE `metric` WHEN 'battery.energy.dc_charging_energy_in_kwh' THEN '충전' END AS `metric`, SUM(`value` * CASE `metric` WHEN 'battery.energy.dc_charging_energy_in_kwh' THEN 1 END) AS `value` FROM revisions WHERE revision_rank = 1 AND status = 'derived' AND unit = 'kWh' AND `value` IS NOT NULL GROUP BY 1, 2 ORDER BY 1","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"kwatth","noValue":"기록 없음","custom":{"drawStyle":"bars","lineInterpolation":"linear","lineWidth":2,"fillOpacity":80,"gradientMode":"opacity","showPoints":"never","spanNulls":false,"axisBorderShow":false,"axisPlacement":"auto","barAlignment":0,"barWidthFactor":0.8,"pointSize":4,"stacking":{"mode":"none","group":"A"},"thresholdsStyle":{"mode":"off"}},"color":{"mode":"palette-classic"}},"overrides":[{"matcher":{"id":"byName","options":"충전"},"properties":[{"id":"color","value":{"mode":"fixed","fixedColor":"#56A64B"}}]}]},"options":{"legend":{"displayMode":"list","placement":"bottom","showLegend":true,"calcs":[]},"tooltip":{"mode":"multi","sort":"desc"}},"gridPos":{"x":0,"y":23,"w":24,"h":7}},
      {"id":4,"type":"table","title":"충전 기록","description":"(원문) Charging requires explicit charging state, dedicated charging power, or a charge-counter increase; SOC rise alone is insufficient. ended_at=NULL marks an ongoing session. Energy uses charge-counter delta, then measured power integration, else NULL; never inferred from battery capacity. Source/epoch groups never merge.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT session_id, vehicle, source, decode_epoch, CAST(started_at AS TIMESTAMP(6)) AS started_at, CAST(ended_at AS TIMESTAMP(6)) AS ended_at, duration_s, energy_added_kwh, start_soc, end_soc, avg_power_kw, max_power_kw FROM charge_session WHERE $$__timeFilter(started_at) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) ORDER BY started_at DESC LIMIT 100","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"충전 기록 없음","custom":{"align":"auto","cellOptions":{"type":"auto"},"inspect":false}},"overrides":[{"matcher":{"id":"byName","options":"started_at"},"properties":[{"id":"displayName","value":"시작"},{"id":"unit","value":"dateTimeAsLocal"}]},{"matcher":{"id":"byName","options":"ended_at"},"properties":[{"id":"displayName","value":"종료 (비어 있으면 진행 중)"},{"id":"unit","value":"dateTimeAsLocal"}]},{"matcher":{"id":"byName","options":"duration_s"},"properties":[{"id":"displayName","value":"시간"},{"id":"unit","value":"s"}]},{"matcher":{"id":"byName","options":"energy_added_kwh"},"properties":[{"id":"displayName","value":"충전량"},{"id":"unit","value":"kwatth"}]},{"matcher":{"id":"byName","options":"start_soc"},"properties":[{"id":"displayName","value":"시작 잔량"},{"id":"unit","value":"percent"}]},{"matcher":{"id":"byName","options":"end_soc"},"properties":[{"id":"displayName","value":"종료 잔량"},{"id":"unit","value":"percent"}]},{"matcher":{"id":"byName","options":"avg_power_kw"},"properties":[{"id":"displayName","value":"평균 전력"},{"id":"unit","value":"kwatt"}]},{"matcher":{"id":"byName","options":"max_power_kw"},"properties":[{"id":"displayName","value":"최대 전력"},{"id":"unit","value":"kwatt"}]},{"matcher":{"id":"byName","options":"source"},"properties":[{"id":"displayName","value":"수집 경로"}]},{"matcher":{"id":"byName","options":"decode_epoch"},"properties":[{"id":"displayName","value":"해석 버전"}]},{"matcher":{"id":"byName","options":"session_id"},"properties":[{"id":"custom.hidden","value":true}]},{"matcher":{"id":"byName","options":"vehicle"},"properties":[{"id":"custom.hidden","value":true}]}]},"options":{"showHeader":true,"cellHeight":"sm","footer":{"show":false,"reducer":["sum"],"countRows":false,"fields":""}},"gridPos":{"x":0,"y":30,"w":24,"h":6}},
      {"id":20,"type":"row","title":"원시 기록","collapsed":true,"gridPos":{"x":0,"y":38,"w":24,"h":1},"panels":[{"id":1,"type":"table","title":"배터리·충전 관련 신호 목록","description":"Data-driven path discovery; empty means no such signals stored, not zero.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT DISTINCT path, unit FROM vehicle_signal WHERE (path LIKE '%atter%' OR path LIKE '%harg%' OR path LIKE '%SOC%' OR path LIKE '%Energy%') AND $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) ORDER BY path","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"x":0,"y":39,"w":24,"h":8}},{"id":2,"type":"timeseries","title":"배터리·충전 원시 값","description":"Latest 5000 battery/charging samples, plotted oldest to newest; the inner query picks the recent window, the outer query restores chronological order.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT `time`, vehicle, source, decode_epoch, path, value FROM (SELECT CAST(event_time AS TIMESTAMP(6)) AS `time`, vehicle, source, decode_epoch, path, value_num AS value FROM vehicle_signal WHERE (path LIKE '%atter%' OR path LIKE '%harg%' OR path LIKE '%SOC%' OR path LIKE '%Energy%') AND value_num IS NOT NULL AND $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) ORDER BY event_time DESC LIMIT 5000) AS recent ORDER BY `time` ASC","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","showLegend":true},"tooltip":{"mode":"multi","sort":"none"}},"gridPos":{"x":0,"y":47,"w":24,"h":9}},{"id":3,"type":"table","title":"최근 원시 기록 (100건)","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT CAST(event_time AS TIMESTAMP(6)) AS event_time, vehicle, path, source, value_num, value_text, unit, decode_epoch FROM vehicle_signal WHERE (path LIKE '%atter%' OR path LIKE '%harg%' OR path LIKE '%SOC%' OR path LIKE '%Energy%') AND $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) ORDER BY event_time DESC LIMIT 100","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"x":0,"y":56,"w":24,"h":9}}]}
      ]}
  grafana-dash-dbc-health:
    content: |
      {"uid":"datalake-vehicle-dbc-health","title":"수집 진단 · DBC","tags":["datalake","vehicle","diagnostics"],"timezone":"Asia/Seoul","schemaVersion":39,"version":3,"time":{"from":"now-30d","to":"now"},"links":[{"title":"배터리","type":"link","url":"/d/datalake-vehicle-battery","includeVars":true,"keepTime":true,"targetBlank":false},{"title":"차량 개요","type":"link","url":"/d/datalake-vehicle-overview","includeVars":true,"keepTime":true,"targetBlank":false},{"title":"충전","type":"link","url":"/d/datalake-vehicle-charging","includeVars":true,"keepTime":true,"targetBlank":false},{"title":"주행","type":"link","url":"/d/datalake-vehicle-drives","includeVars":true,"keepTime":true,"targetBlank":false},{"title":"수집 진단 · CAN/VSS","type":"link","url":"/d/datalake-vehicle-can-vss","includeVars":true,"keepTime":true,"targetBlank":false}],"description":"엔지니어링 진단용입니다. DBC 해석 계보, 원시 기록·업로드 상태, 검증 결과, CAN/Fleet 비교를 확인합니다.","panels":[
      {"id":1,"type":"table","title":"Decode epoch lineage","description":"Vehicle/source/epoch lineage. Supplemental commit is present only when that DBC is used; replacement overrides report their version and optional commit. Original artifact hashes remain in the immutable generation manifest.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT vehicle, source, decode_epoch, vehicle_firmware, dbc_primary_commit, dbc_supplemental_commit, dbc_override_version, dbc_override_commit, mapping_revision, collector_version, COUNT(*) AS rows, CAST(MIN(event_time) AS TIMESTAMP(6)) AS first_seen, CAST(MAX(event_time) AS TIMESTAMP(6)) AS last_seen FROM vehicle_signal WHERE $$__timeFilter(event_time) GROUP BY vehicle, source, decode_epoch, vehicle_firmware, dbc_primary_commit, dbc_supplemental_commit, dbc_override_version, dbc_override_commit, mapping_revision, collector_version ORDER BY decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":24,"x":0,"y":0}},
      {"id":2,"type":"stat","title":"Rows missing firmware","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT SUM(CASE WHEN NULLIF(vehicle_firmware, '') IS NULL THEN 1 ELSE 0 END) AS rows_no_firmware FROM vehicle_signal WHERE $$__timeFilter(event_time)","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"No data","mappings":[{"type":"special","options":{"match":"null","result":{"text":"No data","color":"gray"}}}]},"overrides":[]},"options":{"colorMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto"},"gridPos":{"h":8,"w":8,"x":0,"y":8}},
      {"id":3,"type":"stat","title":"CAN rows missing DBC provenance","description":"CAN requires a primary commit plus the used supplemental commit or applied override version. Override commit is optional. Fleet rows do not use DBC decoding and are excluded.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT SUM(CASE WHEN (NULLIF(dbc_primary_commit, '') IS NULL OR (NULLIF(dbc_supplemental_commit, '') IS NULL AND NULLIF(dbc_override_version, '') IS NULL)) THEN 1 ELSE 0 END) AS rows_no_dbc FROM vehicle_signal WHERE $$__timeFilter(event_time) AND source <> 'fleet'","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"No data","mappings":[{"type":"special","options":{"match":"null","result":{"text":"No data","color":"gray"}}}]},"overrides":[]},"options":{"colorMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto"},"gridPos":{"h":8,"w":8,"x":8,"y":8}},
      {"id":4,"type":"stat","title":"Rows without unit metadata","description":"Dimensionless flags may legitimately have no unit.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT SUM(CASE WHEN NULLIF(unit, '') IS NULL THEN 1 ELSE 0 END) AS rows_no_unit FROM vehicle_signal WHERE $$__timeFilter(event_time)","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"No data","mappings":[{"type":"special","options":{"match":"null","result":{"text":"No data","color":"gray"}}}]},"overrides":[]},"options":{"colorMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto"},"gridPos":{"h":8,"w":8,"x":16,"y":8}},
      {"id":5,"type":"text","title":"Validation coverage","fieldConfig":{"defaults":{},"overrides":[]},"options":{"content":"Raw recorder :9102 reports spool/drop/finalize state and can_validation_* after sealing each chunk. Validation uses the hash-verified epoch DBCs; checksum, expected-signal and cross-signal checks require explicit CAN_VALIDATION_* rules. Unconfigured checks are absent, not healthy zero. Uploader :9103 reports local backlog, verified uploads and actual bucket inventory. VSS :9104 reports durable outbox delivery. Set VEHICLE_METRICS_TARGETS to reachable Pi/Tailnet endpoints; the empty default performs no vehicle scrape. Validation labels identify vehicle and decode_epoch; canonical lineage and immutable manifests remain authoritative.","mode":"markdown"},"gridPos":{"h":8,"w":24,"x":0,"y":16}},
      {"id":6,"type":"table","title":"Raw spool/upload (Prom, instant; vehicle scrape opt-in)","description":"Queries the verbatim raw_recorder_*/raw_uploader_* series from the vehicle scrape jobs vehicle-raw-recorder (:9102) and vehicle-raw-uploader (:9103), driven by VEHICLE_METRICS_TARGETS (default empty = no scrape). Missing means not configured (absence), never zero and never an outage.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","expr":"{__name__=~\"raw_recorder_.*|raw_uploader_.*\",job=~\"vehicle-raw-recorder|vehicle-raw-uploader\"}","format":"table","instant":true,"datasource":{"type":"prometheus","uid":"greptime-prom"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":24,"x":0,"y":24}},
      {"id":7,"type":"table","title":"VSS outbox (Prom, instant; vehicle scrape opt-in)","description":"Missing vss_* series mean no configured vehicle scrape, not zero backlog.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","expr":"{__name__=~\"vss_.*\",job=\"vss-recorder\"}","format":"table","instant":true,"datasource":{"type":"prometheus","uid":"greptime-prom"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":24,"x":0,"y":32}},
      {"id":8,"type":"table","title":"DBC validation by vehicle / epoch","description":"Observed sealed-chunk coverage, unknown IDs, decode/invalid/checksum errors and configured signal checks. Check configured and last-success series before interpreting counters.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","expr":"{__name__=~\"can_validation_.*\",job=\"vehicle-raw-recorder\"}","format":"table","instant":true,"datasource":{"type":"prometheus","uid":"greptime-prom"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":10,"w":24,"x":0,"y":40}},
      {"id":9,"type":"table","title":"CAN / Fleet divergence — paired minute means","description":"SOC, speed and odometer from separately stored can/fleet sources. Epochs remain separate. Minute means are not simultaneous samples; absent Fleet input or an unmatched minute yields no pair, never zero divergence.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH buckets AS (SELECT date_trunc('minute', event_time) AS bucket, vehicle, path, source, decode_epoch, AVG(value_num) AS value FROM vehicle_signal WHERE $$__timeFilter(event_time) AND source IN ('can','fleet') AND path IN ('Vehicle.Speed','Vehicle.Powertrain.TractionBattery.StateOfCharge.Current','Vehicle.TraveledDistance') AND value_num IS NOT NULL GROUP BY bucket, vehicle, path, source, decode_epoch) SELECT c.bucket AS `time`, c.vehicle, c.path, c.decode_epoch AS can_epoch, f.decode_epoch AS fleet_epoch, c.value AS can_value, f.value AS fleet_value, c.value-f.value AS divergence FROM buckets c JOIN buckets f ON c.bucket=f.bucket AND c.vehicle=f.vehicle AND c.path=f.path WHERE c.source='can' AND f.source='fleet' ORDER BY c.bucket DESC LIMIT 500","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":10,"w":24,"x":0,"y":50}}
      ]}
  grafana-dash-home:
    content: |
      {"uid":"datalake-home","title":"Home","tags":["datalake","home"],"timezone":"Asia/Seoul","schemaVersion":39,"version":2,"time":{"from":"now-24h","to":"now"},"panels":[
      {"id":1,"type":"text","title":"Home sources","fieldConfig":{"defaults":{},"overrides":[]},"options":{"content":"Set HOME_AGG_SOURCES to a JSON list of table/time_col/entity_col/value_col mappings for simultaneous HA and MQTT rollups. Each source is table.value_col. Raw TTL applies to whole configured tables: include every field requiring long-term rollups. Increasing TTL cannot recover expired history. mqtt_consumer protocol columns are created at bootstrap; numeric payload columns appear with actual input. MQTT is at-least-once: publisher QoS1, broker persistence and a stable client ID are required for restart recovery; duplicates are possible.","mode":"markdown"},"gridPos":{"h":4,"w":24,"x":0,"y":0}},
      {"id":2,"type":"stat","title":"Rows in mqtt_consumer (range)","description":"Observed MQTT arrivals only. No input is No data, never a healthy publisher or a measured zero.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT NULLIF(COUNT(*), 0) AS rows FROM mqtt_consumer WHERE $$__timeFilter(greptime_timestamp)","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"No data","mappings":[{"type":"special","options":{"match":"null","result":{"text":"No data","color":"gray"}}}]},"overrides":[]},"options":{"colorMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto"},"gridPos":{"h":8,"w":12,"x":0,"y":4}},
      {"id":3,"type":"table","title":"Recent MQTT arrivals","description":"Protocol metadata only: JSON value fields vary by topic. Numeric values are available in the configured Home rollups below; raw payload fields remain in mqtt_consumer.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT CAST(greptime_timestamp AS TIMESTAMP(6)) AS event_time, topic, host FROM mqtt_consumer WHERE $$__timeFilter(greptime_timestamp) ORDER BY greptime_timestamp DESC LIMIT 200","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":12,"x":12,"y":4}},
      {"id":4,"type":"table","title":"Scrape targets incl. home (Prom)","description":"Home scrape rows appear only while the home profile runs; a missing row is absence, not an alarm.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","expr":"up","format":"table","instant":true,"datasource":{"type":"prometheus","uid":"greptime-prom"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":24,"x":0,"y":12}},
      {"id":5,"type":"table","title":"Rollups (home_agg)","description":"home_agg rollups written by aggregate.py from HOME_AGG_SOURCES (JSON list; simultaneous inputs supported); source is the STRING PK identifying table.value_col. Empty means no aggregates yet (absence). Raw mqtt_consumer panels above remain the fallback.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT CAST(window_start AS TIMESTAMP(6)) AS window_start, resolution, entity, source, avg_value, min_value, max_value, sample_count FROM home_agg WHERE $$__timeFilter(window_start) ORDER BY window_start DESC LIMIT 500","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"h":8,"w":24,"x":0,"y":20}}
      ]}
  grafana-dash-health:
    content: |
      {"uid":"datalake-health","title":"Datalake Health","tags":["datalake","health"],"timezone":"Asia/Seoul","schemaVersion":39,"version":3,"time":{"from":"now-24h","to":"now"},"refresh":"5m","description":"Collection gaps and datalake infrastructure diagnostics. HTTP charts describe Greptime API traffic, not application/Caddy/browser requests. Missing series remain unknown.","templating":{"list":[{"name":"db_route","label":"Greptime API path","type":"query","datasource":{"type":"prometheus","uid":"greptime-prom"},"query":{"query":"label_values(greptime_servers_http_requests_total, path)","refId":"variable-db-route"},"definition":"label_values(greptime_servers_http_requests_total, path)","refresh":1,"sort":1,"multi":false,"includeAll":true,"allValue":".*","current":{"text":"All","value":"$$__all"}}]},"panels":[
      {"id":0,"type":"text","title":"Note","fieldConfig":{"defaults":{},"overrides":[]},"options":{"content":"**Collection health is not application health.** No data is unknown, not a measured zero. Scrape availability only covers discovered targets; a missing target needs separate inventory/heartbeat monitoring. HTTP panels below measure the **Greptime database API**, not gasa-v2/Caddy, DB query spans or browser render time. Use Overview for actual trace identity and observed operation latency. Receiver stages may see the same trace twice; they are kept separate. Optional vehicle/MQTT inputs can legitimately be absent.","mode":"markdown"},"gridPos":{"x":0,"y":0,"w":24,"h":5}},
      {"id":1,"type":"stat","title":"Discovered scrape targets up · %","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","expr":"100 * sum(up) / count(up)","datasource":{"type":"prometheus","uid":"greptime-prom"},"instant":true}],"fieldConfig":{"defaults":{"unit":"percent","noValue":"No scrape data","min":0,"max":100},"overrides":[]},"options":{"colorMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto"},"gridPos":{"x":0,"y":5,"w":6,"h":6},"description":"Only discovered targets are in the denominator. Missing series do not become healthy zeros or prove expected targets exist."},
      {"id":2,"type":"table","title":"Up by job/instance (Prom)","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","expr":"up","format":"table","instant":true,"datasource":{"type":"prometheus","uid":"greptime-prom"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"x":6,"y":5,"w":18,"h":6}},
      {"id":20,"type":"table","title":"Collection coverage · final 48h of range","description":"Final 48h of the selected range. Absence is explicitly labeled, not zero-filled. Event/bucket timestamps are NOT ingestion timestamps; aggregate timestamps do not establish job success or aggregation lag.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","datasource":{"type":"mysql","uid":"greptime-mysql"},"rawSql":"SELECT 'OTel spans' AS source, NULLIF(COUNT(*),0) AS stored_rows, CAST(MAX(timestamp) AS TIMESTAMP(6)) AS latest_event, CASE WHEN COUNT(*) = 0 THEN 'No observations in range' ELSE 'Observed' END AS coverage FROM opentelemetry_traces WHERE $$__timeFilter(timestamp) AND timestamp >= FROM_UNIXTIME($$__unixEpochTo() - 172800) UNION ALL SELECT 'OTel logs' AS source, NULLIF(COUNT(*),0) AS stored_rows, CAST(MAX(timestamp) AS TIMESTAMP(6)) AS latest_event, CASE WHEN COUNT(*) = 0 THEN 'No observations in range' ELSE 'Observed' END AS coverage FROM opentelemetry_logs WHERE $$__timeFilter(timestamp) AND timestamp >= FROM_UNIXTIME($$__unixEpochTo() - 172800) UNION ALL SELECT 'Vehicle samples' AS source, NULLIF(COUNT(*),0) AS stored_rows, CAST(MAX(event_time) AS TIMESTAMP(6)) AS latest_event, CASE WHEN COUNT(*) = 0 THEN 'No observations in range' ELSE 'Observed' END AS coverage FROM vehicle_signal WHERE $$__timeFilter(event_time) AND event_time >= FROM_UNIXTIME($$__unixEpochTo() - 172800) UNION ALL SELECT 'MQTT arrivals' AS source, NULLIF(COUNT(*),0) AS stored_rows, CAST(MAX(greptime_timestamp) AS TIMESTAMP(6)) AS latest_event, CASE WHEN COUNT(*) = 0 THEN 'No observations in range' ELSE 'Observed' END AS coverage FROM mqtt_consumer WHERE $$__timeFilter(greptime_timestamp) AND greptime_timestamp >= FROM_UNIXTIME($$__unixEpochTo() - 172800) UNION ALL SELECT 'AI sessions (start time)' AS source, NULLIF(COUNT(*),0) AS stored_rows, CAST(MAX(session_start) AS TIMESTAMP(6)) AS latest_event, CASE WHEN COUNT(*) = 0 THEN 'No observations in range' ELSE 'Observed' END AS coverage FROM ai_session_summary WHERE $$__timeFilter(session_start) AND session_start >= FROM_UNIXTIME($$__unixEpochTo() - 172800) UNION ALL SELECT 'Home rollups (bucket time)' AS source, NULLIF(COUNT(*),0) AS stored_rows, CAST(MAX(window_start) AS TIMESTAMP(6)) AS latest_event, CASE WHEN COUNT(*) = 0 THEN 'No observations in range' ELSE 'Observed' END AS coverage FROM home_agg WHERE $$__timeFilter(window_start) AND window_start >= FROM_UNIXTIME($$__unixEpochTo() - 172800)","format":"table"}],"fieldConfig":{"defaults":{"noValue":"No data"},"overrides":[]},"options":{"showHeader":true,"cellHeight":"sm"},"gridPos":{"x":0,"y":11,"w":24,"h":8}},
      {"id":21,"type":"timeseries","title":"Greptime API requests / second","description":"Greptime self-scrape only; top 8 paths at each instant. Counters are differentiated before aggregation. Select the API path above; this does not measure gasa-v2 requests.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"topk(8, sum by (path) (rate(greptime_servers_http_requests_total{path=~\"$${db_route}\"}[$$__rate_interval])))","range":true,"instant":false,"format":"time_series","legendFormat":"{{path}}"}],"fieldConfig":{"defaults":{"noValue":"No data","unit":"reqps","color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","lineWidth":1,"fillOpacity":8,"showPoints":"never","spanNulls":false}},"overrides":[]},"options":{"legend":{"showLegend":true,"displayMode":"table","placement":"bottom","calcs":["last"]},"tooltip":{"mode":"multi"}},"gridPos":{"x":0,"y":19,"w":12,"h":8}},
      {"id":22,"type":"timeseries","title":"Greptime API 5xx rate · observed traffic","description":"HTTP 5xx / observed requests for selected Greptime API paths. Zero is synthesized ONLY when an observed request denominator exists but no 5xx series exists. No requests or no series remains undefined. Client-side 4xx are visible in the status breakdown.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"100 * (sum(rate(greptime_servers_http_requests_total{path=~\"$${db_route}\",code=~\"5..\"}[$$__rate_interval])) or (0 * sum(rate(greptime_servers_http_requests_total{path=~\"$${db_route}\"}[$$__rate_interval])))) / sum(rate(greptime_servers_http_requests_total{path=~\"$${db_route}\"}[$$__rate_interval]))","range":true,"instant":false,"format":"time_series","legendFormat":"HTTP 5xx"}],"fieldConfig":{"defaults":{"noValue":"No data","unit":"percent","color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","lineWidth":1,"fillOpacity":8,"showPoints":"never","spanNulls":false}},"overrides":[]},"options":{"legend":{"showLegend":true,"displayMode":"table","placement":"bottom","calcs":["last"]},"tooltip":{"mode":"multi"}},"gridPos":{"x":12,"y":19,"w":12,"h":8}},
      {"id":23,"type":"timeseries","title":"Greptime API latency · p50 / p95 / p99","description":"Histogram estimates in seconds for the selected Greptime API paths. Default All mixes API routes; choose one path to investigate. Not Caddy first-byte, application DB/API spans or render timing. Empty histograms are not zero latency.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"histogram_quantile(0.5, sum by (le) (rate(greptime_servers_http_requests_elapsed_bucket{path=~\"$${db_route}\"}[$$__rate_interval])))","range":true,"instant":false,"format":"time_series","legendFormat":"p50"},{"refId":"B","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"histogram_quantile(0.95, sum by (le) (rate(greptime_servers_http_requests_elapsed_bucket{path=~\"$${db_route}\"}[$$__rate_interval])))","range":true,"instant":false,"format":"time_series","legendFormat":"p95"},{"refId":"C","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"histogram_quantile(0.99, sum by (le) (rate(greptime_servers_http_requests_elapsed_bucket{path=~\"$${db_route}\"}[$$__rate_interval])))","range":true,"instant":false,"format":"time_series","legendFormat":"p99"}],"fieldConfig":{"defaults":{"noValue":"No data","unit":"s","color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","lineWidth":1,"fillOpacity":8,"showPoints":"never","spanNulls":false}},"overrides":[]},"options":{"legend":{"showLegend":true,"displayMode":"table","placement":"bottom","calcs":["last"]},"tooltip":{"mode":"multi"}},"gridPos":{"x":0,"y":27,"w":12,"h":8}},
      {"id":24,"type":"table","title":"Greptime API path / method / status · requests/s","description":"Top 10 observed Greptime API path/method/status combinations at the selected range end. Shows 4xx separately from 5xx; not individual slow requests.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"topk(10, sum by (path,method,code) (rate(greptime_servers_http_requests_total{path=~\"$${db_route}\"}[$$__rate_interval])))","range":false,"instant":true,"format":"table","legendFormat":"{{path}} {{exporter}} {{receiver}}"}],"fieldConfig":{"defaults":{"noValue":"No data","custom":{"minWidth":60,"width":65}},"overrides":[{"matcher":{"id":"byName","options":"Value"},"properties":[{"id":"unit","value":"reqps"},{"id":"custom.width","value":95}]},{"matcher":{"id":"byName","options":"path"},"properties":[{"id":"custom.width","value":160}]},{"matcher":{"id":"byName","options":"code"},"properties":[{"id":"unit","value":"string"}]}]},"options":{"showHeader":true,"cellHeight":"sm"},"gridPos":{"x":12,"y":27,"w":12,"h":8},"transformations":[{"id":"organize","options":{"excludeByName":{"Time":true},"indexByName":{"path":0,"method":1,"code":2,"Value":3}}}]},
      {"id":25,"type":"timeseries","title":"OTel exporter queue utilization · %","description":"Queue occupancy/capacity by exporter. An empty queue does not prove delivery; compare receiver/exporter rates and failure signals. Absent metrics stay unknown.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"100 * sum by (exporter) (otelcol_exporter_queue_size{job=\"alloy\"}) / sum by (exporter) (otelcol_exporter_queue_capacity{job=\"alloy\"})","range":true,"instant":false,"format":"time_series","legendFormat":"{{exporter}}"}],"fieldConfig":{"defaults":{"noValue":"No data","unit":"percent","color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","lineWidth":1,"fillOpacity":8,"showPoints":"never","spanNulls":false}},"overrides":[]},"options":{"legend":{"showLegend":true,"displayMode":"table","placement":"bottom","calcs":["last"]},"tooltip":{"mode":"multi"}},"gridPos":{"x":0,"y":35,"w":12,"h":8}},
      {"id":26,"type":"timeseries","title":"OTel span flow · receiver stages / exporters","description":"Stages are separate, not summed: ingress and redacted-trace receivers may count the same span. Sender retries can also affect counters; not unique end-to-end delivered spans.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"sum by (receiver) (rate(otelcol_receiver_accepted_spans_total{job=\"alloy\"}[$$__rate_interval]))","range":true,"instant":false,"format":"time_series","legendFormat":"accepted {{receiver}}"},{"refId":"B","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"sum by (exporter) (rate(otelcol_exporter_sent_spans_total{job=\"alloy\"}[$$__rate_interval]))","legendFormat":"sent {{exporter}}","range":true,"instant":false}],"fieldConfig":{"defaults":{"noValue":"No data","unit":"ops","color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","lineWidth":1,"fillOpacity":8,"showPoints":"never","spanNulls":false}},"overrides":[]},"options":{"legend":{"showLegend":true,"displayMode":"table","placement":"bottom","calcs":["last"]},"tooltip":{"mode":"multi"}},"gridPos":{"x":12,"y":35,"w":12,"h":8}},
      {"id":27,"type":"timeseries","title":"Observed pipeline failures / second","description":"Refused/failed receiver spans and failed Prometheus samples are independently observed counters. Missing exporter failure counters are not fabricated as zero. Does not cover clients that never reach Alloy.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"sum by (receiver) (rate(otelcol_receiver_refused_spans_total{job=\"alloy\"}[$$__rate_interval]))","range":true,"instant":false,"format":"time_series","legendFormat":"refused {{receiver}}"},{"refId":"B","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"sum by (receiver) (rate(otelcol_receiver_failed_spans_total{job=\"alloy\"}[$$__rate_interval]))","legendFormat":"failed {{receiver}}","range":true,"instant":false},{"refId":"C","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"sum(rate(prometheus_remote_storage_samples_failed_total{job=\"alloy\"}[$$__rate_interval]))","legendFormat":"remote-write failed samples","range":true,"instant":false}],"fieldConfig":{"defaults":{"noValue":"No data","unit":"ops","color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","lineWidth":1,"fillOpacity":8,"showPoints":"never","spanNulls":false}},"overrides":[]},"options":{"legend":{"showLegend":true,"displayMode":"table","placement":"bottom","calcs":["last"]},"tooltip":{"mode":"multi"}},"gridPos":{"x":0,"y":43,"w":12,"h":8}},
      {"id":28,"type":"stat","title":"Storage measurement freshness / success","description":"Age since the last successful private object inventory, evaluated at the selected range end. Success=0 is a failed probe; missing is unknown. Filesystem and S3 probes are separate.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"time() - datalake_s3_inventory_timestamp_seconds{job=\"storage-metrics\"}","range":false,"instant":true,"format":"time_series","legendFormat":"S3 successful inventory age (seconds)"},{"refId":"B","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"datalake_s3_inventory_success{job=\"storage-metrics\"}","legendFormat":"S3 inventory success","instant":true,"format":"time_series"},{"refId":"C","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"datalake_local_storage_success{job=\"storage-metrics\"}","legendFormat":"Local storage probe success","instant":true,"format":"time_series"}],"fieldConfig":{"defaults":{"noValue":"No data","mappings":[{"type":"special","options":{"match":"null","result":{"text":"No data","color":"gray"}}}]},"overrides":[{"matcher":{"id":"byFrameRefID","options":"A"},"properties":[{"id":"unit","value":"s"}]},{"matcher":{"id":"byFrameRefID","options":"B"},"properties":[{"id":"mappings","value":[{"type":"value","options":{"0":{"text":"Failed"},"1":{"text":"Succeeded"}}}]}]},{"matcher":{"id":"byFrameRefID","options":"C"},"properties":[{"id":"mappings","value":[{"type":"value","options":{"0":{"text":"Failed"},"1":{"text":"Succeeded"}}}]}]}]},"options":{"colorMode":"none","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"auto","orientation":"vertical"},"gridPos":{"x":12,"y":43,"w":12,"h":8}},
      {"id":29,"type":"stat","title":"Actual local receive age · traces / Fleet / VSS","description":"Local collector receipt, not source event time or DB persistence ACK. Traces: accepted nonempty redacted batch since process start; Fleet: valid matching envelopes; VSS: broker updates/snapshots (deduplicated or unsupported updates still received). Absent is unknown. AI logs/metrics and Home true receipt timestamps are unavailable in the current schema; event freshness is not receipt.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"time() - fleet_last_receive_timestamp_seconds","legendFormat":"Fleet {{topic}} {{instance}}","range":false,"instant":true,"format":"time_series"},{"refId":"B","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"time() - vss_last_receive_timestamp_seconds","legendFormat":"VSS {{instance}}","range":false,"instant":true,"format":"time_series"},{"refId":"C","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"time() - datalake_trace_last_received_timestamp_seconds{job=\"trace-privacy\"}","legendFormat":"Traces {{client}} {{instance}}","range":false,"instant":true,"format":"time_series"}],"fieldConfig":{"defaults":{"noValue":"Unknown","unit":"s"},"overrides":[]},"options":{"colorMode":"none","graphMode":"none","reduceOptions":{"calcs":["last"],"fields":"","values":false},"textMode":"auto","orientation":"vertical"},"gridPos":{"x":0,"y":51,"w":12,"h":8}},
      {"id":30,"type":"stat","title":"Outbox oldest queue residence · seconds","description":"Queue residence uses MIN(ingest_time), not vehicle event age. Measured empty backlog is zero. Unreadable outbox emits no age; inspect the probe-success table below (0=unreadable). Absence is unknown; no zero filling.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"fleet_outbox_oldest_enqueue_age_seconds","legendFormat":"Fleet signals {{instance}}","range":false,"instant":true,"format":"time_series"},{"refId":"B","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"fleet_outbox_events_oldest_enqueue_age_seconds","legendFormat":"Fleet events {{instance}}","range":false,"instant":true,"format":"time_series"},{"refId":"C","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"vss_outbox_oldest_enqueue_age_seconds","legendFormat":"VSS {{instance}}","range":false,"instant":true,"format":"time_series"}],"fieldConfig":{"defaults":{"noValue":"Unknown","unit":"s"},"overrides":[]},"options":{"colorMode":"none","graphMode":"none","reduceOptions":{"calcs":["last"],"fields":"","values":false},"textMode":"auto","orientation":"vertical"},"gridPos":{"x":12,"y":51,"w":12,"h":8}},
      {"id":31,"type":"stat","title":"Aggregate execution freshness / vehicle data gap","description":"Last-success age measures completed job execution, NOT data lag. Vehicle gap is latest raw numeric sample minus latest completed 1m rollup end, per source, measured only when both exist. Observation age shows whether that gap measurement is fresh. Missing series stay unknown. Frontier gap is not per-path completeness or receipt/ACK lag. Last successful pass is SQL/orchestration completion, not proof of battery analytical validity; failed gap observation emits no samples.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"time() - datalake_aggregate_last_success_timestamp_seconds{job=\"storage-metrics\"}","legendFormat":"Last successful pass age","range":false,"instant":true,"format":"time_series"},{"refId":"B","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"datalake_aggregate_vehicle_window_lag_seconds{job=\"storage-metrics\"}","legendFormat":"Vehicle raw→rollup gap {{source}}","range":false,"instant":true,"format":"time_series"},{"refId":"C","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"time() - datalake_aggregate_vehicle_window_observation_timestamp_seconds{job=\"storage-metrics\"}","legendFormat":"Vehicle gap observation age","range":false,"instant":true,"format":"time_series"}],"fieldConfig":{"defaults":{"noValue":"Unknown","unit":"s"},"overrides":[]},"options":{"colorMode":"none","graphMode":"none","reduceOptions":{"calcs":["last"],"fields":"","values":false},"textMode":"auto","orientation":"vertical"},"gridPos":{"x":0,"y":59,"w":12,"h":8}},
      {"id":32,"type":"stat","title":"Last offline restore verification age","description":"Age since a successful offline backup SHA/content restore verification. This does NOT prove database restart, queryability or recoverable application state. Missing timestamp is unknown, never zero; see verification-known flag below.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"time() - datalake_restore_verification_timestamp_seconds{job=\"storage-metrics\"}","legendFormat":"Offline verification age","range":false,"instant":true,"format":"time_series"}],"fieldConfig":{"defaults":{"noValue":"Unknown","unit":"s"},"overrides":[]},"options":{"colorMode":"none","graphMode":"none","reduceOptions":{"calcs":["last"],"fields":"","values":false},"textMode":"auto","orientation":"vertical"},"gridPos":{"x":12,"y":59,"w":12,"h":8}},
      {"id":33,"type":"table","title":"Operational probe / pass state","description":"Outbox metrics_success=0 means unreadable, not empty. *_known=0 means no readable persisted status, not healthy. Aggregate success is last completed pass (1 success / 0 failure; absent before completion), running is current pass state, interval is configured seconds, status timestamp is last atomic update. Check freshness above before interpreting a retained status.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","datasource":{"type":"prometheus","uid":"greptime-prom"},"expr":"{__name__=~\"fleet_outbox_metrics_success|vss_outbox_metrics_success|datalake_aggregate_status_known|datalake_aggregate_vehicle_window_observation_success|datalake_aggregate_success|datalake_aggregate_running|datalake_aggregate_interval_seconds|datalake_aggregate_status_timestamp_seconds|datalake_restore_verification_known\"}","legendFormat":"State","range":false,"instant":true,"format":"table"}],"fieldConfig":{"defaults":{"noValue":"Unknown"},"overrides":[]},"options":{"showHeader":true,"cellHeight":"sm"},"gridPos":{"x":0,"y":67,"w":24,"h":6}},
      {"id":40,"type":"row","title":"Detailed metrics and optional input diagnostics","collapsed":true,"panels":[{"id":3,"type":"stat","title":"Last OTel span · all retained data","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT CAST(MAX(timestamp) AS TIMESTAMP(6)) AS last_span FROM opentelemetry_traces","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"dateTimeAsIso","noValue":"No data"},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"/.*/","values":false},"orientation":"auto","textMode":"auto","colorMode":"none"},"gridPos":{"x":0,"y":74,"w":12,"h":9}},{"id":4,"type":"stat","title":"Last vehicle sample · all retained data","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT CAST(MAX(event_time) AS TIMESTAMP(6)) AS last_sample FROM vehicle_signal","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"dateTimeAsIso","noValue":"No data"},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"/.*/","values":false},"orientation":"auto","textMode":"auto","colorMode":"none"},"gridPos":{"x":12,"y":74,"w":12,"h":9}},{"id":5,"type":"table","title":"Last span per coding client (silence = missing, not zero)","description":"Explicit client wins, then Codex namespace or verified native service aliases. Arbitrary service names remain provenance, not client identity. Retransmitted spans are deduplicated by trace/span ID. Only the final 48h of the selected range are scanned.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT client, COUNT(*) AS spans, CAST(MAX(ts) AS TIMESTAMP(6)) AS last_seen FROM (SELECT DISTINCT trace_id, span_id, COALESCE(NULLIF(`span_attributes.coding_agent.client`, ''), NULLIF(`span_attributes.client`, ''), CASE WHEN span_name LIKE 'codex.%' THEN 'codex' WHEN service_name IN ('claude-code','claude-code-desktop') THEN 'claude-code' WHEN service_name='oh-my-pi' THEN 'oh-my-pi' ELSE 'unknown' END) AS client, timestamp AS ts FROM opentelemetry_traces WHERE $$__timeFilter(timestamp) AND timestamp >= FROM_UNIXTIME($$__unixEpochTo() - 172800)) AS dedup GROUP BY client ORDER BY last_seen DESC","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"x":0,"y":83,"w":12,"h":9}},{"id":6,"type":"table","title":"Last native log per client (log_attributes JSON; silence = missing)","description":"Canonical client selection matches aggregation: explicit client, Codex namespace, verified Claude/OMP service names, else unknown. Missing logs mean absence, not zero activity. Only the final 48h of the selected range are scanned.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT COALESCE(NULLIF(json_get_string(log_attributes, '$[\"coding_agent.client\"]'), ''), NULLIF(json_get_string(log_attributes, '$[\"client\"]'), ''), NULLIF(json_get_string(resource_attributes, '$[\"coding_agent.client\"]'), ''), NULLIF(json_get_string(resource_attributes, '$[\"client\"]'), ''), CASE WHEN json_get_string(log_attributes, '$[\"event.name\"]') LIKE 'codex.%' THEN 'codex' WHEN json_get_string(resource_attributes, '$[\"service.name\"]') IN ('claude-code','claude-code-desktop') THEN 'claude-code' WHEN json_get_string(resource_attributes, '$[\"service.name\"]')='oh-my-pi' THEN 'oh-my-pi' ELSE 'unknown' END) AS client, COUNT(*) AS logs, CAST(MAX(timestamp) AS TIMESTAMP(6)) AS last_seen FROM opentelemetry_logs WHERE $$__timeFilter(timestamp) AND timestamp >= FROM_UNIXTIME($$__unixEpochTo() - 172800) GROUP BY client ORDER BY last_seen DESC","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"x":12,"y":83,"w":12,"h":9}},{"id":7,"type":"table","title":"Collector backlog/drops/uploads (Prom instant; vehicle scrape opt-in)","description":"Verbatim series from scripts/raw_recorder.py (:9102), scripts/raw_upload.py (:9103) and scripts/vss_recorder.py (:9104) via VEHICLE_METRICS_TARGETS (default empty = no scrape). raw_recorder_dropped = CAN drops; spool/pending = local backlog; last_finalize/last_upload = MF4 freshness (epoch seconds). Missing means not configured (absence), never zero.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","expr":"{__name__=~\"raw_recorder_dropped|raw_recorder_spool_files|raw_recorder_spool_bytes|raw_recorder_finalize_errors|raw_recorder_quarantined|raw_recorder_last_finalize|raw_uploader_pending_files|raw_uploader_pending_bytes|raw_uploader_failed|raw_uploader_dropped_verify|raw_uploader_last_upload|vss_outbox_pending_rows|vss_outbox_oldest_event_time_ns|vss_stored_rows_total|vss_uploaded_rows_total|vss_upload_failures_total|vss_stream_gaps_total|vss_unsupported_values_total|vss_snapshot_deduped_total\",job=~\"vehicle-raw-recorder|vehicle-raw-uploader|vss-recorder\"}","format":"table","instant":true,"datasource":{"type":"prometheus","uid":"greptime-prom"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"x":0,"y":92,"w":12,"h":9}},{"id":8,"type":"table","title":"Telegraf buffer (Prom instant; mqtt opt-in)","description":"Telegraf internal metrics; absence means no configured scrape. MQTT tracking records are reacquired from the broker after restart, not independently replayed by this disk buffer. Use publisher QoS1, broker persistence and unchanged client ID; at-least-once may duplicate arrivals.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","expr":"{__name__=~\"internal_.*\",job=\"telegraf\"}","format":"table","instant":true,"datasource":{"type":"prometheus","uid":"greptime-prom"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"x":12,"y":92,"w":12,"h":9}},{"id":9,"type":"table","title":"OTel queues and export delivery","description":"Alloy self-scrape: queue size/capacity, in-flight requests and sent/failed counters. Failure counters may be absent until exercised; absence is not a measured zero.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","expr":"{__name__=~\"otelcol_exporter_(queue_size|queue_capacity|in_flight_requests|sent_.*|send_failed_.*|enqueue_failed_.*)\",job=\"alloy\"}","format":"table","instant":true,"datasource":{"type":"prometheus","uid":"greptime-prom"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"x":0,"y":101,"w":12,"h":9}},{"id":10,"type":"table","title":"Local disk capacity and Greptime WAL bytes","description":"Read-only measurement of the filesystem containing greptime-data and logical files under its wal directory. Filesystem used/free includes other volumes sharing that filesystem; it is not a Greptime-only data-size estimate. Failed measurement emits success=0 without fake sizes.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","expr":"{__name__=~\"datalake_disk_.*|datalake_wal_bytes|datalake_local_storage_success\",job=\"storage-metrics\"}","format":"table","instant":true,"datasource":{"type":"prometheus","uid":"greptime-prom"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"x":12,"y":101,"w":12,"h":9}},{"id":11,"type":"table","title":"Private object-store inventories","description":"Actual whole-bucket bytes/object counts, not uploaded-byte counters. Greptime and Raw use separate restricted keys. Last-success timestamps are epoch seconds; success=0 retains stale totals, while File mode disables only S3 inventory. Default inventory cadence is one hour.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","expr":"{__name__=~\"datalake_s3_.*|raw_uploader_bucket_.*|raw_uploader_inventory_.*\",job=~\"storage-metrics|vehicle-raw-uploader\"}","format":"table","instant":true,"datasource":{"type":"prometheus","uid":"greptime-prom"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"x":0,"y":110,"w":12,"h":9}},{"id":12,"type":"table","title":"DBC validation / firmware health","description":"Sealed-chunk validation using the immutable epoch DBCs. Optional rule families remain absent until configured; consult configured and last-success metrics.","datasource":{"type":"prometheus","uid":"greptime-prom"},"targets":[{"refId":"A","expr":"{__name__=~\"can_validation_.*\",job=\"vehicle-raw-recorder\"}","format":"table","instant":true,"datasource":{"type":"prometheus","uid":"greptime-prom"}}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"showHeader":true},"gridPos":{"x":12,"y":110,"w":12,"h":9}}],"gridPos":{"x":0,"y":73,"w":24,"h":1}}
      ]}
  grafana-dash-battery:
    content: |
      {"uid":"datalake-vehicle-battery","title":"배터리 모니터","tags":["datalake","vehicle"],"timezone":"Asia/Seoul","schemaVersion":39,"version":11,"time":{"from":"now-2d","to":"now"},"description":"잔량·전력·충전 상태, 셀 전압(최고/최저), 온도, 에너지 사용·충전, 건강도 추정을 한 화면에서 확인합니다. 데이터 없음은 정상 판정이 아닙니다. 상세 근거는 맨 아래 펼침 항목에 있습니다.","links":[{"title":"차량 개요","type":"link","url":"/d/datalake-vehicle-overview","includeVars":false,"keepTime":true,"targetBlank":false},{"title":"충전","type":"link","url":"/d/datalake-vehicle-charging","includeVars":false,"keepTime":true,"targetBlank":false},{"title":"주행","type":"link","url":"/d/datalake-vehicle-drives","includeVars":false,"keepTime":true,"targetBlank":false},{"title":"수집 진단 · CAN/VSS","type":"link","url":"/d/datalake-vehicle-can-vss","includeVars":false,"keepTime":true,"targetBlank":false},{"title":"수집 진단 · DBC","type":"link","url":"/d/datalake-vehicle-dbc-health","includeVars":false,"keepTime":true,"targetBlank":false}],"templating":{"list":[{"name":"vehicle","type":"query","label":"차량","query":"SELECT DISTINCT vehicle FROM vehicle_signal UNION SELECT DISTINCT vehicle FROM vehicle_analysis ORDER BY vehicle","current":{},"description":"확인할 차량을 선택하세요. 서로 다른 차량의 값은 합산하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"refresh":1,"sort":1,"options":[],"includeAll":false,"multi":false},{"name":"source","type":"query","label":"수집 경로","query":"SELECT '' AS __value, '전체' AS __text UNION SELECT DISTINCT source AS __value, source AS __text FROM vehicle_signal WHERE ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) ORDER BY __value","current":{"text":"전체","value":""},"description":"Exact match; can and fleet are never merged.","hide":0,"datasource":{"type":"mysql","uid":"greptime-mysql"},"options":[],"refresh":1,"includeAll":false,"multi":false},{"name":"epoch","type":"query","label":"해석 버전","query":"SELECT '' AS __value, '전체' AS __text UNION SELECT DISTINCT COALESCE(decode_epoch, '') AS __value, COALESCE(decode_epoch, '') AS __text FROM vehicle_signal WHERE ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) ORDER BY __value","current":{"text":"전체","value":""},"description":"Exact match; blank includes all epochs as separate scopes.","hide":0,"datasource":{"type":"mysql","uid":"greptime-mysql"},"options":[],"refresh":1,"includeAll":false,"multi":false},{"name":"metric","type":"textbox","label":"상세 그래프 지표","query":"battery.electrical.soc_ekf_pct","current":{"text":"battery.electrical.soc_ekf_pct","value":"battery.electrical.soc_ekf_pct"},"description":"Exact metric name for the selected-metric history panel.","hide":2},{"name":"status","type":"textbox","label":"상세 결과 상태","query":"","current":{"text":"","value":""},"description":"Exact match on reported, derived, estimated, unavailable, error; blank shows the true latest whatever its status.","hide":2}]},"panels":[
      {"id":1,"type":"text","title":"","transparent":true,"fieldConfig":{"defaults":{},"overrides":[]},"options":{"mode":"markdown","content":"**배터리 한눈에 보기** · 값은 차량이 마지막으로 보낸 기록입니다. 실시간이 아닐 수 있으니 오른쪽 위 **마지막 수신**을 먼저 확인하세요. `판단 불가`·`기록 없음`은 정상이라는 뜻이 아닙니다. 차량 화면의 경고가 항상 우선이며, 카드 제목의 ⓘ에 계산 조건이 있습니다.\n\n**CAN은 미검증 보고값입니다.** 선택 기간의 관측 기록이며 현재 차량 상태나 건강 판정이 아닙니다. 아래 관측 시각과 DB 수신 시각을 구분하세요. CAN 기어·충전 상태는 DBC enum을 표시하며 충전 허용을 실제 충전 중으로 단정하지 않습니다. 대응 신호가 없는 온도·셀 번호와 검증되지 않은 전력·에너지 계산은 판단 불가로 남습니다."},"gridPos":{"x":0,"y":0,"w":24,"h":3}},
      {"id":91,"type":"table","title":"CAN 보고값 · 관측 시각과 DB 수신 시각","description":"선택 기간의 신호별 최신 원본 보고값입니다. invalid/unknown_enum과 원본 단위를 그대로 보여주며 건강 판정으로 사용하지 않습니다. 최신 무효 보고도 숨기지 않습니다. 차량 식별자는 자동으로 합치지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, source_field ORDER BY event_time DESC, ingest_time DESC, envelope_id DESC) AS latest_rank FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND ((source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socUI' AND source_field = 'BMS_socUI') OR (source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socAvg' AND source_field = 'BMS_socAvg') OR (source = 'can' AND path = 'Vehicle.CAN.x352.BMS_nominalEnergyRemaining' AND source_field = 'BMS_nominalEnergyRemaining') OR (source = 'can' AND path = 'Vehicle.CAN.x118.DI_gear' AND source_field = 'DI_gear') OR (source = 'can' AND path = 'Vehicle.CAN.x13D.CP_hvChargeStatus' AND source_field = 'CP_hvChargeStatus') OR (source = 'can' AND path = 'Vehicle.CAN.x20C.VCRIGHT_tempAmbientRaw' AND source_field = 'VCRIGHT_tempAmbientRaw') OR (source = 'can' AND path = 'Vehicle.CAN.x332.BMS_brickVoltageMax' AND source_field = 'BMS_brickVoltageMax') OR (source = 'can' AND path = 'Vehicle.CAN.x332.BMS_brickVoltageMin' AND source_field = 'BMS_brickVoltageMin') OR (source = 'can' AND path = 'Vehicle.CAN.x257.DI_vehicleSpeed' AND source_field = 'DI_vehicleSpeed') OR (source = 'can' AND path = 'Vehicle.CAN.x132.BMS_packVoltage' AND source_field = 'BMS_packVoltage') OR (source = 'can' AND path = 'Vehicle.CAN.x132.BMS_packCurrent' AND source_field = 'BMS_packCurrent'))) SELECT vehicle AS `차량`, source AS `수집원`, decode_epoch AS `해석 버전`, source_field AS `원본 신호`, value_num AS `숫자 보고값`, value_text AS `상태 보고값`, unit AS `원본 단위`, quality AS `품질`, CAST(event_time AS TIMESTAMP(6)) AS `관측 시각`, CAST(ingest_time AS TIMESTAMP(6)) AS `DB 수신 시각` FROM latest WHERE latest_rank = 1 ORDER BY vehicle, source, decode_epoch, source_field","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음"},"overrides":[{"matcher":{"id":"byName","options":"관측 시각"},"properties":[{"id":"unit","value":"dateTimeAsIso"}]},{"matcher":{"id":"byName","options":"DB 수신 시각"},"properties":[{"id":"unit","value":"dateTimeAsIso"}]}]},"options":{"showHeader":true},"gridPos":{"x":0,"y":3,"w":24,"h":5}},
      {"id":25,"type":"gauge","title":"배터리 잔량 · 보고값","description":"차량 화면에 표시되는 잔량(BatteryLevel)입니다. 색은 10%·20% 이하일 때 바뀌며 배터리 상태 판정이 아닙니다. 차량이 표시하는 BatteryLevel입니다. 물리 SOC나 추정 SOC와 다를 수 있습니다. 선택 기간의 가장 최근 보고값이며, 최신 값이 무효이면 과거 값으로 대체하지 않습니다. 개별 값의 관측 시각과 차량 식별자는 아래 분석 기록에서 확인할 수 있습니다. CAN 대응: BMS_socUI의 미검증 보고값입니다. 관측 시각은 위 CAN 보고값 표를 확인하세요. 단위 불일치·최신 무효 값은 과거 정상 값으로 대체하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH signals AS (SELECT event_time, vehicle, source, decode_epoch, ingest_time, envelope_id, value_num, value_text, value_bool, path AS path, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socUI' AND source_field = 'BMS_socUI' THEN 'BatteryLevel' ELSE source_field END AS source_field, unit AS unit, quality, (quality = 'reported_unverified' AND ((source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socUI' AND source_field = 'BMS_socUI'))) AS can_report FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, source_field ORDER BY event_time DESC, ingest_time DESC, envelope_id DESC) AS latest_rank FROM signals WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field = 'BatteryLevel') SELECT vehicle, source, decode_epoch, CAST(event_time AS TIMESTAMP(6)) AS observed_at, CASE WHEN unit = '%' AND (quality IS NULL OR quality = 'ok' OR can_report) THEN value_num ELSE NULL END AS reading FROM latest WHERE latest_rank = 1 ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"percent","decimals":0,"noValue":"판단 불가","color":{"mode":"thresholds"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"판단 불가","color":"#6E7681","index":0}}}],"min":0,"max":100,"thresholds":{"mode":"absolute","steps":[{"value":null,"color":"#E02F44"},{"value":10,"color":"#FF9830"},{"value":20,"color":"#56A64B"}]}},"overrides":[{"matcher":{"id":"byName","options":"observed_at"},"properties":[{"id":"unit","value":"dateTimeAsIso"}]}]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":true},"orientation":"auto","showThresholdLabels":false,"showThresholdMarkers":false,"sizing":"auto","minVizHeight":75,"minVizWidth":75,"text":{"valueSize":44}},"gridPos":{"x":0,"y":8,"w":6,"h":8}},
      {"id":41,"type":"stat","title":"남은 에너지 · 보고값","description":"차량 BMS가 보고한 남은 에너지(EnergyRemaining, kWh)의 가장 최근 값입니다. 최신 값이 무효이면 과거 값으로 대체하지 않습니다. CAN 대응: BMS_nominalEnergyRemaining의 미검증 보고값입니다. 관측 시각은 위 CAN 보고값 표를 확인하세요. 단위 불일치·최신 무효 값은 과거 정상 값으로 대체하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH signals AS (SELECT event_time, vehicle, source, decode_epoch, ingest_time, envelope_id, value_num, value_text, value_bool, path AS path, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x352.BMS_nominalEnergyRemaining' AND source_field = 'BMS_nominalEnergyRemaining' THEN 'EnergyRemaining' ELSE source_field END AS source_field, unit AS unit, quality, (quality = 'reported_unverified' AND ((source = 'can' AND path = 'Vehicle.CAN.x352.BMS_nominalEnergyRemaining' AND source_field = 'BMS_nominalEnergyRemaining'))) AS can_report FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, source_field ORDER BY event_time DESC, ingest_time DESC, envelope_id DESC) AS latest_rank FROM signals WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field IN ('EnergyRemaining')) SELECT vehicle, source, decode_epoch, MAX(CASE WHEN unit = 'kWh' AND (quality IS NULL OR quality = 'ok' OR can_report) THEN value_num END) AS reading FROM latest WHERE latest_rank = 1 GROUP BY vehicle, source, decode_epoch ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"kwatth","noValue":"기록 없음","color":{"mode":"fixed","fixedColor":"#3274D9"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"기록 없음","color":"#6E7681","index":0}}}]},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":true},"text":{"valueSize":34,"titleSize":12}},"gridPos":{"x":6,"y":8,"w":5,"h":4}},
      {"id":42,"type":"stat","title":"최근 완료 구간 배터리 전력","description":"시간별 분석이 완료된 가장 최근 구간의 마지막 동시 팩 전압·전류 관측입니다. 실시간 전력이 아닙니다. 정확한 차량·수집원·해석 버전의 단위 교정(scale/offset)과 current_sign을 적용하며 + 충전 / − 사용입니다. 최신 무효·단위 미확인·시각 불일치·구간 끝에서 max_gap_ns 초과는 판단 불가이고, 더 최근의 미분석 원시 입력도 과거 값으로 대체하지 않습니다. 관측 시각은 분석 기록의 value_text에 UTC로 남습니다. 선택 기간 끝의 바로 전 완료 시간 구간이 없으면 과거 구간 숫자를 표시하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND `metric` = 'battery.energy.latest_power_kw'), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric` ORDER BY window_start DESC, computed_at DESC, revision DESC) AS latest_rank FROM revisions WHERE revision_rank = 1), raw_frontier AS (SELECT vehicle, source, decode_epoch, MAX(event_time) AS raw_event_time, MAX(ingest_time) AS raw_ingest_time FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field IN ('PackVoltage', 'PackCurrent') GROUP BY vehicle, source, decode_epoch) SELECT latest.vehicle, latest.source, latest.decode_epoch, CAST(latest.value_text AS TIMESTAMP(6)) AS observed_at, CASE WHEN latest.window_end >= FROM_UNIXTIME(CAST(FLOOR($$__unixEpochTo() / 3600) * 3600 - 1 AS BIGINT)) AND latest.status = 'derived' AND latest.unit = 'kW' AND latest.value_text IS NOT NULL AND (raw.raw_event_time IS NULL OR raw.raw_event_time <= CAST(latest.value_text AS TIMESTAMP(6))) AND (raw.raw_ingest_time IS NULL OR raw.raw_ingest_time <= latest.computed_at) THEN latest.`value` ELSE NULL END AS reading FROM latest LEFT JOIN raw_frontier raw ON raw.vehicle = latest.vehicle AND raw.source = latest.source AND COALESCE(raw.decode_epoch, '') = COALESCE(latest.decode_epoch, '') WHERE latest.latest_rank = 1 ORDER BY latest.vehicle, latest.source, latest.decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"kwatt","noValue":"기록 없음","color":{"mode":"thresholds"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"판단 불가","color":"#6E7681","index":0}}}],"decimals":1,"thresholds":{"mode":"absolute","steps":[{"value":null,"color":"#3274D9"},{"value":-0.5,"color":"#6E7681"},{"value":0.5,"color":"#56A64B"}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"/^reading$/","values":true},"text":{"valueSize":34,"titleSize":12}},"gridPos":{"x":11,"y":8,"w":5,"h":4}},
      {"id":43,"type":"stat","title":"충전 상태 · 보고값","description":"가장 최근 충전 상태(DetailedChargeState)입니다. CAN 대응: CP_hvChargeStatus의 미검증 보고값입니다. 관측 시각은 위 CAN 보고값 표를 확인하세요. 단위 불일치·최신 무효 값은 과거 정상 값으로 대체하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH signals AS (SELECT event_time, vehicle, source, decode_epoch, ingest_time, envelope_id, value_num, value_text, value_bool, path AS path, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x13D.CP_hvChargeStatus' AND source_field = 'CP_hvChargeStatus' THEN 'DetailedChargeState' ELSE source_field END AS source_field, unit AS unit, quality, (quality = 'reported_unverified' AND ((source = 'can' AND path = 'Vehicle.CAN.x13D.CP_hvChargeStatus' AND source_field = 'CP_hvChargeStatus'))) AS can_report FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, source_field ORDER BY event_time DESC, ingest_time DESC, envelope_id DESC) AS latest_rank FROM signals WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field IN ('DetailedChargeState')) SELECT vehicle, source, decode_epoch, MAX(CASE WHEN source_field = 'DetailedChargeState' AND (quality IS NULL OR quality = 'ok' OR can_report) AND (source <> 'can' OR value_text IN ('CP_CHARGE_INACTIVE', 'CP_CHARGE_CONNECTED', 'CP_CHARGE_STANDBY', 'CP_EXT_EVSE_TEST_ACTIVE', 'CP_EVSE_TEST_PASSED', 'CP_CHARGE_ENABLED', 'CP_CHARGE_FAULTED')) THEN value_text END) AS reading FROM latest WHERE latest_rank = 1 GROUP BY vehicle, source, decode_epoch ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"none","noValue":"기록 없음","color":{"mode":"thresholds"},"mappings":[{"type":"value","options":{"DetailedChargeStateDisconnected":{"text":"케이블 분리","color":"#5E6A7A","index":0},"DetailedChargeStateNoPower":{"text":"전원 없음","color":"#FF9830","index":1},"DetailedChargeStateStarting":{"text":"충전 시작","color":"#96D98D","index":2},"DetailedChargeStateCharging":{"text":"충전 중","color":"#56A64B","index":3},"DetailedChargeStateStopped":{"text":"충전 멈춤","color":"#F2CC0C","index":4},"DetailedChargeStateComplete":{"text":"충전 완료","color":"#5794F2","index":5},"CP_CHARGE_INACTIVE":{"text":"비활성 · CAN 미검증","color":"#FF9830","index":6},"CP_CHARGE_CONNECTED":{"text":"연결됨 · CAN 미검증","color":"#FF9830","index":7},"CP_CHARGE_STANDBY":{"text":"대기 · CAN 미검증","color":"#FF9830","index":8},"CP_EXT_EVSE_TEST_ACTIVE":{"text":"외부 EVSE 시험 중 · CAN 미검증","color":"#FF9830","index":9},"CP_EVSE_TEST_PASSED":{"text":"EVSE 시험 통과 · CAN 미검증","color":"#FF9830","index":10},"CP_CHARGE_ENABLED":{"text":"충전 허용 · CAN 미검증","color":"#FF9830","index":11},"CP_CHARGE_FAULTED":{"text":"충전 오류 보고 · CAN 미검증","color":"#FF9830","index":12}}},{"type":"special","options":{"match":"null","result":{"text":"판단 불가","color":"#6E7681","index":0}}}],"thresholds":{"mode":"absolute","steps":[{"value":null,"color":"#6E7681"}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"/^reading$/","values":true},"text":{"valueSize":26,"titleSize":12}},"gridPos":{"x":16,"y":8,"w":4,"h":4}},
      {"id":24,"type":"stat","title":"마지막 관측","description":"원본 event_time 기준 마지막 관측 시각입니다(기간 필터와 무관). DB 수신 시각이나 현재 상태가 아닙니다. CAN 원본 보고값 표에서 각각의 관측 시각을 확인하세요.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT vehicle, source, decode_epoch, CAST(MAX(event_time) AS BIGINT) / 1000000 AS reading FROM vehicle_signal WHERE ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) GROUP BY vehicle, source, decode_epoch ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"dateTimeFromNow","decimals":2,"noValue":"수신 기록 없음","color":{"mode":"fixed","fixedColor":"#6E7681"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"수신 기록 없음","color":"#6E7681","index":0}}}]},"overrides":[]},"options":{"colorMode":"value","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":true},"text":{"valueSize":24,"titleSize":12}},"gridPos":{"x":20,"y":8,"w":4,"h":4}},
      {"id":26,"type":"stat","title":"BMS 잔량 · 보고값","description":"배터리 관리 장치가 보고하는 Soc입니다. 차량 표시 잔량과 별도 항목입니다. % 단위가 확인된 유효 보고만 표시합니다. 개별 값의 관측 시각과 차량 식별자는 아래 분석 기록에서 확인할 수 있습니다. CAN 대응: BMS_socAvg의 미검증 보고값입니다. 관측 시각은 위 CAN 보고값 표를 확인하세요. 단위 불일치·최신 무효 값은 과거 정상 값으로 대체하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH signals AS (SELECT event_time, vehicle, source, decode_epoch, ingest_time, envelope_id, value_num, value_text, value_bool, path AS path, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socAvg' AND source_field = 'BMS_socAvg' THEN 'Soc' ELSE source_field END AS source_field, unit AS unit, quality, (quality = 'reported_unverified' AND ((source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socAvg' AND source_field = 'BMS_socAvg'))) AS can_report FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, source_field ORDER BY event_time DESC, ingest_time DESC, envelope_id DESC) AS latest_rank FROM signals WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field = 'Soc') SELECT vehicle, source, decode_epoch, CAST(event_time AS TIMESTAMP(6)) AS observed_at, CASE WHEN unit = '%' AND (quality IS NULL OR quality = 'ok' OR can_report) THEN value_num ELSE NULL END AS reading FROM latest WHERE latest_rank = 1 ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"percent","decimals":1,"noValue":"판단 불가","color":{"mode":"fixed",