      {"id":55,"type":"timeseries","title":"잔량 변화","description":"차량 표시 잔량과 BMS 잔량을 구간 평균으로 표시합니다. 두 값은 서로 다른 항목입니다. CAN 대응: BMS_socUI, BMS_socAvg의 미검증 보고값입니다. 관측 시각은 위 CAN 보고값 표를 확인하세요. 단위 불일치·최신 무효 값은 과거 정상 값으로 대체하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"interval":"5m","targets":[{"refId":"A","format":"time_series","rawSql":"WITH signals AS (SELECT event_time, vehicle, source, decode_epoch, ingest_time, envelope_id, value_num, value_text, value_bool, path AS path, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socUI' AND source_field = 'BMS_socUI' THEN 'BatteryLevel' WHEN source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socAvg' AND source_field = 'BMS_socAvg' THEN 'Soc' ELSE source_field END AS source_field, unit AS unit, quality, (quality = 'reported_unverified' AND ((source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socUI' AND source_field = 'BMS_socUI') OR (source = 'can' AND path = 'Vehicle.CAN.x292.BMS_socAvg' AND source_field = 'BMS_socAvg'))) AS can_report FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT CAST(date_bin(INTERVAL $$__interval_ms MILLISECOND, event_time) AS TIMESTAMP(6)) AS `time`, CONCAT(CASE source_field WHEN 'BatteryLevel' THEN '차량 표시 잔량' WHEN 'Soc' THEN 'BMS 잔량' END, CASE WHEN source = 'fleet' AND decode_epoch = 'fleet-v1' THEN '' ELSE CONCAT(' · ', source, '/', COALESCE(decode_epoch, '')) END) AS `metric`, CASE source_field WHEN 'BatteryLevel' THEN AVG(value_num) WHEN 'Soc' THEN AVG(value_num) END AS `value` FROM signals WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field IN ('BatteryLevel', 'Soc') AND value_num IS NOT NULL AND (quality IS NULL OR quality = 'ok' OR can_report) GROUP BY 1, source, decode_epoch, source_field ORDER BY 1","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"percent","noValue":"기록 없음","custom":{"drawStyle":"line","lineInterpolation":"smooth","lineWidth":2,"fillOpacity":10,"gradientMode":"opacity","showPoints":"never","spanNulls":false,"axisBorderShow":false,"axisPlacement":"auto","barAlignment":0,"barWidthFactor":0.8,"pointSize":4,"stacking":{"mode":"none","group":"A"},"thresholdsStyle":{"mode":"off"}},"color":{"mode":"palette-classic"},"decimals":0,"min":0,"max":100},"overrides":[{"matcher":{"id":"byName","options":"차량 표시 잔량"},"properties":[{"id":"color","value":{"mode":"fixed","fixedColor":"#56A64B"}}]},{"matcher":{"id":"byName","options":"BMS 잔량"},"properties":[{"id":"color","value":{"mode":"fixed","fixedColor":"#3274D9"}}]}]},"options":{"legend":{"displayMode":"list","placement":"bottom","showLegend":true,"calcs":[]},"tooltip":{"mode":"multi","sort":"desc"}},"gridPos":{"x":0,"y":52,"w":12,"h":8}},
      {"id":56,"type":"timeseries","title":"시간별 마지막 교정 전력 (+ 충전 / − 사용)","description":"각 완료된 시간 구간의 마지막 동시 교정 샘플(kW)입니다. 시간 평균·kWh·실시간 전력이 아닙니다. x축은 실제 관측 시각(UTC 저장, 대시보드 시간대 표시)입니다. 최신 invalid/unmatched/stale 결과는 NULL이며 구간별 최신 리비전이 이전 정상 값을 덮습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"interval":"1h","targets":[{"refId":"A","format":"time_series","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND `metric` = 'battery.energy.latest_power_kw') SELECT CAST(value_text AS TIMESTAMP(6)) AS `time`, CONCAT(vehicle, ' · ', source, '/', COALESCE(decode_epoch, '')) AS `metric`, CASE WHEN status = 'derived' AND unit = 'kW' THEN `value` ELSE NULL END AS `value` FROM revisions WHERE revision_rank = 1 AND value_text IS NOT NULL ORDER BY 1","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"kwatt","noValue":"기록 없음","custom":{"drawStyle":"points","lineInterpolation":"linear","lineWidth":2,"fillOpacity":0,"gradientMode":"scheme","showPoints":"always","spanNulls":false,"axisBorderShow":false,"axisPlacement":"auto","barAlignment":0,"barWidthFactor":0.8,"pointSize":4,"stacking":{"mode":"none","group":"A"},"thresholdsStyle":{"mode":"off"}},"color":{"mode":"thresholds"},"decimals":1,"thresholds":{"mode":"absolute","steps":[{"value":null,"color":"#3274D9"},{"value":0,"color":"#56A64B"}]}},"overrides":[]},"options":{"legend":{"displayMode":"list","placement":"bottom","showLegend":true,"calcs":[]},"tooltip":{"mode":"multi","sort":"desc"}},"gridPos":{"x":12,"y":52,"w":12,"h":8}},
      {"id":57,"type":"state-timeline","title":"충전 상태 기록","description":"충전 케이블·충전 진행 상태 변화입니다. CAN 대응: CP_hvChargeStatus의 미검증 보고값입니다. 관측 시각은 위 CAN 보고값 표를 확인하세요. 단위 불일치·최신 무효 값은 과거 정상 값으로 대체하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH signals AS (SELECT event_time, vehicle, source, decode_epoch, ingest_time, envelope_id, value_num, value_text, value_bool, path AS path, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x13D.CP_hvChargeStatus' AND source_field = 'CP_hvChargeStatus' THEN 'DetailedChargeState' ELSE source_field END AS source_field, unit AS unit, quality, (quality = 'reported_unverified' AND ((source = 'can' AND path = 'Vehicle.CAN.x13D.CP_hvChargeStatus' AND source_field = 'CP_hvChargeStatus'))) AS can_report FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT CAST(event_time AS TIMESTAMP(6)) AS `time`, CONCAT(vehicle, ' · ', source, '/', COALESCE(decode_epoch, '')) AS series, CASE WHEN (quality IS NULL OR quality = 'ok' OR can_report) AND (source <> 'can' OR value_text IN ('CP_CHARGE_INACTIVE', 'CP_CHARGE_CONNECTED', 'CP_CHARGE_STANDBY', 'CP_EXT_EVSE_TEST_ACTIVE', 'CP_EVSE_TEST_PASSED', 'CP_CHARGE_ENABLED', 'CP_CHARGE_FAULTED')) THEN value_text ELSE NULL END AS `충전` FROM signals WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field = 'DetailedChargeState' ORDER BY event_time, ingest_time, envelope_id","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음","mappings":[{"type":"value","options":{"DetailedChargeStateDisconnected":{"text":"분리","color":"#5E6A7A","index":0},"DetailedChargeStateNoPower":{"text":"전원 없음","color":"#FF9830","index":1},"DetailedChargeStateStarting":{"text":"시작","color":"#96D98D","index":2},"DetailedChargeStateCharging":{"text":"충전","color":"#56A64B","index":3},"DetailedChargeStateStopped":{"text":"멈춤","color":"#F2CC0C","index":4},"DetailedChargeStateComplete":{"text":"완료","color":"#5794F2","index":5},"CP_CHARGE_INACTIVE":{"text":"비활성 · CAN 미검증","color":"#FF9830","index":6},"CP_CHARGE_CONNECTED":{"text":"연결됨 · CAN 미검증","color":"#FF9830","index":7},"CP_CHARGE_STANDBY":{"text":"대기 · CAN 미검증","color":"#FF9830","index":8},"CP_EXT_EVSE_TEST_ACTIVE":{"text":"외부 EVSE 시험 중 · CAN 미검증","color":"#FF9830","index":9},"CP_EVSE_TEST_PASSED":{"text":"EVSE 시험 통과 · CAN 미검증","color":"#FF9830","index":10},"CP_CHARGE_ENABLED":{"text":"충전 허용 · CAN 미검증","color":"#FF9830","index":11},"CP_CHARGE_FAULTED":{"text":"충전 오류 보고 · CAN 미검증","color":"#FF9830","index":12}}}],"color":{"mode":"thresholds"},"thresholds":{"mode":"absolute","steps":[{"value":null,"color":"#6E7681"}]},"custom":{"fillOpacity":80,"lineWidth":0,"spanNulls":false}},"overrides":[]},"options":{"mergeValues":true,"showValue":"auto","alignValue":"center","rowHeight":0.8,"legend":{"showLegend":false},"tooltip":{"mode":"single"}},"gridPos":{"x":0,"y":60,"w":24,"h":3},"transformations":[{"id":"partitionByValues","options":{"fields":["series"]}}]},
      {"id":58,"type":"timeseries","title":"시간별 에너지 (+ 충전 / − 사용·주차 소모)","description":"분석이 끝난 시간 구간별 충전 에너지(DCChargingEnergyIn 증가량, 배터리 측)와 사용·주차 중 소모량입니다. 같은 구간의 최신 계산만 사용합니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"interval":"1h","targets":[{"refId":"A","format":"time_series","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND `metric` IN ('battery.energy.discharge_energy_kwh', 'battery.energy.parked_discharge_kwh', 'battery.energy.dc_charging_energy_in_kwh')) SELECT CAST(window_start AS TIMESTAMP(6)) AS `time`, CASE `metric` WHEN 'battery.energy.discharge_energy_kwh' THEN '사용' WHEN 'battery.energy.parked_discharge_kwh' THEN '주차 중 소모' WHEN 'battery.energy.dc_charging_energy_in_kwh' THEN '충전' END AS `metric`, SUM(`value` * CASE `metric` WHEN 'battery.energy.discharge_energy_kwh' THEN -1 WHEN 'battery.energy.parked_discharge_kwh' THEN -1 WHEN 'battery.energy.dc_charging_energy_in_kwh' THEN 1 END) AS `value` FROM revisions WHERE revision_rank = 1 AND status = 'derived' AND unit = 'kWh' AND `value` IS NOT NULL GROUP BY 1, 2 ORDER BY 1","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"kwatth","noValue":"기록 없음","custom":{"drawStyle":"bars","lineInterpolation":"linear","lineWidth":2,"fillOpacity":80,"gradientMode":"opacity","showPoints":"never","spanNulls":false,"axisBorderShow":false,"axisPlacement":"auto","barAlignment":0,"barWidthFactor":0.8,"pointSize":4,"stacking":{"mode":"normal","group":"A"},"thresholdsStyle":{"mode":"off"}},"color":{"mode":"palette-classic"}},"overrides":[{"matcher":{"id":"byName","options":"충전"},"properties":[{"id":"color","value":{"mode":"fixed","fixedColor":"#56A64B"}}]},{"matcher":{"id":"byName","options":"사용"},"properties":[{"id":"color","value":{"mode":"fixed","fixedColor":"#FF9830"}}]},{"matcher":{"id":"byName","options":"주차 중 소모"},"properties":[{"id":"color","value":{"mode":"fixed","fixedColor":"#A352CC"}}]}]},"options":{"legend":{"displayMode":"list","placement":"bottom","showLegend":true,"calcs":[]},"tooltip":{"mode":"multi","sort":"desc"}},"gridPos":{"x":0,"y":63,"w":24,"h":8}},
      {"id":63,"type":"row","title":"배터리 건강·분석 결과","collapsed":false,"gridPos":{"x":0,"y":71,"w":24,"h":1},"panels":[]},
      {"id":33,"type":"stat","title":"배터리 건강도 · 추정","description":"완전 방전 관측이 있으면 그 용량을, 없으면 SOC 30%p 이상 연속 충방전 구간의 용량 추정치를 기준 용량으로 나눈 값입니다. 기준 용량은 설정값이 없으면 차량 BMS가 보고한 공칭 팩 에너지(NominalFullPackEnergyKwh)입니다. 추정치는 ±오차와 함께 표시되며 잔량과 다릅니다. 조건이 부족하면 판단 불가이며, 값이 없다고 100%로 표시하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric` ORDER BY window_start DESC, computed_at DESC, revision DESC) AS latest_rank FROM revisions WHERE revision_rank = 1), pick AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch ORDER BY CASE WHEN `metric` = 'battery.energy.soh_pct' THEN 0 ELSE 1 END, window_start DESC) AS pick_rank FROM latest WHERE latest_rank = 1 AND `metric` IN ('battery.energy.soh_pct', 'battery.energy.soh_estimated_pct') AND status IN ('reported', 'derived', 'estimated') AND unit = '%' AND `value` IS NOT NULL) SELECT vehicle, source, decode_epoch, CAST(window_start AS TIMESTAMP(6)) AS observed_at, CASE WHEN `metric` = 'battery.energy.soh_pct' THEN '완전 방전 기준' ELSE CONCAT('부분 충전 추정 ±', CAST(ROUND(uncertainty, 1) AS STRING), '%p') END AS basis, `value` AS reading FROM pick WHERE pick_rank = 1 ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"percent","decimals":1,"noValue":"판단 불가","color":{"mode":"fixed","fixedColor":"#A352CC"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"판단 불가","color":"#6E7681","index":0}}}],"displayName":"$${__data.fields.basis}"},"overrides":[]},"options":{"colorMode":"value","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value_and_name","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":true},"text":{"valueSize":26,"titleSize":12}},"gridPos":{"x":0,"y":72,"w":5,"h":4}},
      {"id":32,"type":"stat","title":"사용 가능 용량 · 추정","description":"완전 방전 관측 등 계산 조건을 만족한 사용 가능 용량입니다. 일부 구간의 에너지나 정격 용량을 전체 용량으로 간주하지 않습니다. 조건이 부족하면 판단 불가입니다. 개별 값의 관측 시각과 차량 식별자는 아래 분석 기록에서 확인할 수 있습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric` ORDER BY window_start DESC, computed_at DESC, revision DESC) AS latest_rank FROM revisions WHERE revision_rank = 1) SELECT vehicle, source, decode_epoch, CAST(window_start AS TIMESTAMP(6)) AS observed_at, CASE WHEN status IN ('reported', 'derived', 'estimated') AND unit = 'kWh' THEN `value` ELSE NULL END AS reading FROM latest WHERE latest_rank = 1 AND `metric` = 'battery.energy.full_usable_capacity_kwh' ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"kwatth","noValue":"판단 불가","color":{"mode":"fixed","fixedColor":"#A352CC"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"판단 불가","color":"#6E7681","index":0}}}]},"overrides":[]},"options":{"colorMode":"value","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":true},"text":{"valueSize":26,"titleSize":12}},"gridPos":{"x":5,"y":72,"w":5,"h":4}},
      {"id":30,"type":"stat","title":"최근 1시간 사용","description":"가장 최근 분석 구간의 LifetimeEnergyUsed 증가량입니다. 차량 평생 누적 사용량이나 선택 기간 전체 합계가 아닙니다. 구간 시각과 근거는 상세 기록에서 확인하세요. 개별 값의 관측 시각과 차량 식별자는 아래 분석 기록에서 확인할 수 있습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric` ORDER BY window_start DESC, computed_at DESC, revision DESC) AS latest_rank FROM revisions WHERE revision_rank = 1) SELECT vehicle, source, decode_epoch, CAST(window_start AS TIMESTAMP(6)) AS observed_at, CASE WHEN status IN ('reported', 'derived', 'estimated') AND unit = 'kWh' THEN `value` ELSE NULL END AS reading FROM latest WHERE latest_rank = 1 AND `metric` = 'battery.energy.discharge_energy_kwh' ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"kwatth","noValue":"판단 불가","color":{"mode":"fixed","fixedColor":"#FF9830"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"판단 불가","color":"#6E7681","index":0}}}]},"overrides":[]},"options":{"colorMode":"value","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":true},"text":{"valueSize":26,"titleSize":12}},"gridPos":{"x":10,"y":72,"w":5,"h":4}},
      {"id":31,"type":"stat","title":"충방전 환산 횟수 · 최근 구간","description":"가장 최근 분석 구간의 단방향 등가 완전 사이클(EFC)입니다. 기준 용량이 필요하며 차량 수명 동안의 누적 사이클 수가 아닙니다. 개별 값의 관측 시각과 차량 식별자는 아래 분석 기록에서 확인할 수 있습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric` ORDER BY window_start DESC, computed_at DESC, revision DESC) AS latest_rank FROM revisions WHERE revision_rank = 1) SELECT vehicle, source, decode_epoch, CAST(window_start AS TIMESTAMP(6)) AS observed_at, CASE WHEN status IN ('reported', 'derived', 'estimated') AND unit = 'cycles' THEN `value` ELSE NULL END AS reading FROM latest WHERE latest_rank = 1 AND `metric` = 'battery.energy.efc_oneway_cycles' ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"suffix: 회","decimals":2,"noValue":"판단 불가","color":{"mode":"fixed","fixedColor":"#1F9E89"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"판단 불가","color":"#6E7681","index":0}}}]},"overrides":[]},"options":{"colorMode":"value","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":true},"text":{"valueSize":26,"titleSize":12}},"gridPos":{"x":15,"y":72,"w":5,"h":4}},
      {"id":34,"type":"stat","title":"마지막 분석 구간","description":"선택한 기간에서 분석한 가장 최근 구간의 시작입니다. 프로그램 실행 시각이 아니며, 데이터가 오래되면 분석을 다시 실행해도 이 시각은 바뀌지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT CAST(MAX(window_start) AS BIGINT) / 1000000 AS latest_window FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"분석 기록 없음","mappings":[{"type":"special","options":{"match":"null","result":{"text":"분석 기록 없음","color":"#6E7681","index":0}}}],"unit":"dateTimeFromNow","color":{"mode":"fixed","fixedColor":"#6E7681"}},"overrides":[]},"options":{"colorMode":"value","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":true},"text":{"valueSize":20,"titleSize":12}},"gridPos":{"x":20,"y":72,"w":4,"h":4}},
      {"id":36,"type":"row","title":"분석 기록 자세히 보기","collapsed":true,"gridPos":{"x":0,"y":76,"w":24,"h":1},"panels":[{"id":2,"type":"stat","title":"분석된 데이터 묶음 수","description":"Distinct (vehicle, source, epoch) scopes with analysis rows in range. No data means no analyses, not zero vehicles.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT NULLIF(COUNT(*), 0) AS scopes FROM (SELECT DISTINCT vehicle, source, decode_epoch FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) AS s","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음 / 판단 불가","mappings":[{"type":"special","options":{"match":"null","result":{"text":"No data","color":"gray"}}}]},"overrides":[]},"options":{"colorMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto"},"gridPos":{"x":0,"y":37,"w":24,"h":8}},{"id":3,"type":"stat","title":"계산 불가·실행 오류 지표 수","description":"Latest-per-metric rows whose newest revision is unavailable or error. Status is filtered only after the latest revision wins; see the authoritative table. Zero means no current analysis rows carry either status, not a vehicle health judgment. No data means no analysis rows.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH ranked AS (SELECT vehicle, source, decode_epoch, analysis_id, `metric`, window_start, window_end, `value`, value_text, unit, status, reason, revision, evidence_count, sample_count, coverage_ratio, algorithm_version, calibration_version, model_version, uncertainty, uncertainty_lower, uncertainty_upper, computed_at, quality, config_version, connectivity, episode_id, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS rn FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT SUM(CASE WHEN status IN ('unavailable', 'error') THEN 1 ELSE 0 END) AS degraded FROM ranked WHERE rn = 1","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음 / 판단 불가","mappings":[{"type":"special","options":{"match":"null","result":{"text":"No data","color":"gray"}}}]},"overrides":[]},"options":{"colorMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto"},"gridPos":{"x":0,"y":45,"w":24,"h":8}},{"id":4,"type":"stat","title":"최근 분석 구간 시각","description":"Newest window_start in scope; event time, not ingest time. Older than expected marks a stale pipeline, not current health.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT CAST(MAX(window_start) AS BIGINT) / 1000000 AS latest_window FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음 / 판단 불가","mappings":[{"type":"special","options":{"match":"null","result":{"text":"No data","color":"gray"}}}],"unit":"dateTimeAsIso"},"overrides":[]},"options":{"colorMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto"},"gridPos":{"x":0,"y":53,"w":24,"h":8}},{"id":5,"type":"stat","title":"경고 발생·관측 건수","description":"Alerts only (event_type='alerts'); errors, connectivity and derived anomalies are separate kinds. Lifecycle resolves per episode across all retained observations before range selection. Started counts distinct episodes with a valid start in range. Overlapping counts established episodes with a start in range, an authoritative end reaching the range, or valid active evidence reaching the range. Uncertain counts established episodes starting before the range with no end and no active evidence proving continued activity — unknown, never open. Missing-start observations count separately and are never episodes.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH obs AS (SELECT episode_id, vehicle, source, decode_epoch, event_time, started_at, ended_at, is_active FROM vehicle_event WHERE event_type = 'alerts' AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})), ep AS (SELECT episode_id, MIN(started_at) AS rstart, COUNT(*) AS n_obs, SUM(CASE WHEN is_active THEN 1 ELSE 0 END) AS n_active, COUNT(DISTINCT ended_at) AS n_ends, MAX(ended_at) AS mend, MAX(CASE WHEN is_active THEN COALESCE(ended_at, event_time) ELSE NULL END) AS max_active_env, SUM(CASE WHEN ended_at IS NOT NULL AND started_at IS NOT NULL AND ended_at < started_at THEN 1 ELSE 0 END) AS n_bad_time FROM obs WHERE episode_id IS NOT NULL GROUP BY episode_id, vehicle, source, decode_epoch), st AS (SELECT episode_id, rstart, CASE WHEN n_ends = 1 AND n_bad_time = 0 AND (max_active_env IS NULL OR max_active_env <= mend) THEN mend ELSE NULL END AS auth_end, max_active_env FROM ep), agg AS (SELECT NULLIF(COUNT(DISTINCT CASE WHEN rstart >= FROM_UNIXTIME($$__unixEpochFrom()) AND rstart <= FROM_UNIXTIME($$__unixEpochTo()) THEN episode_id END), 0) AS started_episodes, NULLIF(COUNT(DISTINCT CASE WHEN rstart <= FROM_UNIXTIME($$__unixEpochTo()) AND (rstart >= FROM_UNIXTIME($$__unixEpochFrom()) OR auth_end >= FROM_UNIXTIME($$__unixEpochFrom()) OR max_active_env >= FROM_UNIXTIME($$__unixEpochFrom())) THEN episode_id END), 0) AS overlapping_episodes, NULLIF(COUNT(DISTINCT CASE WHEN rstart < FROM_UNIXTIME($$__unixEpochFrom()) AND auth_end IS NULL AND (max_active_env IS NULL OR max_active_env < FROM_UNIXTIME($$__unixEpochFrom())) THEN episode_id END), 0) AS uncertain_episodes FROM st) SELECT started_episodes, overlapping_episodes, uncertain_episodes, (SELECT NULLIF(COUNT(*), 0) FROM obs WHERE started_at IS NULL AND event_time >= FROM_UNIXTIME($$__unixEpochFrom()) AND event_time <= FROM_UNIXTIME($$__unixEpochTo())) AS missing_start_obs FROM agg","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음 / 판단 불가","mappings":[{"type":"special","options":{"match":"null","result":{"text":"No data","color":"gray"}}}]},"overrides":[]},"options":{"colorMode":"none","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"orientation":"auto","textMode":"auto"},"gridPos":{"x":0,"y":61,"w":24,"h":8}},{"id":6,"type":"table","title":"전체 분석 결과와 관측 시각","description":"Newest revision per (vehicle, source, epoch, analysis, metric, window) by computed_at, then revision. The status filter applies after the latest revision wins, so filtering to derived or estimated never resurrects a stale good row. Status, reason and computed_at decide trust; a NULL value with unavailable or error status is a finding, not a gap.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH ranked AS (SELECT vehicle, source, decode_epoch, analysis_id, `metric`, window_start, window_end, `value`, value_text, unit, status, reason, revision, evidence_count, sample_count, coverage_ratio, algorithm_version, calibration_version, model_version, uncertainty, uncertainty_lower, uncertainty_upper, computed_at, quality, config_version, connectivity, episode_id, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS rn FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT vehicle, source, decode_epoch, analysis_id, `metric`, `value`, value_text, unit, status, reason, CAST(window_start AS TIMESTAMP(6)) AS window_start, CAST(computed_at AS TIMESTAMP(6)) AS computed_at, CAST(window_end AS TIMESTAMP(6)) AS window_end, revision, evidence_count, sample_count, coverage_ratio, uncertainty, uncertainty_lower, uncertainty_upper, algorithm_version, calibration_version, model_version, quality, connectivity, episode_id FROM ranked WHERE rn = 1 AND ($${status:sqlstring} = '' OR status = $${status:sqlstring}) AND `metric` LIKE 'battery.%' ORDER BY `metric` ASC LIMIT 500","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음 / 판단 불가"},"overrides":[]},"options":{"showHeader":true},"gridPos":{"x":0,"y":69,"w":24,"h":8}}]},
      {"id":7,"type":"row","title":"전압·온도 상세","collapsed":true,"gridPos":{"x":0,"y":77,"w":24,"h":1},"panels":[{"id":8,"type":"table","title":"전압·온도·절연 관측값","description":"Conditional robust baselines; zero MAD or too-small samples stay uncalibrated, never zero-filled. Extreme IDs mark changing extrema, not a full cell array. Observation fractions are change-gated, not time exposure.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH ranked AS (SELECT vehicle, source, decode_epoch, analysis_id, `metric`, window_start, window_end, `value`, value_text, unit, status, reason, revision, evidence_count, sample_count, coverage_ratio, algorithm_version, calibration_version, model_version, uncertainty, uncertainty_lower, uncertainty_upper, computed_at, quality, config_version, connectivity, episode_id, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS rn FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT vehicle, source, decode_epoch, `metric`, `value`, value_text, unit, status, reason, CAST(window_start AS TIMESTAMP(6)) AS window_start, CAST(computed_at AS TIMESTAMP(6)) AS computed_at, coverage_ratio, evidence_count, calibration_version FROM ranked WHERE rn = 1 AND ($${status:sqlstring} = '' OR status = $${status:sqlstring}) AND `metric` LIKE 'battery.conditions.%' ORDER BY `metric` ASC LIMIT 500","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음 / 판단 불가"},"overrides":[]},"options":{"showHeader":true},"gridPos":{"x":0,"y":38,"w":24,"h":8}},{"id":9,"type":"timeseries","title":"선택한 지표의 변화","description":"Exact metric match from the picker; unavailable revisions are NULL gaps, never zeros. Scopes stay separate series; confirm units in the latest table before comparing.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"time_series","rawSql":"WITH ranked AS (SELECT vehicle, source, decode_epoch, analysis_id, `metric`, window_start, window_end, `value`, value_text, unit, status, reason, revision, evidence_count, sample_count, coverage_ratio, algorithm_version, calibration_version, model_version, uncertainty, uncertainty_lower, uncertainty_upper, computed_at, quality, config_version, connectivity, episode_id, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS rn FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT CAST(window_start AS TIMESTAMP(6)) AS `time`, vehicle, source, decode_epoch, `value` AS value FROM ranked WHERE rn = 1 AND `metric` = $${metric:sqlstring} ORDER BY window_start ASC LIMIT 5000","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음 / 판단 불가"},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","showLegend":true}},"gridPos":{"x":0,"y":46,"w":24,"h":8}}]},
      {"id":10,"type":"row","title":"사용 에너지·용량 상세","collapsed":true,"gridPos":{"x":0,"y":78,"w":24,"h":1},"panels":[{"id":11,"type":"table","title":"에너지·용량·건강도 근거","description":"Delta-E over delta-SOC is interval-equivalent energy, not automatically full usable kWh. EFC uses a fixed reference; Ah and kWh stay separate; no Tesla capacity is guessed.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH ranked AS (SELECT vehicle, source, decode_epoch, analysis_id, `metric`, window_start, window_end, `value`, value_text, unit, status, reason, revision, evidence_count, sample_count, coverage_ratio, algorithm_version, calibration_version, model_version, uncertainty, uncertainty_lower, uncertainty_upper, computed_at, quality, config_version, connectivity, episode_id, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS rn FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT vehicle, source, decode_epoch, `metric`, `value`, value_text, unit, status, reason, CAST(window_start AS TIMESTAMP(6)) AS window_start, CAST(computed_at AS TIMESTAMP(6)) AS computed_at, coverage_ratio, evidence_count, calibration_version FROM ranked WHERE rn = 1 AND ($${status:sqlstring} = '' OR status = $${status:sqlstring}) AND `metric` LIKE 'battery.energy.%' ORDER BY `metric` ASC LIMIT 500","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음 / 판단 불가"},"overrides":[]},"options":{"showHeader":true},"gridPos":{"x":0,"y":39,"w":24,"h":8}},{"id":12,"type":"timeseries","title":"계산한 잔량의 변화","description":"BMS-usable SOC estimators in percent. Coulomb counting needs current calibration, OCV needs rested voltage, EKF needs synchronized V and I. Unavailable revisions are gaps. Never a BMS passthrough.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"time_series","rawSql":"WITH ranked AS (SELECT vehicle, source, decode_epoch, analysis_id, `metric`, window_start, window_end, `value`, value_text, unit, status, reason, revision, evidence_count, sample_count, coverage_ratio, algorithm_version, calibration_version, model_version, uncertainty, uncertainty_lower, uncertainty_upper, computed_at, quality, config_version, connectivity, episode_id, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS rn FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT CAST(window_start AS TIMESTAMP(6)) AS `time`, `metric`, vehicle, source, decode_epoch, `value` AS value FROM ranked WHERE rn = 1 AND `metric` IN ('battery.electrical.soc_coulomb_pct', 'battery.electrical.soc_ocv_pct', 'battery.electrical.soc_ekf_pct') ORDER BY window_start ASC LIMIT 5000","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음 / 판단 불가"},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","showLegend":true}},"gridPos":{"x":0,"y":47,"w":24,"h":8}}]},
      {"id":13,"type":"row","title":"전기 특성·수명 연구 지표","collapsed":true,"gridPos":{"x":0,"y":79,"w":24,"h":1},"panels":[{"id":14,"type":"table","title":"잔량·저항·충방전 특성","description":"Resistance rows always state apparent-DC limits in reason; ICA/DVA peaks need constant-current windows; temperature comparability is unchecked unless stated.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH ranked AS (SELECT vehicle, source, decode_epoch, analysis_id, `metric`, window_start, window_end, `value`, value_text, unit, status, reason, revision, evidence_count, sample_count, coverage_ratio, algorithm_version, calibration_version, model_version, uncertainty, uncertainty_lower, uncertainty_upper, computed_at, quality, config_version, connectivity, episode_id, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS rn FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT vehicle, source, decode_epoch, `metric`, `value`, value_text, unit, status, reason, CAST(window_start AS TIMESTAMP(6)) AS window_start, CAST(computed_at AS TIMESTAMP(6)) AS computed_at, uncertainty, uncertainty_lower, uncertainty_upper FROM ranked WHERE rn = 1 AND ($${status:sqlstring} = '' OR status = $${status:sqlstring}) AND `metric` IN ('battery.electrical.soc_coulomb_pct', 'battery.electrical.soc_ocv_pct', 'battery.electrical.soc_ekf_pct', 'battery.electrical.resistance_apparent_ohm', 'battery.electrical.ica_peak_voltage_v', 'battery.electrical.ica_peak_dqdv_ah_per_v', 'battery.electrical.dva_peak_capacity_ah', 'battery.electrical.dva_peak_dvdq_v_per_ah') ORDER BY `metric` ASC LIMIT 500","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음 / 판단 불가"},"overrides":[]},"options":{"showHeader":true},"gridPos":{"x":0,"y":40,"w":24,"h":8}},{"id":15,"type":"table","title":"수명 연구 결과 · 차량 수명 예측 아님","description":"Lab-cell method verification only. Fleet/Tesla scopes and unsupported input ranges are unavailable, never Tesla-pack life estimates. Right-censored cells never invent terminal cycles; grouped-battery holdout, never row split.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH ranked AS (SELECT vehicle, source, decode_epoch, analysis_id, `metric`, window_start, window_end, `value`, value_text, unit, status, reason, revision, evidence_count, sample_count, coverage_ratio, algorithm_version, calibration_version, model_version, uncertainty, uncertainty_lower, uncertainty_upper, computed_at, quality, config_version, connectivity, episode_id, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS rn FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT vehicle, source, decode_epoch, `metric`, `value`, value_text, unit, status, reason, CAST(window_start AS TIMESTAMP(6)) AS window_start, CAST(computed_at AS TIMESTAMP(6)) AS computed_at, uncertainty, uncertainty_lower, uncertainty_upper, model_version, calibration_version FROM ranked WHERE rn = 1 AND ($${status:sqlstring} = '' OR status = $${status:sqlstring}) AND `metric` LIKE 'battery.rul.%' ORDER BY `metric` ASC LIMIT 500","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음 / 판단 불가"},"overrides":[]},"options":{"showHeader":true},"gridPos":{"x":0,"y":48,"w":24,"h":8}},{"id":16,"type":"timeseries","title":"겉보기 직류 저항 변화","description":"Load-step apparent resistance only: not EIS and not true cell resistance. SOC or temperature shifts and small steps invalidate points; see reason.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"time_series","rawSql":"WITH ranked AS (SELECT vehicle, source, decode_epoch, analysis_id, `metric`, window_start, window_end, `value`, value_text, unit, status, reason, revision, evidence_count, sample_count, coverage_ratio, algorithm_version, calibration_version, model_version, uncertainty, uncertainty_lower, uncertainty_upper, computed_at, quality, config_version, connectivity, episode_id, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS rn FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT CAST(window_start AS TIMESTAMP(6)) AS `time`, vehicle, source, decode_epoch, `value` AS value FROM ranked WHERE rn = 1 AND `metric` = 'battery.electrical.resistance_apparent_ohm' ORDER BY window_start ASC LIMIT 5000","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음 / 판단 불가"},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","showLegend":true}},"gridPos":{"x":0,"y":56,"w":24,"h":8}}]},
      {"id":17,"type":"row","title":"차량 경고 기록","collapsed":true,"gridPos":{"x":0,"y":80,"w":24,"h":1},"panels":[{"id":18,"type":"table","title":"수신한 경고 원문 항목","description":"Immutable OEM alert observations in range, newest first. Each row is one observation, never episode state: resolved lifecycle, conflicting ends and authoritative duration live in the next panel. Late old-active rows are normal, not reopen; audience is routing, not severity. Errors, connectivity and derived anomalies are separate event types.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT CAST(event_time AS TIMESTAMP(6)) AS event_time, vehicle, source, decode_epoch, event_type, name, audience, is_active, CAST(started_at AS TIMESTAMP(6)) AS started_at, CAST(ended_at AS TIMESTAMP(6)) AS ended_at, duration_s, episode_id, event_id, quality, collector_id FROM vehicle_event WHERE $$__timeFilter(event_time) AND event_type = 'alerts' AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) ORDER BY event_time DESC LIMIT 200","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음 / 판단 불가"},"overrides":[]},"options":{"showHeader":true},"gridPos":{"x":0,"y":41,"w":24,"h":8}},{"id":19,"type":"table","title":"경고 시작·종료와 반복","description":"One row per established alert episode, resolved across all retained observations and grouped by epoch. Open requires valid active evidence (is_active); rows with only malformed or inactive observations and no end are unknown_activity, never open. An end before its start is conflict_time. Distinct ends or an active envelope after the end leave end and duration unknown (conflict states); only closed episodes carry the authoritative end and OEM-reported duration. bad_obs counts observations with a quality flag. started_in_range is 0/1 per episode. Missing-start rows group separately and never gain duration or recurrence.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH obs AS (SELECT episode_id, name, vehicle, source, decode_epoch, event_time, started_at, ended_at, duration_s, is_active, quality FROM vehicle_event WHERE event_type = 'alerts' AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})), ep AS (SELECT episode_id, name, vehicle, source, decode_epoch, MIN(started_at) AS rstart, COUNT(*) AS n_obs, SUM(CASE WHEN quality IS NOT NULL THEN 1 ELSE 0 END) AS n_bad, SUM(CASE WHEN is_active THEN 1 ELSE 0 END) AS n_active, COUNT(DISTINCT ended_at) AS n_ends, MAX(ended_at) AS mend, MAX(CASE WHEN is_active THEN COALESCE(ended_at, event_time) ELSE NULL END) AS max_active_env, MAX(duration_s) AS max_dur, SUM(CASE WHEN ended_at IS NOT NULL AND started_at IS NOT NULL AND ended_at < started_at THEN 1 ELSE 0 END) AS n_bad_time FROM obs WHERE episode_id IS NOT NULL GROUP BY episode_id, name, vehicle, source, decode_epoch), st AS (SELECT episode_id, name, vehicle, source, decode_epoch, rstart, n_obs, n_bad, n_active, n_ends, mend, max_active_env, max_dur, CASE WHEN n_bad_time > 0 THEN 'conflict_time' WHEN n_ends > 1 THEN 'conflict_ends' WHEN max_active_env > mend THEN 'conflict_active' WHEN mend IS NOT NULL THEN 'closed' WHEN n_active > 0 THEN 'open' ELSE 'unknown_activity' END AS state, CASE WHEN n_ends = 1 AND n_bad_time = 0 AND (max_active_env IS NULL OR max_active_env <= mend) THEN mend ELSE NULL END AS auth_end FROM ep) SELECT episode_id AS episode, name, vehicle, source, decode_epoch, n_obs AS observations, n_bad AS bad_obs, CASE WHEN rstart >= FROM_UNIXTIME($$__unixEpochFrom()) AND rstart <= FROM_UNIXTIME($$__unixEpochTo()) THEN 1 ELSE 0 END AS started_in_range, n_active AS active_obs, n_ends AS distinct_ends, state, CAST(rstart AS TIMESTAMP(6)) AS first_start, CAST(auth_end AS TIMESTAMP(6)) AS authoritative_end, CASE WHEN state = 'closed' THEN max_dur ELSE NULL END AS reported_duration_s FROM st WHERE rstart <= FROM_UNIXTIME($$__unixEpochTo()) AND (rstart >= FROM_UNIXTIME($$__unixEpochFrom()) OR auth_end >= FROM_UNIXTIME($$__unixEpochFrom()) OR max_active_env >= FROM_UNIXTIME($$__unixEpochFrom()) OR state IN ('conflict_ends', 'conflict_active', 'conflict_time', 'unknown_activity')) UNION ALL SELECT '(missing start: observations only)' AS episode, name, vehicle, source, decode_epoch, COUNT(*) AS observations, SUM(CASE WHEN quality IS NOT NULL THEN 1 ELSE 0 END) AS bad_obs, 0 AS started_in_range, SUM(CASE WHEN is_active THEN 1 ELSE 0 END) AS active_obs, 0 AS distinct_ends, 'unknown_start' AS state, NULL AS first_start, NULL AS authoritative_end, NULL AS reported_duration_s FROM obs WHERE episode_id IS NULL AND started_at IS NULL AND event_time >= FROM_UNIXTIME($$__unixEpochFrom()) AND event_time <= FROM_UNIXTIME($$__unixEpochTo()) GROUP BY name, vehicle, source, decode_epoch ORDER BY observations DESC LIMIT 200","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음 / 판단 불가"},"overrides":[]},"options":{"showHeader":true},"gridPos":{"x":0,"y":49,"w":24,"h":8}},{"id":20,"type":"table","title":"경고 분석 결과","description":"Derived alert analytics join OEM episodes via episode_id. Errors, connectivity and derived anomalies stay distinct kinds; rates use the same coverage and time window in numerator and denominator.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH ranked AS (SELECT vehicle, source, decode_epoch, analysis_id, `metric`, window_start, window_end, `value`, value_text, unit, status, reason, revision, evidence_count, sample_count, coverage_ratio, algorithm_version, calibration_version, model_version, uncertainty, uncertainty_lower, uncertainty_upper, computed_at, quality, config_version, connectivity, episode_id, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS rn FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT vehicle, source, decode_epoch, `metric`, `value`, value_text, unit, status, reason, CAST(window_start AS TIMESTAMP(6)) AS window_start, CAST(computed_at AS TIMESTAMP(6)) AS computed_at, episode_id, evidence_count, coverage_ratio FROM ranked WHERE rn = 1 AND ($${status:sqlstring} = '' OR status = $${status:sqlstring}) AND `metric` LIKE 'battery.alerts.%' ORDER BY `metric` ASC LIMIT 500","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음 / 판단 불가"},"overrides":[]},"options":{"showHeader":true},"gridPos":{"x":0,"y":57,"w":24,"h":8}}]},
      {"id":21,"type":"row","title":"분석 근거·데이터 품질","collapsed":true,"gridPos":{"x":0,"y":81,"w":24,"h":1},"panels":[{"id":22,"type":"table","title":"계산 사유·관측량·버전","description":"Why every current value looks the way it does: reason codes (missing_calibration, sparse, gap, conflict), coverage, evidence counts, algorithm, calibration, model and config versions, quality and connectivity. Execution failure is distinct from insufficient data.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH ranked AS (SELECT vehicle, source, decode_epoch, analysis_id, `metric`, window_start, window_end, `value`, value_text, unit, status, reason, revision, evidence_count, sample_count, coverage_ratio, algorithm_version, calibration_version, model_version, uncertainty, uncertainty_lower, uncertainty_upper, computed_at, quality, config_version, connectivity, episode_id, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS rn FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT vehicle, source, decode_epoch, analysis_id, `metric`, status, reason, coverage_ratio, evidence_count, sample_count, quality, connectivity, algorithm_version, calibration_version, model_version, config_version, CAST(computed_at AS TIMESTAMP(6)) AS computed_at FROM ranked WHERE rn = 1 AND ($${status:sqlstring} = '' OR status = $${status:sqlstring}) AND `metric` LIKE 'battery.%' ORDER BY analysis_id ASC, `metric` ASC LIMIT 500","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음 / 판단 불가"},"overrides":[]},"options":{"showHeader":true},"gridPos":{"x":0,"y":42,"w":24,"h":8}},{"id":23,"type":"table","title":"교정·모델 적용 정보","description":"Which code, calibration and model produced the current rows. Raw reports and calculations using verified native units may legitimately have no calibration version. Methods requiring calibration remain unavailable when it is missing; inspect status and reason rather than interpreting NULL alone.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH ranked AS (SELECT vehicle, source, decode_epoch, analysis_id, `metric`, window_start, window_end, `value`, value_text, unit, status, reason, revision, evidence_count, sample_count, coverage_ratio, algorithm_version, calibration_version, model_version, uncertainty, uncertainty_lower, uncertainty_upper, computed_at, quality, config_version, connectivity, episode_id, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS rn FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT analysis_id, algorithm_version, calibration_version, model_version, config_version, COUNT(*) AS live_metrics, CAST(MAX(computed_at) AS TIMESTAMP(6)) AS last_computed FROM ranked WHERE rn = 1 GROUP BY analysis_id, algorithm_version, calibration_version, model_version, config_version ORDER BY analysis_id ASC LIMIT 100","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"noValue":"기록 없음 / 판단 불가"},"overrides":[]},"options":{"showHeader":true},"gridPos":{"x":0,"y":50,"w":24,"h":8}}]}
      ]}

