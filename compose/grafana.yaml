      {"id":27,"type":"stat","title":"계산 잔량 · 추정","description":"전압·전류와 교정된 배터리 모델로 계산한 EKF 추정 SOC입니다. 입력이나 모델이 없으면 판단 불가입니다. 차량 표시값을 복사한 수치가 아닙니다. 개별 값의 관측 시각과 차량 식별자는 아래 분석 기록에서 확인할 수 있습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric` ORDER BY window_start DESC, computed_at DESC, revision DESC) AS latest_rank FROM revisions WHERE revision_rank = 1) SELECT vehicle, source, decode_epoch, CAST(window_start AS TIMESTAMP(6)) AS observed_at, CASE WHEN status IN ('reported', 'derived', 'estimated') AND unit = '%' THEN `value` ELSE NULL END AS reading FROM latest WHERE latest_rank = 1 AND `metric` = 'battery.electrical.soc_ekf_pct' ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"percent","decimals":1,"noValue":"판단 불가","color":{"mode":"fixed","fixedColor":"#A352CC"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"판단 불가","color":"#6E7681","index":0}}}]},"overrides":[{"matcher":{"id":"byName","options":"observed_at"},"properties":[{"id":"unit","value":"dateTimeAsIso"}]}]},"options":{"colorMode":"value","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":true},"text":{"valueSize":22,"titleSize":12}},"gridPos":{"x":9,"y":12,"w":3,"h":4}},
      {"id":37,"type":"stat","title":"오늘 사용","description":"오늘(KST 0시부터) 시간별 방전 누적계 증가량과 주차 중 소모량의 합입니다. 분석이 끝난 시간 구간만 더하므로 진행 중인 현재 시간은 다음 집계 후 반영됩니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE `metric` IN ('battery.energy.discharge_energy_kwh', 'battery.energy.parked_discharge_kwh') AND window_start >= date_trunc('day', now() AT TIME ZONE 'Asia/Seoul') AT TIME ZONE 'Asia/Seoul' AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT vehicle, source, decode_epoch, COUNT(*) AS windows, SUM(`value`) AS reading FROM revisions WHERE revision_rank = 1 AND status = 'derived' AND unit = 'kWh' AND `value` IS NOT NULL GROUP BY vehicle, source, decode_epoch ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"kwatth","noValue":"기록 없음","color":{"mode":"fixed","fixedColor":"#FF9830"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"기록 없음","color":"#6E7681","index":0}}}]},"overrides":[{"matcher":{"id":"byName","options":"windows"},"properties":[{"id":"custom.hidden","value":true}]}]},"options":{"colorMode":"value","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"/^reading$/","values":true},"text":{"valueSize":22,"titleSize":12}},"gridPos":{"x":12,"y":12,"w":3,"h":4}},
      {"id":39,"type":"stat","title":"오늘 충전","description":"오늘 배터리에 들어간 충전 에너지(DCChargingEnergyIn 증가량, 배터리 측 AC+DC)의 합입니다. 충전기 계량값과 다를 수 있습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE `metric` IN ('battery.energy.dc_charging_energy_in_kwh') AND window_start >= date_trunc('day', now() AT TIME ZONE 'Asia/Seoul') AT TIME ZONE 'Asia/Seoul' AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT vehicle, source, decode_epoch, COUNT(*) AS windows, SUM(`value`) AS reading FROM revisions WHERE revision_rank = 1 AND status = 'derived' AND unit = 'kWh' AND `value` IS NOT NULL GROUP BY vehicle, source, decode_epoch ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"kwatth","noValue":"기록 없음","color":{"mode":"fixed","fixedColor":"#56A64B"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"기록 없음","color":"#6E7681","index":0}}}]},"overrides":[{"matcher":{"id":"byName","options":"windows"},"properties":[{"id":"custom.hidden","value":true}]}]},"options":{"colorMode":"value","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"/^reading$/","values":true},"text":{"valueSize":22,"titleSize":12}},"gridPos":{"x":15,"y":12,"w":3,"h":4}},
      {"id":38,"type":"stat","title":"이번 주 사용","description":"이번 주(KST 월요일 0시부터) 방전 누적계 증가량과 주차 중 소모량의 합입니다. 분석 보존 기간 밖의 구간은 포함하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE `metric` IN ('battery.energy.discharge_energy_kwh', 'battery.energy.parked_discharge_kwh') AND window_start >= date_trunc('week', now() AT TIME ZONE 'Asia/Seoul') AT TIME ZONE 'Asia/Seoul' AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT vehicle, source, decode_epoch, COUNT(*) AS windows, SUM(`value`) AS reading FROM revisions WHERE revision_rank = 1 AND status = 'derived' AND unit = 'kWh' AND `value` IS NOT NULL GROUP BY vehicle, source, decode_epoch ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"kwatth","noValue":"기록 없음","color":{"mode":"fixed","fixedColor":"#FF9830"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"기록 없음","color":"#6E7681","index":0}}}]},"overrides":[{"matcher":{"id":"byName","options":"windows"},"properties":[{"id":"custom.hidden","value":true}]}]},"options":{"colorMode":"value","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"/^reading$/","values":true},"text":{"valueSize":22,"titleSize":12}},"gridPos":{"x":18,"y":12,"w":3,"h":4}},
      {"id":40,"type":"stat","title":"이번 주 충전","description":"이번 주 배터리에 들어간 충전 에너지(DCChargingEnergyIn 증가량)의 합입니다. 충전 손실 전 충전기 입력량이 아닙니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE `metric` IN ('battery.energy.dc_charging_energy_in_kwh') AND window_start >= date_trunc('week', now() AT TIME ZONE 'Asia/Seoul') AT TIME ZONE 'Asia/Seoul' AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT vehicle, source, decode_epoch, COUNT(*) AS windows, SUM(`value`) AS reading FROM revisions WHERE revision_rank = 1 AND status = 'derived' AND unit = 'kWh' AND `value` IS NOT NULL GROUP BY vehicle, source, decode_epoch ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"kwatth","noValue":"기록 없음","color":{"mode":"fixed","fixedColor":"#56A64B"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"기록 없음","color":"#6E7681","index":0}}}]},"overrides":[{"matcher":{"id":"byName","options":"windows"},"properties":[{"id":"custom.hidden","value":true}]}]},"options":{"colorMode":"value","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"/^reading$/","values":true},"text":{"valueSize":22,"titleSize":12}},"gridPos":{"x":21,"y":12,"w":3,"h":4}},
      {"id":60,"type":"row","title":"셀 전압 (96개 셀 중 최고·최저)","collapsed":false,"gridPos":{"x":0,"y":16,"w":24,"h":1},"panels":[]},
      {"id":44,"type":"stat","title":"최고 셀 · 보고값","description":"가장 최근 보고된 최고 셀 전압과 셀 번호입니다. 차량(Fleet Telemetry)은 96개 셀 전압을 모두 보내지 않고 가장 높은 셀·가장 낮은 셀의 전압과 번호만 보냅니다. 단위 메타데이터가 V/celsius로 확인된 유효 샘플만 표시하며, fleet/fleet-v1 자체는 교정 증거가 아닙니다. 단위 미확인은 판단 불가입니다. CAN 대응: BMS_brickVoltageMax, BMS_brickVoltageMin의 미검증 보고값입니다. 관측 시각은 위 CAN 보고값 표를 확인하세요. 단위 불일치·최신 무효 값은 과거 정상 값으로 대체하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH signals AS (SELECT event_time, vehicle, source, decode_epoch, ingest_time, envelope_id, value_num, value_text, value_bool, path AS path, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x332.BMS_brickVoltageMax' AND source_field = 'BMS_brickVoltageMax' THEN 'BrickVoltageMax' WHEN source = 'can' AND path = 'Vehicle.CAN.x332.BMS_brickVoltageMin' AND source_field = 'BMS_brickVoltageMin' THEN 'BrickVoltageMin' ELSE source_field END AS source_field, unit AS unit, quality, (quality = 'reported_unverified' AND ((source = 'can' AND path = 'Vehicle.CAN.x332.BMS_brickVoltageMax' AND source_field = 'BMS_brickVoltageMax') OR (source = 'can' AND path = 'Vehicle.CAN.x332.BMS_brickVoltageMin' AND source_field = 'BMS_brickVoltageMin'))) AS can_report FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, source_field ORDER BY event_time DESC, ingest_time DESC, envelope_id DESC) AS latest_rank FROM signals WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field IN ('BrickVoltageMax', 'NumBrickVoltageMax', 'BrickVoltageMin', 'NumBrickVoltageMin')) SELECT vehicle, source, decode_epoch, MAX(CASE WHEN source_field = 'BrickVoltageMax' AND unit = 'V' AND (quality IS NULL OR quality IN ('ok', 'valid', 'unit_unverified') OR can_report) THEN value_num END) AS reading, CONCAT('셀 #', CAST(CAST(MAX(CASE WHEN source_field = 'NumBrickVoltageMax' AND (quality IS NULL OR quality IN ('ok', 'valid', 'unit_unverified') OR can_report) AND value_num >= 1 AND value_num = floor(value_num) THEN value_num END) AS BIGINT) AS STRING)) AS cell FROM latest WHERE latest_rank = 1 GROUP BY vehicle, source, decode_epoch ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"volt","noValue":"판단 불가","color":{"mode":"fixed","fixedColor":"#56A64B"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"판단 불가","color":"#6E7681","index":0}}}],"decimals":3,"displayName":"$${__data.fields.cell}"},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value_and_name","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":true},"text":{"valueSize":32,"titleSize":12}},"gridPos":{"x":0,"y":17,"w":6,"h":5}},
      {"id":45,"type":"stat","title":"최저 셀 · 보고값","description":"가장 최근 보고된 최저 셀 전압과 셀 번호입니다. 차량(Fleet Telemetry)은 96개 셀 전압을 모두 보내지 않고 가장 높은 셀·가장 낮은 셀의 전압과 번호만 보냅니다. 단위 메타데이터가 V/celsius로 확인된 유효 샘플만 표시하며, fleet/fleet-v1 자체는 교정 증거가 아닙니다. 단위 미확인은 판단 불가입니다. CAN 대응: BMS_brickVoltageMax, BMS_brickVoltageMin의 미검증 보고값입니다. 관측 시각은 위 CAN 보고값 표를 확인하세요. 단위 불일치·최신 무효 값은 과거 정상 값으로 대체하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH signals AS (SELECT event_time, vehicle, source, decode_epoch, ingest_time, envelope_id, value_num, value_text, value_bool, path AS path, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x332.BMS_brickVoltageMax' AND source_field = 'BMS_brickVoltageMax' THEN 'BrickVoltageMax' WHEN source = 'can' AND path = 'Vehicle.CAN.x332.BMS_brickVoltageMin' AND source_field = 'BMS_brickVoltageMin' THEN 'BrickVoltageMin' ELSE source_field END AS source_field, unit AS unit, quality, (quality = 'reported_unverified' AND ((source = 'can' AND path = 'Vehicle.CAN.x332.BMS_brickVoltageMax' AND source_field = 'BMS_brickVoltageMax') OR (source = 'can' AND path = 'Vehicle.CAN.x332.BMS_brickVoltageMin' AND source_field = 'BMS_brickVoltageMin'))) AS can_report FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, source_field ORDER BY event_time DESC, ingest_time DESC, envelope_id DESC) AS latest_rank FROM signals WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field IN ('BrickVoltageMax', 'NumBrickVoltageMax', 'BrickVoltageMin', 'NumBrickVoltageMin')) SELECT vehicle, source, decode_epoch, MAX(CASE WHEN source_field = 'BrickVoltageMin' AND unit = 'V' AND (quality IS NULL OR quality IN ('ok', 'valid', 'unit_unverified') OR can_report) THEN value_num END) AS reading, CONCAT('셀 #', CAST(CAST(MAX(CASE WHEN source_field = 'NumBrickVoltageMin' AND (quality IS NULL OR quality IN ('ok', 'valid', 'unit_unverified') OR can_report) AND value_num >= 1 AND value_num = floor(value_num) THEN value_num END) AS BIGINT) AS STRING)) AS cell FROM latest WHERE latest_rank = 1 GROUP BY vehicle, source, decode_epoch ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"volt","noValue":"판단 불가","color":{"mode":"fixed","fixedColor":"#3274D9"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"판단 불가","color":"#6E7681","index":0}}}],"decimals":3,"displayName":"$${__data.fields.cell}"},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value_and_name","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":true},"text":{"valueSize":32,"titleSize":12}},"gridPos":{"x":6,"y":17,"w":6,"h":5}},
      {"id":28,"type":"stat","title":"셀 전압 차이 (최고 − 최저)","description":"분석 구간의 최고·최저 셀 전압 차이입니다(mV로 표시). 값이 작을수록 셀이 고르게 맞춰져 있다는 뜻이지만, 크기만으로 고장을 판정하지 않습니다. 충전·주행 중에는 일시적으로 커질 수 있습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric` ORDER BY window_start DESC, computed_at DESC, revision DESC) AS latest_rank FROM revisions WHERE revision_rank = 1) SELECT vehicle, source, decode_epoch, CAST(window_start AS TIMESTAMP(6)) AS observed_at, CASE WHEN status IN ('reported', 'derived', 'estimated') AND unit = 'V' THEN `value` ELSE NULL END AS reading FROM latest WHERE latest_rank = 1 AND `metric` = 'battery.conditions.brick_spread_v' ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"volt","decimals":1,"noValue":"판단 불가","color":{"mode":"fixed","fixedColor":"#1F9E89"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"판단 불가","color":"#6E7681","index":0}}}]},"overrides":[]},"options":{"colorMode":"value","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":true},"text":{"valueSize":32,"titleSize":12}},"gridPos":{"x":12,"y":17,"w":6,"h":5}},
      {"id":46,"type":"stat","title":"최근 완료 구간 팩 전압","description":"완료된 최근 시간 구간의 마지막 교정 팩 전압(V)입니다. 단위가 V이거나 exact scope field_calibration의 scale/offset이 확인되어야 합니다. 최신 무효·미교정·stale 값과 더 최근 미분석 입력은 판단 불가입니다. 실제 관측 시각은 분석 기록 value_text(UTC)입니다. 선택 기간 끝의 바로 전 완료 시간 구간이 없으면 과거 구간 숫자를 표시하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND `metric` = 'battery.energy.latest_pack_voltage_v'), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric` ORDER BY window_start DESC, computed_at DESC, revision DESC) AS latest_rank FROM revisions WHERE revision_rank = 1), raw_frontier AS (SELECT vehicle, source, decode_epoch, MAX(event_time) AS raw_event_time, MAX(ingest_time) AS raw_ingest_time FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field IN ('PackVoltage') GROUP BY vehicle, source, decode_epoch) SELECT latest.vehicle, latest.source, latest.decode_epoch, CAST(latest.value_text AS TIMESTAMP(6)) AS observed_at, CASE WHEN latest.window_end >= FROM_UNIXTIME(CAST(FLOOR($$__unixEpochTo() / 3600) * 3600 - 1 AS BIGINT)) AND latest.status = 'derived' AND latest.unit = 'V' AND latest.value_text IS NOT NULL AND (raw.raw_event_time IS NULL OR raw.raw_event_time <= CAST(latest.value_text AS TIMESTAMP(6))) AND (raw.raw_ingest_time IS NULL OR raw.raw_ingest_time <= latest.computed_at) THEN latest.`value` ELSE NULL END AS reading FROM latest LEFT JOIN raw_frontier raw ON raw.vehicle = latest.vehicle AND raw.source = latest.source AND COALESCE(raw.decode_epoch, '') = COALESCE(latest.decode_epoch, '') WHERE latest.latest_rank = 1 ORDER BY latest.vehicle, latest.source, latest.decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"volt","noValue":"판단 불가","color":{"mode":"fixed","fixedColor":"#6E7681"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"판단 불가","color":"#6E7681","index":0}}}],"decimals":1},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"/^reading$/","values":true},"text":{"valueSize":32,"titleSize":12}},"gridPos":{"x":18,"y":17,"w":6,"h":5}},
      {"id":47,"type":"timeseries","title":"최고·최저 셀 전압","description":"두 선 사이의 폭이 셀 간 전압 차이입니다. 구간마다 최고 셀은 최댓값, 최저 셀은 최솟값을 사용합니다. 기록이 없는 구간은 선을 잇지 않습니다. 차량(Fleet Telemetry)은 96개 셀 전압을 모두 보내지 않고 가장 높은 셀·가장 낮은 셀의 전압과 번호만 보냅니다. 단위 메타데이터가 V/celsius로 확인된 유효 샘플만 표시하며, fleet/fleet-v1 자체는 교정 증거가 아닙니다. 단위 미확인은 판단 불가입니다. CAN 대응: BMS_brickVoltageMax, BMS_brickVoltageMin의 미검증 보고값입니다. 관측 시각은 위 CAN 보고값 표를 확인하세요. 단위 불일치·최신 무효 값은 과거 정상 값으로 대체하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"interval":"1m","targets":[{"refId":"A","format":"time_series","rawSql":"WITH signals AS (SELECT event_time, vehicle, source, decode_epoch, ingest_time, envelope_id, value_num, value_text, value_bool, path AS path, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x332.BMS_brickVoltageMax' AND source_field = 'BMS_brickVoltageMax' THEN 'BrickVoltageMax' WHEN source = 'can' AND path = 'Vehicle.CAN.x332.BMS_brickVoltageMin' AND source_field = 'BMS_brickVoltageMin' THEN 'BrickVoltageMin' ELSE source_field END AS source_field, unit AS unit, quality, (quality = 'reported_unverified' AND ((source = 'can' AND path = 'Vehicle.CAN.x332.BMS_brickVoltageMax' AND source_field = 'BMS_brickVoltageMax') OR (source = 'can' AND path = 'Vehicle.CAN.x332.BMS_brickVoltageMin' AND source_field = 'BMS_brickVoltageMin'))) AS can_report FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT CAST(date_bin(INTERVAL $$__interval_ms MILLISECOND, event_time) AS TIMESTAMP(6)) AS `time`, CONCAT(CASE source_field WHEN 'BrickVoltageMax' THEN '최고 셀' WHEN 'BrickVoltageMin' THEN '최저 셀' END, ' · ', vehicle, '/', source, '/', COALESCE(decode_epoch, '')) AS `metric`, CASE source_field WHEN 'BrickVoltageMax' THEN MAX(value_num) WHEN 'BrickVoltageMin' THEN MIN(value_num) END AS `value` FROM signals WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field IN ('BrickVoltageMax', 'BrickVoltageMin') AND unit = 'V' AND value_num IS NOT NULL AND (quality IS NULL OR quality IN ('ok', 'valid', 'unit_unverified') OR can_report) GROUP BY 1, vehicle, source, decode_epoch, source_field ORDER BY 1","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"volt","noValue":"기록 없음","custom":{"drawStyle":"line","lineInterpolation":"smooth","lineWidth":2,"fillOpacity":0,"gradientMode":"opacity","showPoints":"never","spanNulls":false,"axisBorderShow":false,"axisPlacement":"auto","barAlignment":0,"barWidthFactor":0.8,"pointSize":4,"stacking":{"mode":"none","group":"A"},"thresholdsStyle":{"mode":"off"}},"color":{"mode":"palette-classic"},"decimals":3},"overrides":[{"matcher":{"id":"byRegexp","options":"^최고 셀.*"},"properties":[{"id":"color","value":{"mode":"fixed","fixedColor":"#56A64B"}}]},{"matcher":{"id":"byRegexp","options":"^최저 셀.*"},"properties":[{"id":"color","value":{"mode":"fixed","fixedColor":"#3274D9"}}]}]},"options":{"legend":{"displayMode":"list","placement":"bottom","showLegend":true,"calcs":[]},"tooltip":{"mode":"multi","sort":"desc"}},"gridPos":{"x":0,"y":22,"w":16,"h":9}},
      {"id":48,"type":"bargauge","title":"자주 최저가 되는 셀","description":"선택 기간에 자주 최저가 되는 셀로 보고된 횟수입니다. 같은 셀이 반복되면 차량 정비 시 참고할 수 있지만 고장 판정은 아닙니다. 차량(Fleet Telemetry)은 96개 셀 전압을 모두 보내지 않고 가장 높은 셀·가장 낮은 셀의 전압과 번호만 보냅니다. 셀 번호는 물리 전압 교정이 아닌 정수 식별자 보고입니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT CONCAT('셀 #', CAST(CAST(value_num AS BIGINT) AS STRING)) AS cell, COUNT(*) AS reports FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND source = 'fleet' AND decode_epoch = 'fleet-v1' AND source_field = 'NumBrickVoltageMin' AND value_num >= 1 AND value_num = floor(value_num) AND (quality IS NULL OR quality IN ('ok', 'unit_unverified')) GROUP BY 1 ORDER BY reports DESC LIMIT 8","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"none","decimals":0,"min":0,"noValue":"기록 없음","color":{"mode":"fixed","fixedColor":"#3274D9"}},"overrides":[{"matcher":{"id":"byName","options":"reports"},"properties":[{"id":"displayName","value":"$${__data.fields.cell}"}]}]},"options":{"displayMode":"gradient","orientation":"horizontal","showUnfilled":true,"valueMode":"text","namePlacement":"left","sizing":"auto","minVizHeight":14,"maxVizHeight":22,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":true},"text":{"titleSize":12,"valueSize":12}},"gridPos":{"x":16,"y":22,"w":8,"h":9}},
      {"id":49,"type":"timeseries","title":"셀 전압 차이 추이","description":"같은 시각에 들어온 최고·최저 셀 전압의 차이(mV)입니다. 구간별 최대·평균을 표시합니다. 차량(Fleet Telemetry)은 96개 셀 전압을 모두 보내지 않고 가장 높은 셀·가장 낮은 셀의 전압과 번호만 보냅니다. 단위 메타데이터가 V/celsius로 확인된 유효 샘플만 표시하며, fleet/fleet-v1 자체는 교정 증거가 아닙니다. 단위 미확인은 판단 불가입니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"interval":"5m","targets":[{"refId":"A","format":"time_series","rawSql":"SELECT CAST(date_bin(INTERVAL $$__interval_ms MILLISECOND, mx.event_time) AS TIMESTAMP(6)) AS `time`, CONCAT(mx.vehicle, ' · ', mx.source, '/', COALESCE(mx.decode_epoch, '')) AS `metric`, MAX(mx.value_num - mn.value_num) * 1000 AS `최대 차이`, AVG(mx.value_num - mn.value_num) * 1000 AS `평균 차이` FROM vehicle_signal mx JOIN vehicle_signal mn ON mn.event_time = mx.event_time AND mn.vehicle = mx.vehicle AND mn.source = mx.source AND mn.decode_epoch = mx.decode_epoch AND mn.source_field = 'BrickVoltageMin' WHERE mx.source_field = 'BrickVoltageMax' AND $$__timeFilter(mx.event_time) AND $$__timeFilter(mn.event_time) AND ($${vehicle:sqlstring} = '' OR mx.vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR mx.source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(mx.decode_epoch, '') = $${epoch:sqlstring}) AND mx.unit = 'V' AND mn.unit = 'V' AND mx.value_num IS NOT NULL AND mn.value_num IS NOT NULL AND (mx.quality IS NULL OR mx.quality IN ('ok', 'valid', 'unit_unverified')) AND (mn.quality IS NULL OR mn.quality IN ('ok', 'valid', 'unit_unverified')) GROUP BY 1, mx.vehicle, mx.source, mx.decode_epoch ORDER BY 1","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"mvolt","noValue":"기록 없음","custom":{"drawStyle":"line","lineInterpolation":"smooth","lineWidth":2,"fillOpacity":12,"gradientMode":"opacity","showPoints":"never","spanNulls":false,"axisBorderShow":false,"axisPlacement":"auto","barAlignment":0,"barWidthFactor":0.8,"pointSize":4,"stacking":{"mode":"none","group":"A"},"thresholdsStyle":{"mode":"off"}},"color":{"mode":"palette-classic"},"decimals":0},"overrides":[{"matcher":{"id":"byName","options":"최대 차이"},"properties":[{"id":"color","value":{"mode":"fixed","fixedColor":"#FF9830"}}]},{"matcher":{"id":"byName","options":"평균 차이"},"properties":[{"id":"color","value":{"mode":"fixed","fixedColor":"#1F9E89"}}]}]},"options":{"legend":{"displayMode":"list","placement":"bottom","showLegend":true,"calcs":[]},"tooltip":{"mode":"multi","sort":"desc"}},"gridPos":{"x":0,"y":31,"w":16,"h":7}},
      {"id":50,"type":"bargauge","title":"자주 최고가 되는 셀","description":"선택 기간에 자주 최고가 되는 셀로 보고된 횟수입니다. 같은 셀이 반복되면 차량 정비 시 참고할 수 있지만 고장 판정은 아닙니다. 차량(Fleet Telemetry)은 96개 셀 전압을 모두 보내지 않고 가장 높은 셀·가장 낮은 셀의 전압과 번호만 보냅니다. 셀 번호는 물리 전압 교정이 아닌 정수 식별자 보고입니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT CONCAT('셀 #', CAST(CAST(value_num AS BIGINT) AS STRING)) AS cell, COUNT(*) AS reports FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND source = 'fleet' AND decode_epoch = 'fleet-v1' AND source_field = 'NumBrickVoltageMax' AND value_num >= 1 AND value_num = floor(value_num) AND (quality IS NULL OR quality IN ('ok', 'unit_unverified')) GROUP BY 1 ORDER BY reports DESC LIMIT 8","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"none","decimals":0,"min":0,"noValue":"기록 없음","color":{"mode":"fixed","fixedColor":"#56A64B"}},"overrides":[{"matcher":{"id":"byName","options":"reports"},"properties":[{"id":"displayName","value":"$${__data.fields.cell}"}]}]},"options":{"displayMode":"gradient","orientation":"horizontal","showUnfilled":true,"valueMode":"text","namePlacement":"left","sizing":"auto","minVizHeight":14,"maxVizHeight":22,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":true},"text":{"titleSize":12,"valueSize":12}},"gridPos":{"x":16,"y":31,"w":8,"h":7}},
      {"id":61,"type":"row","title":"온도","collapsed":false,"gridPos":{"x":0,"y":38,"w":24,"h":1},"panels":[]},
      {"id":51,"type":"stat","title":"배터리 최고 온도","description":"배터리 모듈 온도 중 가장 높은 값(ModuleTempMax)입니다. 외기 온도가 아닙니다. 단위 메타데이터가 V/celsius로 확인된 유효 샘플만 표시하며, fleet/fleet-v1 자체는 교정 증거가 아닙니다. 단위 미확인은 판단 불가입니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, source_field ORDER BY event_time DESC, ingest_time DESC, envelope_id DESC) AS latest_rank FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field IN ('ModuleTempMax', 'ModuleTempMin')) SELECT vehicle, source, decode_epoch, MAX(CASE WHEN source_field = 'ModuleTempMax' AND unit = 'celsius' AND (quality IS NULL OR quality IN ('ok', 'valid', 'unit_unverified')) THEN value_num END) AS pack_max, MAX(CASE WHEN source_field = 'ModuleTempMin' AND unit = 'celsius' AND (quality IS NULL OR quality IN ('ok', 'valid', 'unit_unverified')) THEN value_num END) AS pack_min FROM latest WHERE latest_rank = 1 GROUP BY vehicle, source, decode_epoch ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"celsius","noValue":"판단 불가","color":{"mode":"fixed","fixedColor":"#FF9830"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"판단 불가","color":"#6E7681","index":0}}}],"decimals":1},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"/^pack_max$/","values":true},"text":{"valueSize":30,"titleSize":12}},"gridPos":{"x":0,"y":39,"w":6,"h":4}},
      {"id":52,"type":"stat","title":"배터리 최저 온도","description":"배터리 모듈 온도 중 가장 낮은 값(ModuleTempMin)입니다. 단위 메타데이터가 V/celsius로 확인된 유효 샘플만 표시하며, fleet/fleet-v1 자체는 교정 증거가 아닙니다. 단위 미확인은 판단 불가입니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, source_field ORDER BY event_time DESC, ingest_time DESC, envelope_id DESC) AS latest_rank FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field IN ('ModuleTempMax', 'ModuleTempMin')) SELECT vehicle, source, decode_epoch, MAX(CASE WHEN source_field = 'ModuleTempMax' AND unit = 'celsius' AND (quality IS NULL OR quality IN ('ok', 'valid', 'unit_unverified')) THEN value_num END) AS pack_max, MAX(CASE WHEN source_field = 'ModuleTempMin' AND unit = 'celsius' AND (quality IS NULL OR quality IN ('ok', 'valid', 'unit_unverified')) THEN value_num END) AS pack_min FROM latest WHERE latest_rank = 1 GROUP BY vehicle, source, decode_epoch ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"celsius","noValue":"판단 불가","color":{"mode":"fixed","fixedColor":"#E0B400"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"판단 불가","color":"#6E7681","index":0}}}],"decimals":1},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"/^pack_min$/","values":true},"text":{"valueSize":30,"titleSize":12}},"gridPos":{"x":6,"y":39,"w":6,"h":4}},
      {"id":29,"type":"stat","title":"배터리 온도 차이","description":"최고·최저 배터리 모듈 온도의 차이입니다. 온도 교정이 확인된 결과만 표시하며, 외기 온도가 아닙니다. 정상·위험 구간을 임의로 정하지 않습니다. 개별 값의 관측 시각과 차량 식별자는 아래 분석 기록에서 확인할 수 있습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH revisions AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric`, window_start ORDER BY computed_at DESC, revision DESC) AS revision_rank FROM vehicle_analysis WHERE $$__timeFilter(window_start) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, analysis_id, `metric` ORDER BY window_start DESC, computed_at DESC, revision DESC) AS latest_rank FROM revisions WHERE revision_rank = 1) SELECT vehicle, source, decode_epoch, CAST(window_start AS TIMESTAMP(6)) AS observed_at, CASE WHEN status IN ('reported', 'derived', 'estimated') AND unit = 'celsius' THEN `value` ELSE NULL END AS reading FROM latest WHERE latest_rank = 1 AND `metric` = 'battery.conditions.thermal_spread_c' ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"celsius","decimals":1,"noValue":"판단 불가","color":{"mode":"fixed","fixedColor":"#1F9E89"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"판단 불가","color":"#6E7681","index":0}}}]},"overrides":[]},"options":{"colorMode":"value","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":true},"text":{"valueSize":30,"titleSize":12}},"gridPos":{"x":12,"y":39,"w":6,"h":4}},
      {"id":53,"type":"stat","title":"실내 / 외기 · 보고값","description":"가장 최근 실내(InsideTemp)·외기(OutsideTemp) 온도입니다. 배터리 온도와 비교해 보세요. CAN 대응: VCRIGHT_tempAmbientRaw의 미검증 보고값입니다. 관측 시각은 위 CAN 보고값 표를 확인하세요. 단위 불일치·최신 무효 값은 과거 정상 값으로 대체하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"targets":[{"refId":"A","format":"table","rawSql":"WITH signals AS (SELECT event_time, vehicle, source, decode_epoch, ingest_time, envelope_id, value_num, value_text, value_bool, path AS path, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x20C.VCRIGHT_tempAmbientRaw' AND source_field = 'VCRIGHT_tempAmbientRaw' THEN 'OutsideTemp' ELSE source_field END AS source_field, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x20C.VCRIGHT_tempAmbientRaw' AND source_field = 'VCRIGHT_tempAmbientRaw' AND unit = '°C' THEN 'celsius' ELSE unit END AS unit, quality, (quality = 'reported_unverified' AND ((source = 'can' AND path = 'Vehicle.CAN.x20C.VCRIGHT_tempAmbientRaw' AND source_field = 'VCRIGHT_tempAmbientRaw'))) AS can_report FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})), latest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY vehicle, source, decode_epoch, source_field ORDER BY event_time DESC, ingest_time DESC, envelope_id DESC) AS latest_rank FROM signals WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field IN ('InsideTemp', 'OutsideTemp')) SELECT vehicle, source, decode_epoch, MAX(CASE WHEN source_field = 'InsideTemp' AND (quality IS NULL OR quality = 'ok' OR can_report) AND unit = 'celsius' THEN value_num END) AS cabin, MAX(CASE WHEN source_field = 'OutsideTemp' AND (quality IS NULL OR quality = 'ok' OR can_report) AND unit = 'celsius' THEN value_num END) AS outside FROM latest WHERE latest_rank = 1 GROUP BY vehicle, source, decode_epoch ORDER BY vehicle, source, decode_epoch","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"celsius","noValue":"기록 없음","color":{"mode":"fixed","fixedColor":"#6E7681"},"mappings":[{"type":"special","options":{"match":"null","result":{"text":"기록 없음","color":"#6E7681","index":0}}}],"decimals":1},"overrides":[{"matcher":{"id":"byName","options":"cabin"},"properties":[{"id":"displayName","value":"실내"}]},{"matcher":{"id":"byName","options":"outside"},"properties":[{"id":"displayName","value":"외기"}]}]},"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","textMode":"value_and_name","wideLayout":true,"showPercentChange":false,"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":true},"text":{"valueSize":22,"titleSize":12}},"gridPos":{"x":18,"y":39,"w":6,"h":4}},
      {"id":54,"type":"timeseries","title":"배터리·실내·외기 온도","description":"배터리 모듈 최고·최저(celsius 단위 확인)와 실내·외기 온도입니다. 기록이 없는 구간은 선을 잇지 않습니다. CAN 대응: VCRIGHT_tempAmbientRaw의 미검증 보고값입니다. 관측 시각은 위 CAN 보고값 표를 확인하세요. 단위 불일치·최신 무효 값은 과거 정상 값으로 대체하지 않습니다.","datasource":{"type":"mysql","uid":"greptime-mysql"},"interval":"5m","targets":[{"refId":"A","format":"time_series","rawSql":"SELECT CAST(date_bin(INTERVAL $$__interval_ms MILLISECOND, event_time) AS TIMESTAMP(6)) AS `time`, CONCAT(CASE source_field WHEN 'ModuleTempMax' THEN '배터리 최고' WHEN 'ModuleTempMin' THEN '배터리 최저' END, ' · ', vehicle, '/', source, '/', COALESCE(decode_epoch, '')) AS `metric`, CASE source_field WHEN 'ModuleTempMax' THEN MAX(value_num) WHEN 'ModuleTempMin' THEN MIN(value_num) END AS `value` FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field IN ('ModuleTempMax', 'ModuleTempMin') AND unit = 'celsius' AND value_num IS NOT NULL AND (quality IS NULL OR quality IN ('ok', 'valid', 'unit_unverified')) GROUP BY 1, vehicle, source, decode_epoch, source_field ORDER BY 1","datasource":{"type":"mysql","uid":"greptime-mysql"}},{"refId":"B","format":"time_series","rawSql":"WITH signals AS (SELECT event_time, vehicle, source, decode_epoch, ingest_time, envelope_id, value_num, value_text, value_bool, path AS path, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x20C.VCRIGHT_tempAmbientRaw' AND source_field = 'VCRIGHT_tempAmbientRaw' THEN 'OutsideTemp' ELSE source_field END AS source_field, CASE WHEN source = 'can' AND path = 'Vehicle.CAN.x20C.VCRIGHT_tempAmbientRaw' AND source_field = 'VCRIGHT_tempAmbientRaw' AND unit = '°C' THEN 'celsius' ELSE unit END AS unit, quality, (quality = 'reported_unverified' AND ((source = 'can' AND path = 'Vehicle.CAN.x20C.VCRIGHT_tempAmbientRaw' AND source_field = 'VCRIGHT_tempAmbientRaw'))) AS can_report FROM vehicle_signal WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring})) SELECT CAST(date_bin(INTERVAL $$__interval_ms MILLISECOND, event_time) AS TIMESTAMP(6)) AS `time`, CONCAT(CASE source_field WHEN 'InsideTemp' THEN '실내' WHEN 'OutsideTemp' THEN '외기' END, CONCAT(' · ', vehicle, '/', source, '/', COALESCE(decode_epoch, ''))) AS `metric`, CASE source_field WHEN 'InsideTemp' THEN AVG(value_num) WHEN 'OutsideTemp' THEN AVG(value_num) END AS `value` FROM signals WHERE $$__timeFilter(event_time) AND ($${vehicle:sqlstring} = '' OR vehicle = $${vehicle:sqlstring}) AND ($${source:sqlstring} = '' OR source = $${source:sqlstring}) AND ($${epoch:sqlstring} = '' OR COALESCE(decode_epoch, '') = $${epoch:sqlstring}) AND source_field IN ('InsideTemp', 'OutsideTemp') AND unit = 'celsius' AND value_num IS NOT NULL AND (quality IS NULL OR quality = 'ok' OR can_report) GROUP BY 1, vehicle, source, decode_epoch, source_field ORDER BY 1","datasource":{"type":"mysql","uid":"greptime-mysql"}}],"fieldConfig":{"defaults":{"unit":"celsius","noValue":"기록 없음","custom":{"drawStyle":"line","lineInterpolation":"smooth","lineWidth":2,"fillOpacity":0,"gradientMode":"opacity","showPoints":"never","spanNulls":false,"axisBorderShow":false,"axisPlacement":"auto","barAlignment":0,"barWidthFactor":0.8,"pointSize":4,"stacking":{"mode":"none","group":"A"},"thresholdsStyle":{"mode":"off"}},"color":{"mode":"palette-classic"},"decimals":1},"overrides":[{"matcher":{"id":"byRegexp","options":"^배터리 최고.*"},"properties":[{"id":"color","value":{"mode":"fixed","fixedColor":"#FF9830"}}]},{"matcher":{"id":"byRegexp","options":"^배터리 최저.*"},"properties":[{"id":"color","value":{"mode":"fixed","fixedColor":"#E0B400"}}]},{"matcher":{"id":"byRegexp","options":"^(실내|외기).*"},"properties":[{"id":"custom.lineStyle","value":{"fill":"dash","dash":[6,4]}},{"id":"custom.lineWidth","value":1}]},{"matcher":{"id":"byRegexp","options":"^실내.*"},"properties":[{"id":"color","value":{"mode":"fixed","fixedColor":"#A352CC"}}]},{"matcher":{"id":"byRegexp","options":"^외기.*"},"properties":[{"id":"color","value":{"mode":"fixed","fixedColor":"#6E7681"}}]}]},"options":{"legend":{"displayMode":"list","placement":"bottom","showLegend":true,"calcs":[]},"tooltip":{"mode":"multi","sort":"desc"}},"gridPos":{"x":0,"y":43,"w":24,"h":8}},
