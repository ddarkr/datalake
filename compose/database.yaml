# Database fragment: schema init + scheduled aggregation.
# Core owns the greptimedb service and greptime-data/greptime-etc volumes;
# this fragment only references them (never redefines). Top-level shape is
# services/configs/volumes only. Scripts are embedded by tools/render.py via
# x-source (no external file refs in the final bundle).
#
# Backup owns backup-data; aggregate shares it only for operational status.
#
# Battery analytics ride on the existing aggregate service (profile: server).
# The cached aggregate venv adds Flight transport dependencies, not scipy:
# battery_reference .mat loading remains unavailable; its stdlib record/JSON
# helpers stay importable. Analysis JSON mounts
# read-only from a native Compose config. Public defaults are {}; operator
# calibration/model JSON comes from the private .env or Compose override.
# x-source paths are constrained to the repository, not checked against Git;
# never embed private data in tracked fragments or the generated bundle.

services:
  db-schema:
    image: ${PYTHON_IMAGE:-python:3.12.8-slim-bookworm}
    profiles: [server]
    # Inline script changes need a service revision to trigger recreation.
    labels:
      datalake.schema-revision: "7"
    depends_on:
      greptimedb:
        condition: service_started
    environment:
      GREPTIME_HTTP_URL: http://greptimedb:4000
      GREPTIME_DB: ${GREPTIME_DB:-datalake}
      GREPTIME_USER: ${GREPTIME_USER:-datalake}
      GREPTIME_PASSWORD: ${GREPTIME_PASSWORD:-}
      DB_INIT_WAIT_S: ${DB_INIT_WAIT_S:-300}
      OTEL_TTL: ${OTEL_TTL:-}
    configs:
      - source: db_init_py
        target: /app/scripts/database/db_init.py
        mode: 0444
      - source: activity_py
        target: /app/scripts/telemetry/activity.py
        mode: 0444
    working_dir: /app
    command: ["python", "-m", "scripts.database.db_init"]
    restart: "no"

  aggregate-deps:
    image: ${PYTHON_IMAGE:-python:3.12.8-slim-bookworm}
    profiles: [server]
    volumes:
      - aggregate-venv:/opt/venv
    command:
      - /bin/sh
      - -ec
      - >-
        printf '%s\n' 'grpcio==1.84.0' 'pyarrow==25.0.1' 'protobuf==6.33.6' > /tmp/.aggregate_requirements;
        python3 -c 'import sys; print(sys.implementation.cache_tag)' > /tmp/.aggregate_want;
        cat /tmp/.aggregate_requirements >> /tmp/.aggregate_want;
        if test -f /opt/venv/.aggregate_ready &&
        cmp -s /tmp/.aggregate_want /opt/venv/.aggregate_ready; then exit 0; fi;
        python3 -m venv --clear /opt/venv &&
        /opt/venv/bin/pip install --no-cache-dir --only-binary=:all: -r /tmp/.aggregate_requirements &&
        cp /tmp/.aggregate_want /opt/venv/.aggregate_ready
    restart: "no"

  aggregate:
    image: ${PYTHON_IMAGE:-python:3.12.8-slim-bookworm}
    profiles: [server]
    labels:
      datalake.aggregate-revision: "17"
    depends_on:
      greptimedb:
        condition: service_started
      db-schema:
        condition: service_completed_successfully
      aggregate-deps:
        condition: service_completed_successfully
    environment:
      # Pass progress must reach docker logs immediately; block-buffered
      # stdout hid a 17-minute backfill pass behind an empty log.
      PYTHONUNBUFFERED: "1"
      GREPTIME_HTTP_URL: http://greptimedb:4000
      GREPTIME_GRPC_URL: ${GREPTIME_GRPC_URL:-grpc://greptimedb:4001}
      GREPTIME_DB: ${GREPTIME_DB:-datalake}
      GREPTIME_USER: ${GREPTIME_USER:-datalake}
      GREPTIME_PASSWORD: ${GREPTIME_PASSWORD:-}
      AGG_INTERVAL_SECONDS: ${AGG_INTERVAL_SECONDS:-300}
      AGG_LOOKBACK_HOURS: ${AGG_LOOKBACK_HOURS:-30}
      AGG_MAX_ROWS: ${AGG_MAX_ROWS:-200000}
      AGG_AI_FULL_REBUILD: ${AGG_AI_FULL_REBUILD:-}
      BATTERY_ANALYSIS_CONFIG: ${BATTERY_ANALYSIS_CONFIG:-/app/battery-analysis.json}
      BATTERY_LOOKBACK_HOURS: ${BATTERY_LOOKBACK_HOURS:-}
      BATTERY_MAX_ROWS: ${BATTERY_MAX_ROWS:-}
      BATTERY_BACKFILL_START: ${BATTERY_BACKFILL_START:-}
      BATTERY_BACKFILL_END: ${BATTERY_BACKFILL_END:-}
      OTEL_TTL: ${OTEL_TTL:-}
      HOME_RAW_TTL: ${HOME_RAW_TTL:-90d}
      VEHICLE_SPEED_PATH: ${VEHICLE_SPEED_PATH:-}
      VEHICLE_SOC_PATH: ${VEHICLE_SOC_PATH:-}
      VEHICLE_DRIVE_ENERGY_PATH: ${VEHICLE_DRIVE_ENERGY_PATH:-}
      VEHICLE_CHARGE_ENERGY_PATH: ${VEHICLE_CHARGE_ENERGY_PATH:-}
      VEHICLE_CHARGING_POWER_PATH: ${VEHICLE_CHARGING_POWER_PATH:-}
      VEHICLE_CHARGING_PATH: ${VEHICLE_CHARGING_PATH:-}
      VEHICLE_ID: ${VEHICLE_ID:-}
      TRIP_GAP_MINUTES: ${TRIP_GAP_MINUTES:-10}
      TRIP_MIN_SPEED_KPH: ${TRIP_MIN_SPEED_KPH:-1}
      CHARGE_GAP_MINUTES: ${CHARGE_GAP_MINUTES:-30}
      VEHICLE_SIGNAL_MAX_AGE_SECONDS: ${VEHICLE_SIGNAL_MAX_AGE_SECONDS:-300}
      HOME_AGG_SOURCES: "${HOME_AGG_SOURCES:-[]}"
    configs:
      - source: aggregate_py
        target: /app/scripts/analytics/aggregate.py
        mode: 0444
      - source: greptime_flight_py
        target: /app/scripts/database/greptime_flight.py
        mode: 0444
      - source: activity_py
        target: /app/scripts/telemetry/activity.py
        mode: 0444
      - source: battery_common_py
        target: /app/scripts/analytics/battery/battery_common.py
        mode: 0444
      - source: battery_reference_py
        target: /app/scripts/analytics/battery/battery_reference.py
        mode: 0444
      - source: battery_conditions_py
        target: /app/scripts/analytics/battery/battery_conditions.py
        mode: 0444
      - source: battery_energy_py
        target: /app/scripts/analytics/battery/battery_energy.py
        mode: 0444
      - source: battery_electrical_py
        target: /app/scripts/analytics/battery/battery_electrical.py
        mode: 0444
      - source: battery_rul_py
        target: /app/scripts/analytics/battery/battery_rul.py
        mode: 0444
      - source: battery_alerts_py
        target: /app/scripts/analytics/battery/battery_alerts.py
        mode: 0444
      - source: battery_runtime_py
        target: /app/scripts/analytics/battery/battery_runtime.py
        mode: 0444
      - source: battery_analysis_json
        target: /app/battery-analysis.json
        mode: 0444
    volumes:
      - backup-data:/ops
      - aggregate-venv:/opt/venv:ro
    working_dir: /app
    command: ["/opt/venv/bin/python", "-m", "scripts.analytics.aggregate"]
    restart: unless-stopped
    stop_grace_period: 30s

configs:
  db_init_py:
    x-source: scripts/database/db_init.py
  aggregate_py:
    x-source: scripts/analytics/aggregate.py
  greptime_flight_py:
    x-source: scripts/database/greptime_flight.py
  activity_py:
    x-source: scripts/telemetry/activity.py
  battery_common_py:
    x-source: scripts/analytics/battery/battery_common.py
  battery_reference_py:
    x-source: scripts/analytics/battery/battery_reference.py
  battery_conditions_py:
    x-source: scripts/analytics/battery/battery_conditions.py
  battery_energy_py:
    x-source: scripts/analytics/battery/battery_energy.py
  battery_electrical_py:
    x-source: scripts/analytics/battery/battery_electrical.py
  battery_rul_py:
    x-source: scripts/analytics/battery/battery_rul.py
  battery_alerts_py:
    x-source: scripts/analytics/battery/battery_alerts.py
  battery_runtime_py:
    x-source: scripts/analytics/battery/battery_runtime.py
  battery_analysis_json:
    content: ${BATTERY_ANALYSIS_CONFIG_JSON:-{}}

volumes:
  aggregate-venv:
