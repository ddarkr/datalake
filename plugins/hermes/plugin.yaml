manifest_version: 2
name: datalake-usage
version: "1.0.0"
description: "Metadata-only request usage, logical-call latency and allowlisted wire settings over direct bounded OTLP HTTP. Opt-in; unavailable provider timing stays absent."
kind: standalone
provides_hooks:
  - pre_api_request
  - api_request_error
  - post_api_request
  - post_auxiliary_call
config_schema:
  endpoint:
    type: string
    description: "OTLP HTTP collector URL; HTTPS except loopback. Empty disables export."
    default: ""
  capture_auxiliary:
    type: boolean
    default: false
    description: "Capture auxiliary calls; opt-in can double count nonstreaming main MoA aggregators. Main-only is conservative default."
  timeout_seconds:
    type: number
    default: 2
    description: "HTTP socket timeout, 0.1 to 5 seconds."
